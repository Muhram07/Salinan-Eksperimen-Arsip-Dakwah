        function saveCurrentProjectAuto(customName) {
            let list = getProjectsList();
            let p = list.find(x => x.id === currentProjectId);
            const thumb = (mainCanvas && typeof mainCanvas.toDataURL === 'function') ? mainCanvas.toDataURL('image/jpeg', 0.5) : '';

            if (!p) {
                p = {
                    id: currentProjectId || ('proj_' + Date.now()),
                    name: customName || ('Projek Dakwah ' + (list.length + 1)),
                    ratio: currentRatio,
                    slideCount: slides.length,
                    thumb: thumb,
                    slides: serializeSlides(slides),
                    updatedAt: Date.now()
                };
                list.unshift(p);
            } else {
                if (customName) p.name = customName;
                p.ratio = currentRatio;
                p.slideCount = slides.length;
                p.thumb = thumb;
                p.slides = serializeSlides(slides);
                p.updatedAt = Date.now();
            }
            saveProjectsList(list);
        }

        function renderProjectList() {
            let list = getProjectsList();
            const container = document.getElementById('projectGridContainer');
            if (!container) return;
            container.innerHTML = '';

            if (list.length === 0) {
                saveCurrentProjectAuto('Projek Dakwah 1');
                list = getProjectsList();
            }

            list.forEach(p => {
                const isCurrent = p.id === currentProjectId;
                const ratioCss = p.ratio ? p.ratio.replace(':', '/') : '4/5';
                const card = document.createElement('div');
                card.className = `project-card ${isCurrent ? 'active' : ''}`;
                card.innerHTML = `
                    <img class="project-thumb" style="aspect-ratio:${ratioCss};" src="${p.thumb || ''}" onerror="this.style.display='none'">
                    <div class="project-title" title="${p.name}">${p.name}</div>
                    <div class="project-meta">Rasio: ${p.ratio || '4:5'} • ${p.slideCount || 1} Slide</div>
                    <div class="project-meta">${new Date(p.updatedAt || Date.now()).toLocaleDateString('id-ID')}</div>
                    <div class="project-actions">
                        <button class="btn-proj-action" onclick="loadProjectById('${p.id}')">Buka</button>
                        <button class="btn-proj-action" onclick="duplicateProjectById('${p.id}')">Salin</button>
                        <button class="btn-proj-action" onclick="deleteProjectById('${p.id}')" style="color:#ff6b6b;">Hapus</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function createNewProjectPrompt() {
            const name = prompt('Nama projek baru:', 'Projek Dakwah ' + (getProjectsList().length + 1));
            if (!name) return;
            saveCurrentProjectAuto();
            currentProjectId = 'proj_' + Date.now();
            slides = [createDefaultSlide()];
            currentSlideIndex = 0;
            currentRatio = '4:5';
            document.getElementById('currentRatioLabel').innerText = '4:5';
            adjustArtboardSize();
            renderAll();
            renderCarouselThumbs();
            pushHistoryState();
            saveCurrentProjectAuto(name);
            closeProjectModal();
            showToast(`✅ Projek "${name}" dibuat!`);
        }

        function saveAsNewProjectPrompt() {
            const name = prompt('Nama salinan projek:', 'Salinan ' + (new Date().toLocaleTimeString()));
            if (!name) return;
            currentProjectId = 'proj_' + Date.now();
            saveCurrentProjectAuto(name);
            renderProjectList();
            showToast(`✅ Disimpan sebagai projek baru!`);
        }

        function loadProjectById(id) {
            saveCurrentProjectAuto();
            const list = getProjectsList();
            const p = list.find(x => x.id === id);
            if (!p) return;

            currentProjectId = p.id;
            currentRatio = p.ratio || '4:5';
            document.getElementById('currentRatioLabel').innerText = currentRatio;
            slides = deserializeSlides(p.slides || []);
            currentSlideIndex = 0;
            adjustArtboardSize();
            renderAll();
            renderCarouselThumbs();
            renderBottomToolbar();
            pushHistoryState();
            closeProjectModal();
            showToast(`✅ Membuka projek: ${p.name}`);
        }

        function duplicateProjectById(id) {
            const list = getProjectsList();
            const p = list.find(x => x.id === id);
            if (!p) return;
            const copy = JSON.parse(JSON.stringify(p));
            copy.id = 'proj_' + Date.now();
            copy.name = 'Salinan ' + p.name;
            copy.updatedAt = Date.now();
            list.unshift(copy);
            saveProjectsList(list);
            renderProjectList();
            showToast(`✅ Projek diduplikasi!`);
        }

        function deleteProjectById(id) {
            let list = getProjectsList();
            if (list.length <= 1) {
                alert('Minimal harus ada 1 projek.');
                return;
            }
            if (confirm('Hapus projek ini secara permanen dari browser?')) {
                list = list.filter(x => x.id !== id);
                saveProjectsList(list);
                if (currentProjectId === id) loadProjectById(list[0].id);
                else renderProjectList();
                showToast('🗑️ Projek dihapus!');
            }
        }

        /* =========================================================================
           EKSPOR RESOLUSI ULTRA HD & PRO MAX
           ========================================================================= */
        function exportPoster() {
            deselectElement();
            showToast('Menyiapkan gambar resolusi tinggi...');

            const qualityMultiplier = parseFloat(document.getElementById('exportQualitySelect').value) || 1.5;
            const exportCanvas = document.createElement('canvas');
            const targetW = mainCanvas.width * qualityMultiplier;
            const targetH = mainCanvas.height * qualityMultiplier;
            exportCanvas.width = targetW;
            exportCanvas.height = targetH;
            const ectx = exportCanvas.getContext('2d');

            ectx.scale(qualityMultiplier, qualityMultiplier);

            const s = getCurrentSlide();
            renderBackgroundOnCtx(ectx, s.background, mainCanvas.width, mainCanvas.height);

            if (s.elements) {
                s.elements.forEach(el => {
                    if (el.type === 'text') renderTextElementOnCtx(ectx, el);
                    else if (el.type === 'image') renderImageElementOnCtx(ectx, el);
                });
            }

            setTimeout(() => {
                const link = document.createElement('a');
                link.download = `poster-dakwah-${currentRatio.replace(':', '-')}-${Date.now()}.jpg`;
                link.href = exportCanvas.toDataURL('image/jpeg', 0.98);
                link.click();
                showToast('✅ Berhasil diunduh dengan kualitas terbaik!');
            }, 120);
        }

        function renderBackgroundOnCtx(c, bg, W, H) {
            if (!bg) return;
            if (bg.img && bg.img.complete) {
                c.save();
                if (bg.blur > 0) c.filter = `blur(${bg.blur * 2}px)`;
                const baseRatio = Math.max(W / bg.img.width, H / bg.img.height);
                const scale = (bg.scale || 1.0) * baseRatio;
                const drawW = bg.img.width * scale;
                const drawH = bg.img.height * scale;
                const x = ((W - drawW) / 2) + (bg.offsetX || 0);
                const y = ((H - drawH) / 2) + (bg.offsetY || 0);
                c.drawImage(bg.img, x, y, drawW, drawH);
                c.restore();
            } else {
                const grad = c.createRadialGradient(W / 2, H * 0.35, 100, W / 2, H / 2, W);
                grad.addColorStop(0, bg.color1 || '#241a14');
                grad.addColorStop(1, bg.color2 || '#090807');
                c.fillStyle = grad;
                c.fillRect(0, 0, W, H);
            }
            if (bg.darken > 0) {
                c.fillStyle = `rgba(0,0,0,${bg.darken})`;
                c.fillRect(0, 0, W, H);
            }
        }

        function renderTextElementOnCtx(c, el) {
            c.save();
            c.translate(el.x, el.y);
            if (el.rotation) c.rotate((el.rotation * Math.PI) / 180);
            if (el.italicSlant) {
                const rad = (el.italicSlant * Math.PI) / 180;
                c.transform(1, 0, Math.tan(rad), 1, 0, 0);
            }
            c.globalAlpha = el.opacity !== undefined ? el.opacity : 1;
            const fontSize = el.fontSize;
            const lineHeight = fontSize * (el.lineHeight || 1.3);
            const cleanFont = getCleanFont(el.fontFamily);
            const maxBoxWidth = el.width || 750;
            const linesOfRuns = getWrappedLines(c, el.text, maxBoxWidth, el);
            const totalHeight = linesOfRuns.length * lineHeight;

            let startY = -(totalHeight / 2) + (lineHeight / 2);
            const letterSpace = el.letterSpacing || 0;

            linesOfRuns.forEach((lineRuns, idx) => {
                const lineY = startY + (idx * lineHeight);
                let totalLineWidth = 0;
                lineRuns.forEach(r => {
                    const fStyle = r.italic ? 'italic' : (el.fontStyle || 'normal');
                    const fWeight = r.bold ? '900' : (el.fontWeight || 'normal');
                    c.font = `${fStyle} ${fWeight} ${fontSize}px ${cleanFont}`;
                    totalLineWidth += c.measureText(r.text).width + (letterSpace * r.text.length);
                });

                let startX = -(totalLineWidth / 2);
                if (el.textAlign === 'left') startX = -(maxBoxWidth / 2);
                else if (el.textAlign === 'right') startX = (maxBoxWidth / 2) - totalLineWidth;

                if (el.highlightColor && el.highlightColor !== 'transparent') {
                    c.save();
                    c.fillStyle = el.highlightColor;
                    c.globalAlpha = (el.opacity || 1) * (el.highlightAlpha !== undefined ? el.highlightAlpha : 0.4);
                    const radius = el.highlightRadius !== undefined ? el.highlightRadius : 6;
                    c.beginPath();
                    c.roundRect(startX - 8, lineY - (lineHeight / 2) + 2, totalLineWidth + 16, lineHeight - 4, radius);
                    c.fill();
                    c.restore();
                }

                let curX = startX;
                lineRuns.forEach(run => {
                    if (!run.text) return;
                    c.save();
                    const fStyle = run.italic ? 'italic' : (el.fontStyle || 'normal');
                    const fWeight = run.bold ? '900' : (el.fontWeight || 'normal');
                    c.font = `${fStyle} ${fWeight} ${fontSize}px ${cleanFont}`;
                    c.textAlign = 'left';
                    c.textBaseline = 'middle';

                    let displayText = run.text;
                    if (el.textTransform === 'uppercase') displayText = displayText.toUpperCase();
                    else if (el.textTransform === 'lowercase') displayText = displayText.toLowerCase();
                    else if (el.textTransform === 'capitalize') displayText = displayText.replace(/\b[a-z]/g, l => l.toUpperCase());

                    const runMetrics = c.measureText(displayText);
                    const runW = runMetrics.width + (letterSpace * displayText.length);

                    if (el.shadow && el.shadow.color && el.shadow.color !== 'transparent') {
                        c.shadowColor = el.shadow.color;
                        c.shadowBlur = el.shadow.blur || 0;
                        const rad = (el.shadow.angle || 45) * Math.PI / 180;
                        const dist = el.shadow.distance || 0;
                        c.shadowOffsetX = Math.cos(rad) * dist;
                        c.shadowOffsetY = Math.sin(rad) * dist;
                    }

                    if (el.textSkinImg && el.textSkinImg.complete) {
                        drawTextWithSkinImageFull(c, displayText, curX, lineY, runW, fontSize, el);
                    } else {
                        c.fillStyle = el.color || '#fff';
                        if (letterSpace === 0) {
                            c.fillText(displayText, curX, lineY);
                        } else {
                            let charX = curX;
                            for (let chIdx = 0; chIdx < displayText.length; chIdx++) {
                                const ch = displayText[chIdx];
                                c.fillText(ch, charX, lineY);
                                charX += c.measureText(ch).width + letterSpace;
                            }
                        }
                    }
                    c.restore();
                    curX += runW;
                });
            });
            c.restore();
        }

        function renderImageElementOnCtx(c, el) {
            if (!el.img || !el.img.complete) return;
            const w = el.width || 300;
            const h = el.height || 300;
            c.save();
            c.translate(el.x, el.y);
            if (el.rotation) c.rotate((el.rotation * Math.PI) / 180);
            c.scale(el.flipH ? -1 : 1, el.flipV ? -1 : 1);
            c.globalAlpha = el.opacity !== undefined ? el.opacity : 1;

            if (el.blur && el.blur > 0) c.filter = `blur(${el.blur}px)`;

            if (el.shadow && el.shadow.color && el.shadow.color !== 'transparent') {
                c.shadowColor = el.shadow.color;
                c.shadowBlur = el.shadow.blur || 0;
                const rad = (el.shadow.angle || 45) * Math.PI / 180;
                const dist = el.shadow.distance || 0;
                c.shadowOffsetX = Math.cos(rad) * dist;
                c.shadowOffsetY = Math.sin(rad) * dist;
            }

            const radius = el.cornerRadius || 0;
            c.beginPath();
            c.roundRect(-w / 2, -h / 2, w, h, radius);
            c.clip();

            if (el.colorOverlay && el.colorOverlay !== 'none') {
                const offscreen = document.createElement('canvas');
                offscreen.width = w;
                offscreen.height = h;
                const octx = offscreen.getContext('2d');
                octx.drawImage(el.img, 0, 0, w, h);
                octx.globalCompositeOperation = 'source-in';
                octx.fillStyle = el.colorOverlay;
                octx.fillRect(0, 0, w, h);
                c.drawImage(offscreen, -w / 2, -h / 2, w, h);
            } else {
                c.drawImage(el.img, -w / 2, -h / 2, w, h);
            }
            c.restore();
        }

        window.onload = initApp;
    </script>
