<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio Poster Maker - Canva & PixelLab Style</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Caveat:wght@400;700&family=Cinzel:wght@400;700;900&family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,700;1,800&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;outline:none;}
        html,body{width:100%;height:100%;overflow:hidden;background:#0b0b0b;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;user-select:none;}

        /* TOP HEADER TOOLBAR */
        .top-navbar{
            height:50px;background:#141414;border-bottom:1px solid rgba(212,175,55,0.25);
            display:flex;align-items:center;justify-content:flex-start;padding:0 10px;gap:8px;z-index:200;position:relative;
            overflow-x:auto;overflow-y:hidden;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;
        }
        .top-navbar::-webkit-scrollbar{display:none;}
        .nav-left, .nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
        .btn-nav{
            background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#ddd;
            height:34px;padding:0 10px;border-radius:17px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;cursor:pointer;flex-shrink:0;
        }
        .btn-nav:hover{background:rgba(212,175,55,0.15);border-color:#D4AF37;color:#D4AF37;}
        .btn-nav.active{background:#D4AF37;color:#111;border-color:#D4AF37;}
        .btn-nav:disabled{opacity:0.35;cursor:not-allowed;}
        .btn-download{background:linear-gradient(135deg,#FFE259,#D4AF37);color:#111;border:none;box-shadow:0 2px 10px rgba(212,175,55,0.3);}

        .export-select{
            background:#1c1c1c;color:#D4AF37;border:1px solid rgba(212,175,55,0.4);border-radius:17px;
            height:34px;padding:0 8px;font-size:11px;font-weight:700;cursor:pointer;
        }

        /* AUTO SAVE STATUS */
        .save-indicator{font-size:10px;color:#888;display:flex;align-items:center;gap:4px;padding:0 4px;}
        .save-dot{width:7px;height:7px;border-radius:50%;background:#4CAF50;transition:0.3s;}
        .save-dot.syncing{background:#FFA000;animation:pulseSync 1s infinite;}
        @keyframes pulseSync{0%,100%{opacity:0.3;}50%{opacity:1;}}

        /* WORKSPACE AREA */
        .workspace-viewport{
            position:absolute;top:50px;bottom:120px;left:0;right:0;background:#060606;
            background-image:radial-gradient(rgba(255,255,255,0.06) 1px, transparent 0);background-size:20px 20px;
            display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;
        }

        /* ARTBOARD STAGE CONTAINER */
        .artboard-container{
            position:relative;box-shadow:0 15px 45px rgba(0,0,0,0.9), 0 0 0 1px rgba(212,175,55,0.3);
            border-radius:6px;overflow:visible;background:#181818;transform-origin:center center;touch-action:none;
        }
        #mainCanvas{display:block;width:100%;height:100%;border-radius:6px;touch-action:none;}

        /* BLEED & SAFETY MARGIN LINES */
        .bleed-guides{
            position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;display:none;z-index:90;
        }
        .bleed-guides.visible{display:block;}
        .guide-line-h{position:absolute;left:0;right:0;height:1px;border-top:1px dashed rgba(212,175,55,0.6);}
        .guide-line-v{position:absolute;top:0;bottom:0;width:1px;border-left:1px dashed rgba(212,175,55,0.6);}

        /* BOUNDING BOX SELECTION */
        .selection-box{
            position:absolute;border:2px solid #D4AF37;pointer-events:none;display:none;z-index:99;box-shadow:0 0 12px rgba(212,175,55,0.4);
        }
        .selection-box.active{display:block;}
        .sel-handle{
            position:absolute;width:16px;height:16px;background:#fff;border:2px solid #D4AF37;border-radius:50%;
            pointer-events:auto;box-shadow:0 2px 6px rgba(0,0,0,0.6);z-index:102;
        }
        .sel-handle.tl{top:-8px;left:-8px;cursor:nwse-resize;}
        .sel-handle.tr{top:-8px;right:-8px;cursor:nesw-resize;}
        .sel-handle.bl{bottom:-8px;left:-8px;cursor:nesw-resize;}
        .sel-handle.br{bottom:-8px;right:-8px;cursor:nwse-resize;}
        
        .sel-handle-edge{position:absolute;background:#D4AF37;pointer-events:auto;border-radius:3px;z-index:101;}
        .sel-handle-edge.r{top:50%;right:-6px;transform:translateY(-50%);width:7px;height:26px;cursor:ew-resize;}
        .sel-handle-edge.l{top:50%;left:-6px;transform:translateY(-50%);width:7px;height:26px;cursor:ew-resize;}
        .sel-handle-edge.t{left:50%;top:-6px;transform:translateX(-50%);width:26px;height:7px;cursor:ns-resize;}
        .sel-handle-edge.b{left:50%;bottom:-6px;transform:translateX(-50%);width:26px;height:7px;cursor:ns-resize;}

        /* IN-PLACE DIRECT KEYBOARD INPUT */
        #inlineTextInput{
            position:absolute;display:none;background:rgba(20,20,20,0.95);border:2px solid #D4AF37;color:#fff;
            padding:10px 12px;border-radius:10px;font-family:inherit;font-size:16px;z-index:150;resize:none;
            box-shadow:0 10px 30px rgba(0,0,0,0.9);line-height:1.4;
        }

        /* SLIDE CAROUSEL THUMBNAILS BAR */
        .carousel-bar{
            position:absolute;bottom:62px;left:0;right:0;height:56px;background:rgba(18,18,18,0.95);
            border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;padding:0 10px;gap:8px;
            overflow-x:auto;z-index:180;scrollbar-width:none;
        }
        .carousel-bar::-webkit-scrollbar{display:none;}
        .slide-thumb{
            flex-shrink:0;width:38px;height:48px;background:#252525;border:2px solid transparent;border-radius:6px;
            overflow:hidden;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;
            font-size:11px;color:#aaa;font-weight:bold;
        }
        .slide-thumb.active{border-color:#D4AF37;box-shadow:0 0 8px rgba(212,175,55,0.4);color:#fff;}
        .btn-add-slide{
            flex-shrink:0;width:38px;height:48px;background:rgba(212,175,55,0.1);border:1px dashed #D4AF37;
            border-radius:6px;color:#D4AF37;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;
        }
        .btn-dup-slide, .btn-del-slide{
            background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#bbb;
            height:32px;padding:0 8px;border-radius:8px;font-size:11px;font-weight:bold;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:4px;
        }
        .btn-del-slide{background:rgba(255,75,75,0.12);border-color:rgba(255,75,75,0.3);color:#ff6b6b;}

        /* BOTTOM TOOLBAR */
        .bottom-toolbar-container{
            position:absolute;bottom:0;left:0;right:0;height:62px;background:#141414;
            border-top:1px solid rgba(212,175,55,0.25);z-index:190;display:flex;align-items:center;padding:0 8px;
            overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;gap:6px;
        }
        .bottom-toolbar-container::-webkit-scrollbar{display:none;}
        .tool-btn{
            flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
            gap:3px;min-width:62px;height:54px;background:transparent;border:none;color:#aaa;
            font-size:10px;font-weight:700;border-radius:10px;cursor:pointer;transition:0.2s;
        }
        .tool-btn .icon{font-size:18px;line-height:1;}
        .tool-btn:hover, .tool-btn.active{background:rgba(212,175,55,0.15);color:#D4AF37;}

        /* TOOL PANEL */
        .tool-panel{
            position:absolute;bottom:62px;left:0;right:0;max-height:280px;background:#181818;
            border-top:1px solid rgba(212,175,55,0.3);border-radius:18px 18px 0 0;z-index:185;
            padding:14px 16px;box-shadow:0 -10px 30px rgba(0,0,0,0.8);display:none;flex-direction:column;
            overflow-y:auto;gap:12px;animation:slideUpPanel 0.25s cubic-bezier(0.16,1,0.3,1);
        }
        .tool-panel.active{display:flex;}
        @keyframes slideUpPanel{from{transform:translateY(100%);}to{transform:translateY(0);}}
        .panel-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.08);padding-bottom:8px;}
        .panel-title{font-size:13px;font-weight:800;color:#D4AF37;letter-spacing:0.5px;}
        .panel-close{background:none;border:none;color:#888;font-size:18px;cursor:pointer;}

        /* UI CONTROLS */
        .ctrl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
        .ctrl-label{font-size:11px;color:#bbb;font-weight:bold;min-width:80px;}
        .range-slider{flex:1;accent-color:#D4AF37;cursor:pointer;}
        .ctrl-val{font-size:11px;color:#D4AF37;font-weight:bold;width:45px;text-align:right;}
        .ctrl-grid-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
        .btn-sub-tool{
            background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#ddd;
            padding:8px 4px;border-radius:8px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
        }
        .btn-sub-tool.active{background:#D4AF37;color:#111;border-color:#D4AF37;}
        .color-palette-scroll{display:flex;gap:8px;overflow-x:auto;padding:4px 0;}
        .color-circle{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);flex-shrink:0;cursor:pointer;}
        .color-circle.active{border-color:#D4AF37;transform:scale(1.2);}

        /* STEPPER ROW */
        .stepper-row {display: flex;align-items: center;gap: 8px;margin-top: 4px;}
        .btn-step {
            width: 32px;height: 32px;border-radius: 8px;background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);color: #fff;font-weight: 800;font-size: 16px;
            display: flex;align-items: center;justify-content: center;cursor: pointer;flex-shrink: 0;
        }
        .btn-step:hover {background: #D4AF37;color: #111;border-color: #D4AF37;}
        .btn-reset-tool {
            padding: 4px 8px;border-radius: 6px;background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);color: #bbb;font-size: 10px;cursor: pointer;margin-left: auto;
        }

        /* FLOATING TEXT FORMATTING TOOLBAR */
        .inline-text-toolbar{
            position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,0.95);
            border:1px solid #D4AF37;border-radius:24px;padding:4px 8px;display:none;align-items:center;gap:6px;z-index:260;
            box-shadow:0 8px 25px rgba(0,0,0,0.85);backdrop-filter:blur(10px);
        }
        .inline-text-toolbar.active{display:flex;}
        .btn-format-tag{
            background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;
            min-width:32px;height:32px;border-radius:16px;font-size:12px;font-weight:bold;cursor:pointer;
            display:flex;align-items:center;justify-content:center;
        }
        .btn-format-tag:hover{background:#D4AF37;color:#111;}
        .btn-format-done{
            background:linear-gradient(135deg,#FFE259,#D4AF37);color:#111;border:none;height:32px;
            padding:0 12px;border-radius:16px;font-size:12px;font-weight:700;cursor:pointer;
        }

        /* PIXELLAB ZOOM & PAN WIDGET */
        .pixellab-zoom-widget {
            position: absolute;top: 60px;right: 12px;display: flex;align-items: center;gap: 4px;
            background: rgba(20,20,20,0.9);border: 1px solid rgba(212,175,55,0.4);border-radius: 20px;
            padding: 4px 6px;z-index: 105;backdrop-filter: blur(8px);box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        .zoom-btn {
            background: rgba(255,255,255,0.08);border: none;color: #eee;font-size: 11px;
            padding: 5px 8px;border-radius: 12px;cursor: pointer;
        }
        .zoom-btn:hover, .zoom-btn:active {background: #D4AF37;color: #111;}
        .pan-btn {padding: 4px 6px;font-size: 10px;background: rgba(255,255,255,0.05);color: #bbb;}

        /* POSITION 3x3 & DPAD */
        .pos-grid-3x3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
        .btn-pos-cell{
            background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#ccc;
            padding:8px 4px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;text-align:center;
        }
        .btn-pos-cell:hover, .btn-pos-cell.active{border-color:#D4AF37;color:#D4AF37;background:rgba(212,175,55,0.15);}
        .dpad-container{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:6px;}
        .dpad-row{display:flex;align-items:center;gap:4px;}
        .dpad-btn{
            width:42px;height:36px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);
            color:#fff;border-radius:8px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;
        }
        .dpad-btn:hover{background:#D4AF37;color:#111;}
        .dpad-center{width:70px;height:36px;background:rgba(0,0,0,0.4);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#aaa;}

        /* LOUPE & EYEDROPPER TANGKAI */
        .color-loupe-stalk {
            position: fixed;display: none;z-index: 10000;pointer-events: auto;touch-action: none;
        }
        .loupe-glass {
            width: 76px;height: 76px;border-radius: 50%;border: 3px solid #D4AF37;
            box-shadow: 0 6px 20px rgba(0,0,0,0.9);overflow: hidden;background: #000;position: relative;
        }
        .loupe-cross {
            position: absolute;top: 50%;left: 50%;transform: translate(-50%, -50%);
            width: 8px;height: 8px;border: 1px solid #fff;border-radius: 50%;
        }
        .loupe-stalk-handle {
            width: 38px;height: 38px;background: #1e1e1e;border: 2px solid #D4AF37;border-radius: 50%;
            margin: 10px auto 0;display: flex;align-items: center;justify-content: center;cursor: grab;color: #D4AF37;font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
        }

        /* PROJECT MODAL */
        .project-modal {
            position: fixed;top: 0; left: 0; right: 0; bottom: 0;background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);z-index: 999;display: none;align-items: center;justify-content: center;padding: 16px;
        }
        .project-modal.active {display: flex;}
        .project-dialog {
            background: #181818;border: 1px solid rgba(212,175,55,0.3);border-radius: 16px;
            max-width: 580px;width: 100%;max-height: 85vh;display: flex;flex-direction: column;overflow: hidden;
        }
        .project-header {padding: 14px 18px;border-bottom: 1px solid rgba(255,255,255,0.1);display: flex;align-items: center;justify-content: space-between;}
        .project-grid {padding: 16px;overflow-y: auto;display: grid;grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));gap: 12px;}
        .project-card {background: #222;border: 1px solid rgba(255,255,255,0.1);border-radius: 10px;padding: 10px;cursor: pointer;display: flex;flex-direction: column;}
        .project-card.active, .project-card:hover {border-color: #D4AF37;}
        .project-thumb {width: 100%;background: #111;border-radius: 6px;margin-bottom: 8px;object-fit: cover;border: 1px solid rgba(255,255,255,0.06);}
        .project-thumb.ratio-4-5 {aspect-ratio: 4/5;}
        .project-thumb.ratio-1-1 {aspect-ratio: 1/1;}
        .project-thumb.ratio-9-16 {aspect-ratio: 9/16;}
        .project-title {font-size: 11px;font-weight: 700;color: #eee;margin-bottom: 2px;white-space: nowrap;overflow: hidden;text-overflow: ellipsis;}
        .project-meta {font-size: 9px;color: #888;}
        .project-actions {display: flex;gap: 4px;margin-top: 8px;}
        .btn-proj-action {flex: 1;padding: 4px 0;border-radius: 4px;border: 1px solid rgba(255,255,255,0.1);background: rgba(255,255,255,0.06);color: #ddd;font-size: 10px;cursor: pointer;}

        /* TOAST */
        #toast{
            position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#1f1f1f;border:1px solid #D4AF37;
            color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;z-index:9999;
            box-shadow:0 4px 15px rgba(0,0,0,0.8);display:none;
        }
        #toast.show{display:block;animation:fadeToast 0.25s ease;}
        @keyframes fadeToast{from{opacity:0;transform:translate(-50%, -10px);}to{opacity:1;transform:translate(-50%, 0);}}
    </style>
</head>
<body>
    <div id="toast"></div>

    <!-- 1. TOP HEADER TOOLBAR -->
    <header class="top-navbar">
        <div class="nav-left">
            <a href="index.html" class="btn-nav" title="Kembali ke Beranda">⬅️ Arsip</a>
            <button class="btn-nav" id="btnUndo" onclick="undo()" title="Undo" disabled>↩️</button>
            <button class="btn-nav" id="btnRedo" onclick="redo()" title="Redo" disabled>↪️</button>
            <div class="save-indicator">
                <span class="save-dot" id="saveDot"></span>
                <span id="saveText">Tersimpan</span>
            </div>
        </div>

        <div class="nav-right">
            <button class="btn-nav" onclick="openProjectModal()" title="Projek Saya" style="border-color:#D4AF37;color:#D4AF37;">
                📁 Projek
            </button>
            <button class="btn-nav" id="btnRatio" onclick="toggleRatioSelector()" title="Ubah Ukuran Poster">
                📏 <span id="currentRatioLabel">4:5</span>
            </button>
            <button class="btn-nav" onclick="openPanelBleed()" title="Garis Bantu Presisi">
                📐 Garis Bantu
            </button>
            <select class="export-select" id="exportQualitySelect" title="Resolusi Ekspor">
                <option value="0.7">SD (720p)</option>
                <option value="1.0">HD (1080p)</option>
                <option value="2.0" selected>Ultra HD (2K/4K)</option>
                <option value="3.0">Ultra HD Pro Max</option>
            </select>
            <button class="btn-nav btn-download" onclick="exportPoster()" title="Unduh Desain">
                💾 Simpan
            </button>
        </div>
    </header>

    <!-- 2. WORKSPACE CANVAS AREA -->
    <main class="workspace-viewport" id="workspaceViewport" onclick="handleViewportClick(event)">
        <!-- PIXELLAB ZOOM & PAN WIDGET -->
        <div class="pixellab-zoom-widget" id="zoomWidget">
            <button class="zoom-btn" onclick="zoomCanvasManual(-0.2)" title="Perkecil">🔍-</button>
            <button class="zoom-btn" id="zoomLevelLabel" onclick="resetCanvasZoom()" style="min-width:42px;font-weight:700;">100%</button>
            <button class="zoom-btn" onclick="zoomCanvasManual(0.2)" title="Perbesar">🔍+</button>
            <button class="zoom-btn pan-btn" onclick="panCanvas(0, -50)" title="Geser Atas">▲</button>
            <button class="zoom-btn pan-btn" onclick="panCanvas(0, 50)" title="Geser Bawah">▼</button>
            <button class="zoom-btn pan-btn" onclick="panCanvas(-50, 0)" title="Geser Kiri">◀</button>
            <button class="zoom-btn pan-btn" onclick="panCanvas(50, 0)" title="Geser Kanan">▶</button>
            <button class="zoom-btn" onclick="centerCanvasArtboard()" title="Pusatkan Kanvas">🎯</button>
        </div>

        <div class="artboard-container" id="artboard">
            <canvas id="mainCanvas"></canvas>

            <!-- BLEED & MARGIN GUIDES (TERMASUK GRID 3X3) -->
            <div class="bleed-guides" id="bleedGuides">
                <div class="guide-line-h" id="bleedLineTop" style="top:5%;"></div>
                <div class="guide-line-h" id="bleedLineBottom" style="bottom:5%;"></div>
                <div class="guide-line-v" id="bleedLineLeft" style="left:5%;"></div>
                <div class="guide-line-v" id="bleedLineRight" style="right:5%;"></div>
                <div class="guide-line-h" id="bleedLineMidH" style="top:50%;border-top-color:#00e5ff;display:none;"></div>
                <div class="guide-line-v" id="bleedLineMidV" style="left:50%;border-left-color:#00e5ff;display:none;"></div>
                <!-- Grid 3x3 Rule of Thirds -->
                <div class="guide-line-h" id="grid3x3H1" style="top:33.33%;border-top-color:#FFD700;display:none;"></div>
                <div class="guide-line-h" id="grid3x3H2" style="top:66.66%;border-top-color:#FFD700;display:none;"></div>
                <div class="guide-line-v" id="grid3x3V1" style="left:33.33%;border-left-color:#FFD700;display:none;"></div>
                <div class="guide-line-v" id="grid3x3V2" style="left:66.66%;border-left-color:#FFD700;display:none;"></div>
            </div>

            <!-- SELECTION BOUNDING BOX -->
            <div class="selection-box" id="selBox">
                <div class="sel-handle tl" data-handle="tl"></div>
                <div class="sel-handle tr" data-handle="tr"></div>
                <div class="sel-handle bl" data-handle="bl"></div>
                <div class="sel-handle br" data-handle="br"></div>
                <div class="sel-handle-edge r" data-handle="r"></div>
                <div class="sel-handle-edge l" data-handle="l"></div>
                <div class="sel-handle-edge t" data-handle="t"></div>
                <div class="sel-handle-edge b" data-handle="b"></div>
            </div>

            <textarea id="inlineTextInput" spellcheck="false" placeholder="Ketik teks di sini..."></textarea>
        </div>
    </main>

        function serializeSlides(slidesList) {
            return slidesList.map(s => ({
                ...s,
                background: {
                    ...s.background,
                    imgSrc: s.background.img ? s.background.img.src : (s.background.imgSrc || null),
                    img: undefined
                },
                elements: s.elements.map(el => {
                    const copy = { ...el };
                    if (el.type === 'image') {
                        copy.imgSrc = el.src || (el.img ? el.img.src : copy.imgSrc);
                        delete copy.img;
                    }
                    if (el.textSkinImg) {
                        copy.textSkinSrc = el.textSkinSrc || el.textSkinImg.src;
                        delete copy.textSkinImg;
                    }
                    return copy;
                })
            }));
        }

        function deserializeSlides(rawSlides) {
            return rawSlides.map(s => {
                const bgSrc = s.background.imgSrc || (s.background.img && s.background.img.src);
                return {
                    ...s,
                    background: {
                        ...s.background,
                        imgSrc: bgSrc,
                        img: bgSrc ? getImageFromCache(bgSrc) : null
                    },
                    elements: s.elements.map(el => {
                        const copy = { ...el };
                        if (copy.type === 'image') {
                            const src = copy.imgSrc || copy.src;
                            copy.src = src;
                            copy.img = src ? getImageFromCache(src) : null;
                        }
                        if (copy.textSkinSrc) {
                            copy.textSkinImg = getImageFromCache(copy.textSkinSrc);
                        }
                        return copy;
                    })
                };
            });
        }

        function getCurrentSlide() {
            return slides[currentSlideIndex] || slides[0];

            if (!activeElementId) return null;
            const s = getCurrentSlide();
            return s ? (s.elements.find(e => e.id === activeElementId) || null) : null;

            const dot = document.getElementById('saveDot');

                saveToStorage();
                if (dot) dot.className = 'save-dot';
                if (txt) txt.innerText = 'Tersimpan';
            }, 800);
        }

        function saveToStorage() {
            try {
                const dataToSave = {
                    ratio: currentRatio,
                    slideIndex: currentSlideIndex,
                    slides: serializeSlides(slides)
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
                saveCurrentProjectAuto();
            } catch (e) {}
        }

        function loadFromStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (parsed.ratio && RATIO_PRESETS[parsed.ratio]) {
                    currentRatio = parsed.ratio;
                    document.getElementById('currentRatioLabel').innerText = currentRatio;
                }
                currentSlideIndex = parsed.slideIndex || 0;
                slides = deserializeSlides(parsed.slides || []);
            } catch (e) {}
        }

        function pushHistoryState() {
            if (historyIndex < historyStack.length - 1) {
                historyStack = historyStack.slice(0, historyIndex + 1);
            }
            const state = JSON.stringify({
                ratio: currentRatio,
                currentSlideIndex,
                slides: serializeSlides(slides)
            });
            historyStack.push(state);
            if (historyStack.length > MAX_HISTORY) historyStack.shift();
            historyIndex = historyStack.length - 1;
            updateUndoRedoButtons();
            triggerAutoSave();
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                applyHistoryState(historyStack[historyIndex]);
            }
        }

        function redo() {
            if (historyIndex < historyStack.length - 1) {
                historyIndex++;
                applyHistoryState(historyStack[historyIndex]);
            }
        }

        function applyHistoryState(jsonStr) {
            const parsed = JSON.parse(jsonStr);
            currentRatio = parsed.ratio;
            currentSlideIndex = Math.min(parsed.currentSlideIndex, parsed.slides.length - 1);
            document.getElementById('currentRatioLabel').innerText = currentRatio;
            slides = deserializeSlides(parsed.slides);
            adjustArtboardSize();
            updateUndoRedoButtons();
            requestRender();
            renderCarouselThumbs();
            renderBottomToolbar();
            triggerAutoSave();
        }

        function updateUndoRedoButtons() {
            document.getElementById('btnUndo').disabled = (historyIndex <= 0);
            document.getElementById('btnRedo').disabled = (historyIndex >= historyStack.length - 1);

            artboard.style.width = `${targetW * canvasScale}px`;

        /* =========================================================================

           ========================================================================= */
        function getCleanFont(font) {
            return (font || 'Plus Jakarta Sans, sans-serif').replace(/['"]/g, '').trim();
        }

        function parseFormattedRuns(rawText) {
            if (!rawText) return [];
            const regex = /(\*\*[^*]+?\*\*|\*[^*]+?\*|__[^_]+?__|==[^=]+?==)/g;
            const parts = rawText.split(regex);
            const runs = [];
            for (let i = 0; i < parts.length; i++) {
                const p = parts[i];
                if (!p) continue;
                let bold = false, italic = false, underline = false, highlight = false;
                let clean = p;
                if (clean.startsWith('**') && clean.endsWith('**') && clean.length >= 4) {
                    bold = true; clean = clean.slice(2, -2);
                } else if (clean.startsWith('*') && clean.endsWith('*') && clean.length >= 2) {
                    italic = true; clean = clean.slice(1, -1);
                } else if (clean.startsWith('__') && clean.endsWith('__') && clean.length >= 4) {
                    underline = true; clean = clean.slice(2, -2);
                } else if (clean.startsWith('==') && clean.endsWith('==') && clean.length >= 4) {
                    highlight = true; clean = clean.slice(2, -2);
                }
                runs.push({ text: clean, bold, italic, underline, highlight });
            }
            return runs;
        }

        function getWrappedLines(ctx, text, maxWidth, el) {
            if (!maxWidth || maxWidth <= 0) maxWidth = 750;
            const paragraphs = text.split('\n');
            const lines = [];

            for (const para of paragraphs) {
                if (!para) {
                    lines.push([{ text: '', bold: false, italic: false, underline: false, highlight: false }]);
                    continue;
                }
                const runs = parseFormattedRuns(para);
                let currentLineRuns = [];
                let currentLineWidth = 0;

                for (const run of runs) {
                    const words = run.text.split(' ');
                    for (let w = 0; w < words.length; w++) {
                        const word = words[w];
                        const wordWithSpace = (w < words.length - 1) ? word + ' ' : word;
                        const fStyle = run.italic ? 'italic' : (el.fontStyle || 'normal');
                        const fWeight = run.bold ? '900' : (el.fontWeight || 'normal');
                        ctx.font = `${fStyle} ${fWeight} ${el.fontSize}px ${getCleanFont(el.fontFamily)}`;
                        const wMetrics = ctx.measureText(wordWithSpace);
                        const addSpacing = (el.letterSpacing || 0) * wordWithSpace.length;
                        const wordW = wMetrics.width + addSpacing;

                        if (currentLineWidth + wordW > maxWidth && currentLineRuns.length > 0) {
                            lines.push(currentLineRuns);
                            currentLineRuns = [];
                            currentLineWidth = 0;
                        }

                        currentLineRuns.push({
                            text: wordWithSpace,
                            bold: run.bold,
                            italic: run.italic,
                            underline: run.underline,
                            highlight: run.highlight
                        });
                        currentLineWidth += wordW;
                    }
                }
                if (currentLineRuns.length > 0) lines.push(currentLineRuns);
            }
            return lines;
        }

        function renderAll() {
            const s = getCurrentSlide();
            if (!s) return;
            const W = mainCanvas.width;
            const H = mainCanvas.height;
            ctx.clearRect(0, 0, W, H);

            renderBackground(s.background, W, H);

            if (s.elements) {
                s.elements.forEach(el => {
                    if (el.type === 'text') renderTextElement(el);
                    else if (el.type === 'image') renderImageElement(el);
                });
            }
            updateSelectionBox();
        }

        function renderBackground(bg, W, H) {
            if (!bg) return;
            if (bg.img && bg.img.complete) {
                ctx.save();
                if (bg.blur > 0) ctx.filter = `blur(${bg.blur * 2}px)`;

                const baseRatio = Math.max(W / bg.img.width, H / bg.img.height);
                const scale = (bg.scale || 1.0) * baseRatio;

                const drawW = bg.img.width * scale;
                const drawH = bg.img.height * scale;

                const x = ((W - drawW) / 2) + (bg.offsetX || 0);
                const y = ((H - drawH) / 2) + (bg.offsetY || 0);

                ctx.drawImage(bg.img, x, y, drawW, drawH);
                ctx.restore();
            } else {
                const grad = ctx.createRadialGradient(W / 2, H * 0.35, 100, W / 2, H / 2, W);
                grad.addColorStop(0, bg.color1 || '#241a14');
                grad.addColorStop(1, bg.color2 || '#0d0a08');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
            }

            if (bg.darken > 0) {
                ctx.fillStyle = `rgba(0,0,0,${bg.darken})`;
                ctx.fillRect(0, 0, W, H);
            }
        }

        function renderTextElement(el) {
            ctx.save();
            ctx.translate(el.x, el.y);
            if (el.rotation) ctx.rotate((el.rotation * Math.PI) / 180);
            ctx.globalAlpha = el.opacity !== undefined ? el.opacity : 1;

            const fontSize = el.fontSize;
            const lineHeight = fontSize * (el.lineHeight || 1.3);
            const cleanFont = getCleanFont(el.fontFamily);
            const maxBoxWidth = el.width || 750;

            const linesOfRuns = getWrappedLines(ctx, el.text, maxBoxWidth, el);
            const totalHeight = linesOfRuns.length * lineHeight;
            el._calculatedHeight = totalHeight;

            let startY = -(totalHeight / 2) + (lineHeight / 2);
            const letterSpace = el.letterSpacing || 0;

            linesOfRuns.forEach((lineRuns, idx) => {
                const lineY = startY + (idx * lineHeight);
                let totalLineWidth = 0;
                lineRuns.forEach(r => {
                    const fStyle = r.italic ? 'italic' : (el.fontStyle || 'normal');
                    const fWeight = r.bold ? '900' : (el.fontWeight || 'normal');
                    ctx.font = `${fStyle} ${fWeight} ${fontSize}px ${cleanFont}`;
                    totalLineWidth += ctx.measureText(r.text).width + (letterSpace * r.text.length);
                });

                let startX = -(totalLineWidth / 2);
                if (el.textAlign === 'left') startX = -(maxBoxWidth / 2);
                else if (el.textAlign === 'right') startX = (maxBoxWidth / 2) - totalLineWidth;

                if (el.highlightColor && el.highlightColor !== 'transparent') {
                    ctx.save();
                    ctx.fillStyle = el.highlightColor;
                    ctx.globalAlpha = (el.opacity || 1) * (el.highlightAlpha !== undefined ? el.highlightAlpha : 0.4);
                    const radius = el.highlightRadius !== undefined ? el.highlightRadius : 6;
                    ctx.beginPath();
                    ctx.roundRect(startX - 8, lineY - (lineHeight / 2) + 2, totalLineWidth + 16, lineHeight - 4, radius);
                    ctx.fill();
                    ctx.restore();
                }

                let curX = startX;
                lineRuns.forEach(run => {
                    if (!run.text) return;
                    ctx.save();
                    const fStyle = run.italic ? 'italic' : (el.fontStyle || 'normal');
                    const fWeight = run.bold ? '900' : (el.fontWeight || 'normal');
                    ctx.font = `${fStyle} ${fWeight} ${fontSize}px ${cleanFont}`;
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';

                    let displayText = run.text;
                    const runMetrics = ctx.measureText(displayText);
                    const runW = runMetrics.width + (letterSpace * displayText.length);

                    if (el.shadow && el.shadow.color && el.shadow.color !== 'transparent') {
                        ctx.shadowColor = el.shadow.color;
                        ctx.shadowBlur = el.shadow.blur || 0;
                        const rad = (el.shadow.angle || 45) * Math.PI / 180;
                        const dist = el.shadow.distance || 0;
                        ctx.shadowOffsetX = Math.cos(rad) * dist;
                        ctx.shadowOffsetY = Math.sin(rad) * dist;
                    }

                    ctx.fillStyle = el.color || '#fff';
                    if (letterSpace === 0) {
                        ctx.fillText(displayText, curX, lineY);
                    } else {
                        let charX = curX;
                        for (let c = 0; c < displayText.length; c++) {
                            const ch = displayText[c];
                            ctx.fillText(ch, charX, lineY);
                            charX += ctx.measureText(ch).width + letterSpace;
                        }
                    }
                    ctx.restore();
                    curX += runW;
                });
            });
            ctx.restore();
        }

        function renderImageElement(el) {
            if (!el.img || !el.img.complete) {
                if (el.src || el.imgSrc) el.img = getImageFromCache(el.src || el.imgSrc);
                if (!el.img || !el.img.complete) return;
            }

            const w = el.width || 300;
            const h = el.height || 300;

            ctx.save();
            ctx.translate(el.x, el.y);
            if (el.rotation) ctx.rotate((el.rotation * Math.PI) / 180);
            ctx.scale(el.flipH ? -1 : 1, el.flipV ? -1 : 1);
            ctx.globalAlpha = el.opacity !== undefined ? el.opacity : 1;

            if (el.blur && el.blur > 0) ctx.filter = `blur(${el.blur}px)`;

            if (el.shadow && el.shadow.color && el.shadow.color !== 'transparent') {
                ctx.shadowColor = el.shadow.color;
                ctx.shadowBlur = el.shadow.blur || 0;
                const rad = (el.shadow.angle || 45) * Math.PI / 180;
                const dist = el.shadow.distance || 0;
                ctx.shadowOffsetX = Math.cos(rad) * dist;
                ctx.shadowOffsetY = Math.sin(rad) * dist;
            }

            const radius = el.cornerRadius || 0;
            ctx.beginPath();
            ctx.roundRect(-w / 2, -h / 2, w, h, radius);
            ctx.clip();

            // Fitur Ganti Warna Full PNG (Color Overlay / Tint)
            if (el.tintColor && el.tintColor !== 'transparent') {
                const offCanvas = document.createElement('canvas');
                offCanvas.width = w;
                offCanvas.height = h;
                const offCtx = offCanvas.getContext('2d');
                offCtx.drawImage(el.img, 0, 0, w, h);
                offCtx.globalCompositeOperation = 'source-in';
                offCtx.fillStyle = el.tintColor;
                offCtx.fillRect(0, 0, w, h);
                ctx.drawImage(offCanvas, -w / 2, -h / 2);
            } else {
                ctx.drawImage(el.img, -w / 2, -h / 2, w, h);
            }

            if (el.borderWidth && el.borderWidth > 0 && el.borderColor) {
                ctx.lineWidth = el.borderWidth * 2;
                ctx.strokeStyle = el.borderColor;
                ctx.stroke();
            }
            ctx.restore();
        }

        /* =========================================================================
           SELECTION BOX & TOUCH DRAGGING ENGINE (MANUAL RESIZE CORNER & EDGES)
           ========================================================================= */
        let dragMode = null; // 'move', 'resize-corner', 'resize-edge'
        let activeHandle = null;
        let startPointer = { x: 0, y: 0 };
        let startElementState = {};
        let lastTapTime = 0;

        function setupDraggingEngine() {
            artboard.addEventListener('pointerdown', handleArtboardPointerDown);
            window.addEventListener('pointermove', handleWindowPointerMove);
            window.addEventListener('pointerup', handleWindowPointerUp);
            window.addEventListener('pointercancel', handleWindowPointerUp);
        }

        function handleArtboardPointerDown(e) {
            if (e.target.classList.contains('sel-handle')) {
                dragMode = 'resize-corner';
                activeHandle = e.target.dataset.handle;
                startPointer = { x: e.clientX, y: e.clientY };
                startElementState = { ...getActiveElement() };
                e.stopPropagation();
                return;
            }
            if (e.target.classList.contains('sel-handle-edge')) {
                dragMode = 'resize-edge';
                activeHandle = e.target.dataset.handle;
                startPointer = { x: e.clientX, y: e.clientY };
                startElementState = { ...getActiveElement() };
                e.stopPropagation();
                return;
            }

            const rect = mainCanvas.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) * (mainCanvas.width / rect.width);
            const clickY = (e.clientY - rect.top) * (mainCanvas.height / rect.height);

            const s = getCurrentSlide();
            let hitEl = null;
            for (let i = s.elements.length - 1; i >= 0; i--) {
                const el = s.elements[i];
                const halfW = (el.width || 200) / 2;
                const halfH = (el._calculatedHeight || el.height || 100) / 2;
                if (clickX >= el.x - halfW && clickX <= el.x + halfW &&
                    clickY >= el.y - halfH && clickY <= el.y + halfH) {
                    hitEl = el;
                    break;
                }
            }

            if (hitEl) {
                const now = Date.now();
                if (activeElementId === hitEl.id && hitEl.type === 'text' && (now - lastTapTime < 300)) {
                    openInlineTextEditor(hitEl);
                    lastTapTime = 0;
                    return;
                }
                lastTapTime = now;
                selectElement(hitEl.id);

                if (!hitEl.locked) {
                    dragMode = 'move';
                    startPointer = { x: e.clientX, y: e.clientY };
                    startElementState = { x: hitEl.x, y: hitEl.y };
                    if (hitEl.groupId) {
                        s.elements.forEach(other => {
                            if (other.groupId === hitEl.groupId) other._startPos = { x: other.x, y: other.y };
                        });
                    }
                }
            } else {
                deselectElement();
            }
        }

        function handleWindowPointerMove(e) {
            if (!dragMode) return;
            const el = getActiveElement();
            if (!el || el.locked) return;

            const rect = mainCanvas.getBoundingClientRect();
            const scale = (mainCanvas.width / rect.width);
            const deltaX = (e.clientX - startPointer.x) * scale;
            const deltaY = (e.clientY - startPointer.y) * scale;

            if (dragMode === 'move') {
                el.x = Math.round(startElementState.x + deltaX);
                el.y = Math.round(startElementState.y + deltaY);
                if (el.groupId) {
                    const s = getCurrentSlide();
                    s.elements.forEach(other => {
                        if (other.groupId === el.groupId && other.id !== el.id && other._startPos) {
                            other.x = Math.round(other._startPos.x + deltaX);
                            other.y = Math.round(other._startPos.y + deltaY);
                        }
                    });
                }
                requestRender();
            } else if (dragMode === 'resize-corner') {
                let factor = 1 + (deltaX / (startElementState.width || 300));
                if (activeHandle === 'bl' || activeHandle === 'tl') factor = 1 - (deltaX / (startElementState.width || 300));
                factor = Math.max(0.1, factor);

                if (el.type === 'text') {
                    el.fontSize = Math.round(startElementState.fontSize * factor);
                    el.width = Math.round(startElementState.width * factor);
                } else if (el.type === 'image') {
                    el.width = Math.round(startElementState.width * factor);
                    el.height = Math.round(startElementState.height * factor);
                }
                requestRender();
            } else if (dragMode === 'resize-edge') {
                if (activeHandle === 'r' || activeHandle === 'l') {
                    const sign = activeHandle === 'r' ? 1 : -1;
                    el.width = Math.max(60, Math.round(startElementState.width + (deltaX * 2 * sign)));
                } else if (activeHandle === 'b' || activeHandle === 't') {
                    const sign = activeHandle === 'b' ? 1 : -1;
                    if (el.type === 'image') {
                        el.height = Math.max(40, Math.round(startElementState.height + (deltaY * 2 * sign)));
                    }
                }
                requestRender();
            }
        }

        function handleWindowPointerUp() {
            if (dragMode) {
                dragMode = null;
                const s = getCurrentSlide();
                s.elements.forEach(e => delete e._startPos);
                pushHistoryState();
            }
        }

        function selectElement(id) {
            activeElementId = id;
            updateSelectionBox();
            renderBottomToolbar();
            closeToolPanel();
        }

        function deselectElement() {
            activeElementId = null;
            selBox.classList.remove('active');
            closeInlineTextEditor();
            renderBottomToolbar();
            closeToolPanel();
        }

        function updateSelectionBox() {
            const el = getActiveElement();
            if (!el || isEditingText) {
                selBox.classList.remove('active');
                return;
            }

            const boxW = el.width || 200;
            const boxH = (el.type === 'text') ? (el._calculatedHeight || (el.fontSize * 1.5)) : (el.height || 100);

            const domW = boxW * canvasScale;
            const domH = boxH * canvasScale;
            const domX = (el.x * canvasScale) - (domW / 2);
            const domY = (el.y * canvasScale) - (domH / 2);

            selBox.style.width = `${domW}px`;
            selBox.style.height = `${domH}px`;
            selBox.style.left = `${domX}px`;
            selBox.style.top = `${domY}px`;
            selBox.classList.add('active');
        }

        /* =========================================================================
           IN-PLACE DIRECT TEXT EDITOR
           ========================================================================= */
        function setupInlineTextEvents() {
            inlineTextInput.addEventListener('input', () => {
                const el = getActiveElement();
                if (el && el.type === 'text') {
                    el.text = inlineTextInput.value;
                    renderAll();
                    triggerAutoSave();
                }
            });
            inlineTextInput.addEventListener('blur', () => closeInlineTextEditor());
        }

        function openInlineTextEditor(el) {
            isEditingText = true;
            selBox.classList.remove('active');

            const domW = Math.max(280, (el.width || 750) * canvasScale);
            const domH = Math.max(120, ((el._calculatedHeight || 120) * canvasScale) + 40);
            const domX = Math.max(10, (el.x * canvasScale) - (domW / 2));
            const domY = Math.max(10, (el.y * canvasScale) - (domH / 2));

            inlineTextInput.style.width = `${domW}px`;
            inlineTextInput.style.height = `${domH}px`;
            inlineTextInput.style.left = `${domX}px`;
            inlineTextInput.style.top = `${domY}px`;
            inlineTextInput.value = el.text;
            inlineTextInput.style.display = 'block';
            inlineTextToolbar.classList.add('active');

            setTimeout(() => {
                inlineTextInput.focus();
                inlineTextInput.setSelectionRange(el.text.length, el.text.length);
            }, 60);
        }

        function closeInlineTextEditor() {
            if (!isEditingText) return;
            isEditingText = false;
            inlineTextInput.style.display = 'none';
            inlineTextToolbar.classList.remove('active');
            requestRender();
            pushHistoryState();
        }

        function applyFormatToSelection(tagOpen, tagClose) {
            const start = inlineTextInput.selectionStart;
            const end = inlineTextInput.selectionEnd;
            const val = inlineTextInput.value;
            if (start === end) return;

            const selected = val.substring(start, end);
            inlineTextInput.value = val.substring(0, start) + tagOpen + selected + tagClose + val.substring(end);
            inlineTextInput.selectionStart = start + tagOpen.length;
            inlineTextInput.selectionEnd = end + tagOpen.length;

            const el = getActiveElement();
            if (el) {
                el.text = inlineTextInput.value;
                requestRender();
            }
        }

        function toggleCaseSelection() {
            const start = inlineTextInput.selectionStart;
            const end = inlineTextInput.selectionEnd;
            const val = inlineTextInput.value;
            if (start === end) return;
            const selected = val.substring(start, end);
            const transformed = selected === selected.toUpperCase() ? selected.toLowerCase() : selected.toUpperCase();
            inlineTextInput.value = val.substring(0, start) + transformed + val.substring(end);
            const el = getActiveElement();
            if (el) { el.text = inlineTextInput.value; requestRender(); }
        }

        /* =========================================================================
           EYEDROPPER DENGAN TANGKAI GESER (CANVA STYLE)
           ========================================================================= */
        let eyedropperTarget = 'text';
        let isDraggingLoupe = false;
        let loupeCurrentColor = '#ffffff';

        function setupEyedropperStalk() {
            const handle = document.getElementById('loupeHandle');
            const loupe = document.getElementById('colorLoupeStalk');

            handle.addEventListener('pointerdown', (e) => {
                isDraggingLoupe = true;
                e.stopPropagation();
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDraggingLoupe) return;
                const loupeX = e.clientX - 38;
                const loupeY = e.clientY - 120;
                loupe.style.left = `${loupeX}px`;
                loupe.style.top = `${loupeY}px`;

                // Sampel warna pada titik crosshair loupe
                const rect = mainCanvas.getBoundingClientRect();
                const sampleX = Math.round((e.clientX - rect.left) * (mainCanvas.width / rect.width));
                const sampleY = Math.round(((e.clientY - 82) - rect.top) * (mainCanvas.height / rect.height));

                if (sampleX >= 0 && sampleX < mainCanvas.width && sampleY >= 0 && sampleY < mainCanvas.height) {
                    const p = ctx.getImageData(sampleX, sampleY, 1, 1).data;
                    loupeCurrentColor = '#' + ((1 << 24) + (p[0] << 16) + (p[1] << 8) + p[2]).toString(16).slice(1);
                    document.getElementById('loupeGlass').style.background = loupeCurrentColor;
                    document.getElementById('loupeHexTxt').innerText = loupeCurrentColor;
                }
            });

            window.addEventListener('pointerup', () => {
                if (isDraggingLoupe) {
                    isDraggingLoupe = false;
                    loupe.style.display = 'none';
                    applySampledColor(loupeCurrentColor);
                }
            });
        }

        function triggerEyeDropper(targetProp) {
            eyedropperTarget = targetProp;
            const loupe = document.getElementById('colorLoupeStalk');
            loupe.style.left = '50%';
            loupe.style.top = '40%';
            loupe.style.display = 'block';
            showToast('🎯 Tarik tangkai bulat untuk mengarahkan pengambil warna!');
        }

        function applySampledColor(hex) {
            const el = getActiveElement();
            if (!el) return;
            if (eyedropperTarget === 'text') el.color = hex;
            else if (eyedropperTarget === 'tint') el.tintColor = hex;
            else if (eyedropperTarget === 'highlight') el.highlightColor = hex;
            else if (eyedropperTarget === 'border') el.borderColor = hex;
            requestRender();
            pushHistoryState();
            showToast(`✅ Warna dipilih: ${hex}`);
            if (eyedropperTarget === 'text') openPanelTextColor();
            else if (eyedropperTarget === 'tint') openPanelImageTint();
            else if (eyedropperTarget === 'highlight') openPanelHighlight();
        }

        /* =========================================================================
           TOOLS PANELS & EDITING
           ========================================================================= */
        function stepSliderVal(sliderId, delta, callback) {
            const sl = document.getElementById(sliderId);
            if (!sl) return;
            let val = parseFloat(sl.value) + delta;
            val = Math.max(parseFloat(sl.min), Math.min(parseFloat(sl.max), val));
            sl.value = val;
            if (callback) callback(val);
        }

        function openToolPanel(title, html) {
            document.getElementById('panelTitle').innerText = title;
            document.getElementById('panelContent').innerHTML = html;
            document.getElementById('toolPanel').classList.add('active');
        }

        function closeToolPanel() {
            document.getElementById('toolPanel').classList.remove('active');
        }

        // 1. PANEL BACKGROUND (ZOOM EKSTRA BESAR HINGGA 600%)
        function openPanelBackground() {
            const s = getCurrentSlide();
            const bg = s.background;
            const hasImg = !!(bg.img || bg.imgSrc);

            const html = `
                <div class="ctrl-row">
                    <span class="ctrl-label">Gambar Latar:</span>
                    <button class="btn-sub-tool active" onclick="document.getElementById('fileBgInput').click()">📁 Unggah Gambar</button>
                </div>
                ${hasImg ? `
                    <div style="margin-top:8px;display:flex;justify-content:space-between;align-items:center;">
                        <span style="font-size:11px;color:#4CAF50;">✅ Foto Aktif</span>
                        <button class="btn-sub-tool" onclick="removeBgImage()" style="color:#ff6b6b;">🗑️ Hapus</button>
                    </div>
                    <div class="ctrl-row" style="margin-top:10px;">
                        <span class="ctrl-label">Zoom Latar (Ekstra Besar):</span>
                        <span class="ctrl-val" id="bgScaleVal">${Math.round((bg.scale || 1.0) * 100)}%</span>
                        <button class="btn-reset-tool" onclick="updateBgPosition('scale', 100); document.getElementById('bgScaleSlider').value=100;">↺ 100%</button>
                    </div>
                    <div class="stepper-row">
                        <button class="btn-step" onclick="stepSliderVal('bgScaleSlider', -10, (v)=>updateBgPosition('scale', v))">-</button>
                        <input type="range" class="range-slider" id="bgScaleSlider" min="100" max="600" value="${Math.round((bg.scale || 1.0) * 100)}" oninput="updateBgPosition('scale', this.value)">
                        <button class="btn-step" onclick="stepSliderVal('bgScaleSlider', 10, (v)=>updateBgPosition('scale', v))">+</button>
                    </div>
                    <div class="ctrl-row" style="margin-top:10px;">
                        <span class="ctrl-label">Geser X:</span>
                        <span class="ctrl-val" id="bgOffXVal">${bg.offsetX || 0}px</span>
                    </div>
                    <div class="stepper-row">
                        <button class="btn-step" onclick="stepSliderVal('bgOffXSlider', -20, (v)=>updateBgPosition('offsetX', v))">-</button>
                        <input type="range" class="range-slider" id="bgOffXSlider" min="-2000" max="2000" value="${bg.offsetX || 0}" oninput="updateBgPosition('offsetX', this.value)">
                        <button class="btn-step" onclick="stepSliderVal('bgOffXSlider', 20, (v)=>updateBgPosition('offsetX', v))">+</button>
                    </div>
                    <div class="ctrl-row" style="margin-top:10px;">
                        <span class="ctrl-label">Geser Y:</span>
                        <span class="ctrl-val" id="bgOffYVal">${bg.offsetY || 0}px</span>
                    </div>
                    <div class="stepper-row">
                        <button class="btn-step" onclick="stepSliderVal('bgOffYSlider', -20, (v)=>updateBgPosition('offsetY', v))">-</button>
                        <input type="range" class="range-slider" id="bgOffYSlider" min="-2000" max="2000" value="${bg.offsetY || 0}" oninput="updateBgPosition('offsetY', this.value)">
                        <button class="btn-step" onclick="stepSliderVal('bgOffYSlider', 20, (v)=>updateBgPosition('offsetY', v))">+</button>
                    </div>
                ` : `
                    <div class="ctrl-row" style="margin-top:10px;">
                        <span class="ctrl-label">Warna Pusat:</span>
                        <input type="color" value="${bg.color1 || '#241a14'}" onchange="updateBgColor('color1', this.value)">
                    </div>
                    <div class="ctrl-row" style="margin-top:8px;">
                        <span class="ctrl-label">Warna Luar:</span>
                        <input type="color" value="${bg.color2 || '#0d0a08'}" onchange="updateBgColor('color2', this.value)">
                    </div>
                `}
            `;
            openToolPanel('Background Poster', html);
        }

        function updateBgPosition(prop, val) {
            const s = getCurrentSlide();
            if (prop === 'scale') {
                s.background.scale = parseInt(val) / 100;
                document.getElementById('bgScaleVal').innerText = `${val}%`;
            } else if (prop === 'offsetX') {
                s.background.offsetX = parseInt(val);
                document.getElementById('bgOffXVal').innerText = `${val}px`;
            } else if (prop === 'offsetY') {
                s.background.offsetY = parseInt(val);
                document.getElementById('bgOffYVal').innerText = `${val}px`;
            }
            requestRender();
            triggerAutoSave();
        }

        function updateBgColor(prop, val) {
            getCurrentSlide().background[prop] = val;
            requestRender();
            pushHistoryState();
        }

        function handleBgUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const s = getCurrentSlide();
                s.background.imgSrc = evt.target.result;
                s.background.img = getImageFromCache(evt.target.result);
                s.background.scale = 1.0;
                s.background.offsetX = 0;
                s.background.offsetY = 0;
                requestRender();
                pushHistoryState();
                openPanelBackground();
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        }

        function removeBgImage() {
            const s = getCurrentSlide();
            s.background.img = null;
            s.background.imgSrc = null;
            requestRender();
            pushHistoryState();
            openPanelBackground();
        }

        // 2. PANEL UKURAN TEKS (HINGGA 600PX)
        function openPanelFontSize() {

        function confirmGroupElements() {
            const s = getCurrentSlide();
            const selected = Array.from(document.querySelectorAll('.chk-group-el:checked')).map(cb => cb.value);
            if (selected.length < 2) {
                alert('Pilih minimal 2 elemen!');
                return;
            }
            const gid = 'grp_' + Date.now();
            s.elements.forEach(el => {
                if (selected.includes(el.id)) el.groupId = gid;
            });
            pushHistoryState();
            renderBottomToolbar();
            closeToolPanel();
            showToast('✅ Elemen berhasil digabungkan!');

        function ungroupCurrentElement() {
            const el = getActiveElement();
            if (!el || !el.groupId) return;
            const gid = el.groupId;
            getCurrentSlide().elements.forEach(e => {
                if (e.groupId === gid) e.groupId = null;
            });
            pushHistoryState();
            renderBottomToolbar();
            closeToolPanel();
            showToast('⛓️ Grup dipisahkan!');
        }

        function openPanelPosition() {
            const el = getActiveElement();

            const html = `

                    <button class="btn-pos-cell" onclick="setAlignPosition('top-left')">↖️</button>

                    <button class="btn-pos-cell" onclick="setAlignPosition('top-right')">↗️</button>

                    <button class="btn-pos-cell active" onclick="setAlignPosition('center')">🎯</button>
                    <button class="btn-pos-cell" onclick="setAlignPosition('right')">➡️</button>
                    <button class="btn-pos-cell" onclick="setAlignPosition('bottom-left')">↙️</button>
                    <button class="btn-pos-cell" onclick="setAlignPosition('bottom')">⬇️</button>
                    <button class="btn-pos-cell" onclick="setAlignPosition('bottom-right')">↘️</button>
                </div>
                <div class="dpad-container">
                    <button class="dpad-btn" onclick="nudgeElement(0, -nudgeStep)">▲</button>
                    <div class="dpad-row">
                        <button class="dpad-btn" onclick="nudgeElement(-nudgeStep, 0)">◀</button>
                        <div class="dpad-center" id="posCoordLabel">X: ${Math.round(el.x)}<br>Y: ${Math.round(el.y)}</div>
                        <button class="dpad-btn" onclick="nudgeElement(nudgeStep, 0)">▶</button>
                    </div>
                    <button class="dpad-btn" onclick="nudgeElement(0, nudgeStep)">▼</button>
                </div>
            `;
            openToolPanel('Posisi Elemen', html);
        }

        function nudgeElement(dx, dy) {
            const el = getActiveElement();
            if (!el) return;
            el.x += dx;
            el.y += dy;
            if (el.groupId) {
                getCurrentSlide().elements.forEach(other => {
                    if (other.groupId === el.groupId && other.id !== el.id) {
                        other.x += dx;
                        other.y += dy;
                    }
                });
            }
            const lbl = document.getElementById('posCoordLabel');
            if (lbl) lbl.innerHTML = `X: ${Math.round(el.x)}<br>Y: ${Math.round(el.y)}`;
            requestRender();
            triggerAutoSave();
        }

        function setAlignPosition(pos) {
            const el = getActiveElement();
            if (!el) return;
            const W = mainCanvas.width;
            const H = mainCanvas.height;
            const elW = el.width || 300;
            const elH = el._calculatedHeight || el.height || 100;

            if (pos === 'top') { el.x = W/2; el.y = elH/2 + 80; }
            else if (pos === 'bottom') { el.x = W/2; el.y = H - (elH/2) - 80; }
            else if (pos === 'left') { el.x = elW/2 + 60; el.y = H/2; }
            else if (pos === 'right') { el.x = W - (elW/2) - 60; el.y = H/2; }
            else if (pos === 'center') { el.x = W/2; el.y = H/2; }
            requestRender();
            pushHistoryState();
            openPanelPosition();
        }

        function addNewText() {
            const newEl = {
                id: 'el_' + Date.now(),
                type: 'text',
                text: 'Ketik Teks Baru',
                x: mainCanvas.width / 2,
                y: mainCanvas.height / 2,
                width: 600,
                fontFamily: "Plus Jakarta Sans, sans-serif",
                fontSize: 48,
                fontWeight: 'bold',
                color: '#FFFFFF',
                opacity: 1,
                rotation: 0
            };
            getCurrentSlide().elements.push(newEl);
            selectElement(newEl.id);
            renderAll();
            pushHistoryState();
            openInlineTextEditor(newEl);
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = new Image();
                img.onload = () => {
                    const newEl = {
                        id: 'el_' + Date.now(),
                        type: 'image',
                        img: img,
                        src: evt.target.result,
                        x: mainCanvas.width / 2,
                        y: mainCanvas.height / 2,
                        width: Math.min(img.width, 500),
                        height: Math.min(img.height, 500 * (img.height / img.width)),
                        opacity: 1,
                        rotation: 0
                    };
                    getCurrentSlide().elements.push(newEl);
                    selectElement(newEl.id);
                    renderAll();
                    pushHistoryState();
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        }

        function duplicateActiveElement() {
            const el = getActiveElement();
            if (!el) return;
            const copy = JSON.parse(JSON.stringify(el));
            copy.id = 'el_' + Date.now();
            copy.x += 30; copy.y += 30;
            if (el.type === 'image' && el.img) copy.img = el.img;
            getCurrentSlide().elements.push(copy);
            selectElement(copy.id);
            renderAll();
            pushHistoryState();
        }

        function deleteActiveElement() {
            const el = getActiveElement();
            if (!el) return;
            getCurrentSlide().elements = getCurrentSlide().elements.filter(e => e.id !== el.id);
            deselectElement();
            renderAll();
            pushHistoryState();
        }

        /* =========================================================================
           SLIDE CAROUSEL
           ========================================================================= */
        function renderCarouselThumbs() {
            const container = document.getElementById('slideThumbList');
            container.innerHTML = '';
            slides.forEach((_, idx) => {
                const thumb = document.createElement('div');
                thumb.className = `slide-thumb ${idx === currentSlideIndex ? 'active' : ''}`;
                thumb.innerText = `${idx + 1}`;
                thumb.onclick = () => switchSlide(idx);
                container.appendChild(thumb);
            });
        }

        function switchSlide(idx) {
            deselectElement();
            currentSlideIndex = idx;
            renderCarouselThumbs();
            renderAll();
            pushHistoryState();
        }

        function addNewSlide() {
            deselectElement();
            slides.push(createDefaultSlide());
            currentSlideIndex = slides.length - 1;
            renderCarouselThumbs();
            renderAll();
            pushHistoryState();
        }

        function duplicateCurrentSlide() {
            deselectElement();
            const curr = getCurrentSlide();
            const copy = deserializeSlides([serializeSlides([curr])[0]])[0];
            slides.push(copy);
            currentSlideIndex = slides.length - 1;
            renderCarouselThumbs();
            renderAll();
            pushHistoryState();
        }

        function deleteCurrentSlide() {
            if (slides.length <= 1) {
                alert('Minimal harus ada 1 slide!');
                return;
            }
            if (confirm('Hapus slide ini?')) {
                deselectElement();
                slides.splice(currentSlideIndex, 1);
                if (currentSlideIndex >= slides.length) currentSlideIndex = slides.length - 1;
                renderCarouselThumbs();
                renderAll();
                pushHistoryState();
            }
        }

        /* =========================================================================
           PROJEK SAYA (DENGAN ASPEK RASIO THUMBNAIL)
           ========================================================================= */
        function getProjectsList() {
            try {
                const raw = localStorage.getItem(PROJECTS_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch(e) { return []; }
        }

        function saveProjectsList(list) {
            try { localStorage.setItem(PROJECTS_KEY, JSON.stringify(list)); } catch(e) {}
        }

        function openProjectModal() {
            renderProjectList();
            document.getElementById('projectModal').classList.add('active');
        }

        function closeProjectModal() {
            document.getElementById('projectModal').classList.remove('active');
        }

        function saveCurrentProjectAuto(customName) {
            let list = getProjectsList();
            let p = list.find(x => x.id === currentProjectId);
            const thumb = mainCanvas.toDataURL('image/jpeg', 0.3);

            if (!p) {
                p = {
                    id: currentProjectId || ('proj_' + Date.now()),
                    name: customName || ('Projek ' + (list.length + 1)),
                    ratio: currentRatio,
                    thumb: thumb,
                    slides: serializeSlides(slides),
                    updatedAt: Date.now()
                };
                list.unshift(p);
            } else {
                if (customName) p.name = customName;
                p.ratio = currentRatio;
                p.thumb = thumb;
                p.slides = serializeSlides(slides);
                p.updatedAt = Date.now();
            }
            saveProjectsList(list);
        }

        function renderProjectList() {
            let list = getProjectsList();
            const container = document.getElementById('projectGridContainer');
            container.innerHTML = '';

            list.forEach(p => {
                const isCurrent = p.id === currentProjectId;
                const ratioClass = p.ratio === '1:1' ? 'ratio-1-1' : (p.ratio === '9:16' ? 'ratio-9-16' : 'ratio-4-5');
                const card = document.createElement('div');
                card.className = `project-card ${isCurrent ? 'active' : ''}`;
                card.innerHTML = `
                    <img class="project-thumb ${ratioClass}" src="${p.thumb || ''}">
                    <div class="project-title">${p.name}</div>
                    <div class="project-meta">Rasio ${p.ratio || '4:5'}</div>
                    <div class="project-actions">
                        <button class="btn-proj-action" onclick="loadProject('${p.id}')">Buka</button>
                        <button class="btn-proj-action" onclick="deleteProject('${p.id}')" style="color:#ff6b6b;">Hapus</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function createNewProjectPrompt() {
            const name = prompt('Nama projek baru:', 'Projek ' + (getProjectsList().length + 1));
            if (!name) return;
            currentProjectId = 'proj_' + Date.now();
            slides = [createDefaultSlide()];
            currentSlideIndex = 0;
            currentRatio = '4:5';
            document.getElementById('currentRatioLabel').innerText = '4:5';
            adjustArtboardSize();
            renderAll();
            renderCarouselThumbs();
            pushHistoryState();
            saveCurrentProjectAuto(name);
            closeProjectModal();
        }

        function saveAsNewProjectPrompt() {
            const name = prompt('Nama salinan projek:', 'Salinan ' + (new Date().toLocaleTimeString()));
            if (!name) return;
            currentProjectId = 'proj_' + Date.now();
            saveCurrentProjectAuto(name);
            renderProjectList();
        }

        function loadProject(id) {
            const p = getProjectsList().find(x => x.id === id);
            if (!p) return;
            currentProjectId = p.id;
            currentRatio = p.ratio || '4:5';
            document.getElementById('currentRatioLabel').innerText = currentRatio;
            slides = deserializeSlides(p.slides || []);
            currentSlideIndex = 0;
            adjustArtboardSize();
            renderAll();
            renderCarouselThumbs();
            renderBottomToolbar();
            pushHistoryState();
            closeProjectModal();
        }

        function deleteProject(id) {
            let list = getProjectsList();
            if (list.length <= 1) { alert('Minimal harus ada 1 projek!'); return; }
            if (confirm('Hapus projek ini?')) {
                list = list.filter(x => x.id !== id);
                saveProjectsList(list);
                if (currentProjectId === id) loadProject(list[0].id);
                else renderProjectList();
            }
        }

        /* =========================================================================
           EKSPOR DENGAN PILIHAN RESOLUSI TINGGI
           ========================================================================= */
        function exportPoster() {
            deselectElement();
            renderAll();

            const scaleMultiplier = parseFloat(document.getElementById('exportQualitySelect').value) || 2.0;
            const expCanvas = document.createElement('canvas');
            expCanvas.width = mainCanvas.width * scaleMultiplier;
            expCanvas.height = mainCanvas.height * scaleMultiplier;
            const expCtx = expCanvas.getContext('2d');
            expCtx.imageSmoothingEnabled = true;
            expCtx.imageSmoothingQuality = 'high';
            expCtx.drawImage(mainCanvas, 0, 0, expCanvas.width, expCanvas.height);

            setTimeout(() => {
                const link = document.createElement('a');
                link.download = `poster-dakwah-${currentRatio}-${Date.now()}.jpg`;
                link.href = expCanvas.toDataURL('image/jpeg', 0.98);
                link.click();
            }, 80);
        }

        window.onload = initApp;
    </script>
</body>
</html>
