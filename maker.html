<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Studio Poster Maker Pro - Canva & PixelLab Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Amiri:wght@400;700&family=Anton&family=Archivo+Black&family=Baloo+2:wght@600;800&family=Bebas+Neue&family=Big+Shoulders+Display:wght@700;900&family=Bungee&family=Caveat:wght@400;700&family=Cinzel:wght@400;700;900&family=Fredoka:wght@600;700&family=Inter:wght@400;600;700;800&family=Lora:wght@500;700&family=Montserrat:wght@400;700;800;900&family=Nunito:wght@700;900&family=Orbitron:wght@700;900&family=Oswald:wght@700&family=Outfit:wght@600;800;900&family=Passion+One:wght@700&family=Playfair+Display:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Righteous&family=Rubik:wght@700;900&family=Space+Mono:wght@400;700&family=Staatliches&family=Teko:wght@700&family=Titan+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;outline:none;}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0b0b;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;user-select:none;}
.top-navbar{height:50px;background:#141414;border-bottom:1px solid rgba(212,175,55,.25);display:flex;align-items:center;padding:0 10px;gap:8px;z-index:200;position:relative;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none;}
.top-navbar::-webkit-scrollbar{display:none;}
.nav-left,.nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.btn-nav{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#ddd;height:34px;padding:0 10px;border-radius:17px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;cursor:pointer;flex-shrink:0;}
.btn-nav:hover{background:rgba(212,175,55,.15);border-color:#D4AF37;color:#D4AF37;}
.btn-nav.active{background:#D4AF37;color:#111;border-color:#D4AF37;}
.btn-nav:disabled{opacity:.35;cursor:not-allowed;}
.btn-download{background:linear-gradient(135deg,#FFE259,#D4AF37);color:#111;border:none;}
.select-quality{height:34px;background:#1e1e1e;border:1px solid #D4AF37;color:#D4AF37;border-radius:17px;padding:0 8px;font-size:11px;font-weight:700;}
.save-indicator{font-size:10px;color:#888;display:flex;align-items:center;gap:4px;padding:0 4px;}
.save-dot{width:7px;height:7px;border-radius:50%;background:#4CAF50;transition:.3s;}
.save-dot.syncing{background:#FFA000;animation:pulseSync 1s infinite;}
@keyframes pulseSync{0%,100%{opacity:.3;}50%{opacity:1;}}
.workspace-viewport{position:absolute;top:50px;bottom:120px;left:0;right:0;background:#060606;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 0);background-size:20px 20px;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;}
.artboard-container{position:relative;box-shadow:0 15px 45px rgba(0,0,0,.9),0 0 0 1px rgba(212,175,55,.3);border-radius:6px;overflow:visible;background:#181818;transform-origin:center center;touch-action:none;transition:transform .05s ease-out;}
#mainCanvas{display:block;width:100%;height:100%;border-radius:6px;touch-action:none;}
.bleed-guides{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;display:none;z-index:90;}
.bleed-guides.visible{display:block;}
.guide-line-h{position:absolute;left:0;right:0;height:1px;border-top:1px dashed rgba(212,175,55,.6);}
.guide-line-v{position:absolute;top:0;bottom:0;width:1px;border-left:1px dashed rgba(212,175,55,.6);}
.snap-guide{position:absolute;pointer-events:none;display:none;z-index:92;}
.snap-guide-h{left:0;right:0;height:1.5px;background:#00f3ff;box-shadow:0 0 8px #00f3ff;}
.snap-guide-v{top:0;bottom:0;width:1.5px;background:#00f3ff;box-shadow:0 0 8px #00f3ff;}
.selection-box{position:absolute;border:2px solid #D4AF37;pointer-events:none;display:none;z-index:99;box-shadow:0 0 12px rgba(212,175,55,.4);}
.selection-box.active{display:block;}
.sel-handle{position:absolute;width:16px;height:16px;background:#fff;border:2px solid #D4AF37;border-radius:50%;pointer-events:auto;box-shadow:0 2px 6px rgba(0,0,0,.7);touch-action:none;}
.sel-handle.tl{top:-8px;left:-8px;}
.sel-handle.tr{top:-8px;right:-8px;}
.sel-handle.bl{bottom:-8px;left:-8px;}
.sel-handle.br{bottom:-8px;right:-8px;}
.sel-handle-edge{position:absolute;background:#D4AF37;pointer-events:auto;border-radius:3px;touch-action:none;}
.sel-handle-edge.r{top:50%;right:-6px;transform:translateY(-50%);width:6px;height:26px;}
.sel-handle-edge.l{top:50%;left:-6px;transform:translateY(-50%);width:6px;height:26px;}
.sel-handle-edge.t{left:50%;top:-6px;transform:translateX(-50%);width:26px;height:6px;}
.sel-handle-edge.b{left:50%;bottom:-6px;transform:translateX(-50%);width:26px;height:6px;}
.stalk-container{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;pointer-events:auto;z-index:110;bottom:-48px;}
.canva-stalk-btn{width:34px;height:34px;border-radius:50%;background:#1e1e1e;border:2px solid #D4AF37;color:#D4AF37;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:grab;box-shadow:0 4px 12px rgba(0,0,0,.7);touch-action:none;}
.canva-stalk-btn:active{background:#D4AF37;color:#111;}

/* Canvas Direct Inline Text Editor */
#canvasDirectTextEditor{position:absolute;display:none;background:transparent;border:2px dashed #D4AF37;color:#fff;outline:none;line-height:1.3;z-index:160;caret-color:#FFE259;box-shadow:0 0 15px rgba(212,175,55,.6);word-break:break-word;user-select:text;padding:4px 6px;border-radius:4px;}

.carousel-bar{position:absolute;bottom:62px;left:0;right:0;height:56px;background:rgba(18,18,18,.95);border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;padding:0 10px;gap:8px;overflow-x:auto;z-index:180;scrollbar-width:none;}
.carousel-bar::-webkit-scrollbar{display:none;}
.slide-thumb{flex-shrink:0;width:38px;height:50px;background:#252525;border:2px solid transparent;border-radius:6px;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:#aaa;font-weight:bold;}
.slide-thumb.active{border-color:#D4AF37;color:#fff;}
.btn-add-slide{flex-shrink:0;width:38px;height:50px;background:rgba(212,175,55,.1);border:1px dashed #D4AF37;border-radius:6px;color:#D4AF37;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.btn-dup-slide{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#bbb;height:32px;padding:0 8px;border-radius:8px;font-size:11px;font-weight:bold;cursor:pointer;}
.btn-del-slide{background:rgba(255,75,75,.12);border:1px solid rgba(255,75,75,.3);color:#ff6b6b;height:32px;padding:0 8px;border-radius:8px;font-size:11px;cursor:pointer;}
.bottom-toolbar-container{position:absolute;bottom:0;left:0;right:0;height:62px;background:#141414;border-top:1px solid rgba(212,175,55,.25);z-index:190;display:flex;align-items:center;padding:0 8px;overflow-x:auto;scrollbar-width:none;gap:6px;}
.bottom-toolbar-container::-webkit-scrollbar{display:none;}
.tool-btn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:62px;height:54px;background:transparent;border:none;color:#aaa;font-size:10px;font-weight:700;border-radius:10px;cursor:pointer;transition:.2s;}
.tool-btn .icon{font-size:18px;line-height:1;}
.tool-btn:hover,.tool-btn.active{background:rgba(212,175,55,.15);color:#D4AF37;}
.tool-btn.home-btn{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#fff;}
.tool-panel{position:absolute;bottom:62px;left:0;right:0;max-height:390px;background:#181818;border-top:1px solid rgba(212,175,55,.3);border-radius:18px 18px 0 0;z-index:185;padding:14px 16px;box-shadow:0 -10px 30px rgba(0,0,0,.85);display:none;flex-direction:column;overflow-y:auto;gap:12px;animation:slideUpPanel .25s cubic-bezier(.16,1,.3,1);}
.tool-panel.active{display:flex;}
@keyframes slideUpPanel{from{transform:translateY(100%);}to{transform:translateY(0);}}
.panel-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:8px;}
.panel-title{font-size:13px;font-weight:800;color:#D4AF37;}
.panel-close{background:none;border:none;color:#888;font-size:18px;cursor:pointer;}
.ctrl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.ctrl-label{font-size:11px;color:#bbb;font-weight:bold;min-width:70px;}
.ctrl-slider{flex:1;accent-color:#D4AF37;cursor:pointer;}
.ctrl-val{font-size:11px;color:#D4AF37;font-weight:bold;min-width:40px;text-align:right;}
.ctrl-grid-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.btn-sub-tool{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#ddd;padding:8px 4px;border-radius:8px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;text-align:center;}
.btn-sub-tool.active{background:#D4AF37;color:#111;border-color:#D4AF37;}
.color-palette-scroll{display:flex;gap:8px;overflow-x:auto;padding:4px 0;}
.color-circle{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.2);flex-shrink:0;cursor:pointer;}
.color-circle.active{border-color:#D4AF37;transform:scale(1.2);}
.stepper-row{display:flex;align-items:center;gap:8px;margin-top:4px;}
.btn-step{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.btn-step:hover{background:#D4AF37;color:#111;}
.btn-reset-tool{padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#bbb;font-size:11px;cursor:pointer;margin-left:auto;}
.pos-grid-3x3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.btn-pos-cell{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#ccc;padding:10px 4px;border-radius:8px;font-size:11px;cursor:pointer;text-align:center;}
.btn-pos-cell:hover,.btn-pos-cell.active{border-color:#D4AF37;color:#D4AF37;background:rgba(212,175,55,.15);}
.dpad-container{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:6px;}
.dpad-row{display:flex;align-items:center;gap:4px;}
.dpad-btn{width:46px;height:40px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:8px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none;}
.dpad-btn:active{background:#D4AF37;color:#111;}
.dpad-center{width:76px;height:40px;background:rgba(0,0,0,.4);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#aaa;}
.pixellab-zoom-widget{position:absolute;top:60px;right:14px;display:flex;align-items:center;gap:4px;background:rgba(20,20,20,.45);border:1px solid rgba(212,175,55,.25);border-radius:20px;padding:4px 6px;z-index:105;backdrop-filter:blur(8px);}
.zoom-btn{background:rgba(255,255,255,.06);border:none;color:#eee;font-size:11px;padding:5px 7px;border-radius:10px;cursor:pointer;}
.zoom-btn:hover{background:#D4AF37;color:#111;}
.pan-group{display:flex;gap:2px;border-left:1px solid rgba(255,255,255,.12);padding-left:4px;margin-left:2px;}

/* Kaca Pembesar Bertangkai Khusus */
.handled-loupe-container{position:fixed;display:none;z-index:10005;touch-action:none;}
.handled-loupe-glass{width:86px;height:86px;border-radius:50%;border:3px solid #D4AF37;box-shadow:0 6px 25px rgba(0,0,0,.9);position:relative;background:#000;overflow:hidden;pointer-events:none;}
.handled-loupe-crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:12px;height:12px;border:1.5px solid #fff;border-radius:50%;pointer-events:none;}
.handled-loupe-stalk{width:42px;height:65px;background:linear-gradient(180deg,#2a2a2a,#111);border:2px solid #D4AF37;border-radius:21px;margin:-8px auto 0;box-shadow:0 5px 15px rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;color:#D4AF37;font-size:18px;cursor:grab;pointer-events:auto;touch-action:none;}
.handled-loupe-stalk:active{cursor:grabbing;background:#D4AF37;color:#111;}
.handled-loupe-footer{background:rgba(18,18,18,.95);border:1px solid #D4AF37;border-radius:14px;padding:4px 10px;display:flex;align-items:center;gap:6px;margin-top:6px;pointer-events:auto;}

/* Word Selection Slider & Strip */
.word-strip-container{display:flex;flex-wrap:wrap;gap:4px;padding:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:8px;max-height:120px;overflow-y:auto;margin:6px 0;}
.word-chip{padding:3px 6px;border-radius:4px;font-size:11px;background:rgba(255,255,255,.06);color:#bbb;cursor:pointer;border:1px solid transparent;}
.word-chip.selected{background:#D4AF37;color:#111;font-weight:bold;border-color:#FFE259;}

.project-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:999;display:none;align-items:center;justify-content:center;padding:16px;}
.project-modal.active{display:flex;}
.project-dialog{background:#181818;border:1px solid rgba(212,175,55,.3);border-radius:16px;max-width:580px;width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;}
.project-header{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between;}
.project-grid{padding:16px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;}
.project-card{background:#222;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px;cursor:pointer;display:flex;flex-direction:column;}
.project-card:hover,.project-card.active{border-color:#D4AF37;}
.project-thumb{width:100%;background:#111;border-radius:6px;margin-bottom:8px;object-fit:cover;aspect-ratio:4/5;}
.project-title{font-size:12px;font-weight:700;color:#eee;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.project-meta{font-size:10px;color:#888;}
.project-actions{display:flex;gap:6px;margin-top:8px;}
.btn-proj-action{flex:1;padding:4px 0;border-radius:4px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#ddd;font-size:10px;cursor:pointer;}
.btn-proj-action:hover{background:#D4AF37;color:#111;}
.asset-search-input{width:100%;height:38px;background:#242424;border:1px solid rgba(212,175,55,.4);border-radius:19px;color:#fff;padding:0 14px;font-size:12px;}
.tag-pill{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:4px 10px;font-size:11px;color:#ddd;cursor:pointer;white-space:nowrap;}
.tag-pill:hover,.tag-pill.active{background:#D4AF37;color:#111;font-weight:bold;}
.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;max-height:220px;overflow-y:auto;padding-right:4px;}
.asset-item{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;padding:4px;position:relative;}
.asset-item:hover{border-color:#D4AF37;transform:scale(1.04);}
.asset-item img{max-width:100%;max-height:100%;object-fit:contain;}
.layer-list-container{display:flex;flex-direction:column;gap:6px;}
.layer-item{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);padding:8px 12px;border-radius:8px;font-size:12px;cursor:pointer;}
.layer-item.active{border-color:#D4AF37;color:#D4AF37;font-weight:bold;background:rgba(212,175,55,.12);}
.layer-actions{display:flex;gap:4px;}
.layer-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:4px;color:#aaa;cursor:pointer;font-size:11px;padding:3px 6px;}
.layer-btn:hover{color:#fff;border-color:#D4AF37;}
.group-select-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);margin-bottom:8px;cursor:pointer;}
.group-select-item.current-item{border-color:#D4AF37;background:rgba(212,175,55,.15);box-shadow:0 0 10px rgba(212,175,55,.2);}
.group-checkbox{width:18px;height:18px;accent-color:#D4AF37;}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(20,20,20,.92);border:1px solid #D4AF37;color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;z-index:9999;pointer-events:none;opacity:0;transition:.25s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.feature-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);z-index:9999;display:none;flex-direction:column;}
.feature-modal.active{display:flex;}
.fmodal-header{height:54px;border-bottom:1px solid rgba(212,175,55,.3);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#141414;}
.fmodal-body{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;}
.fmodal-footer{height:66px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#141414;}
.persp-pin{position:absolute;width:28px;height:28px;border-radius:50%;background:#D4AF37;border:3px solid #fff;box-shadow:0 0 10px rgba(0,0,0,.8);cursor:pointer;touch-action:none;transform:translate(-50%,-50%);z-index:10;}
.brush-monitor-circle{position:fixed;border:2px dashed #00ff88;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);display:none;z-index:10010;background:rgba(0,255,136,.1);}
</style>
</head>
<body>

<header class="top-navbar">
<div class="nav-left">
<a href="index.html" class="btn-nav">⬅️ Arsip</a>
<button class="btn-nav" id="btnUndo" onclick="undo()" disabled>↩️</button>
<button class="btn-nav" id="btnRedo" onclick="redo()" disabled>↪️</button>
<div class="save-indicator"><span class="save-dot" id="saveDot"></span><span id="saveText">Tersimpan</span></div>
</div>
<div class="nav-right">
<button class="btn-nav" onclick="openProjectModal()" style="border-color:#D4AF37;color:#D4AF37;">📁 Projek</button>
<button class="btn-nav" onclick="toggleRatioSelector()">📏 <span id="currentRatioLabel">4:5</span></button>
<button class="btn-nav" onclick="openPanelBleed()">📐 Garis Bantu</button>
<select class="select-quality" id="exportQualitySelect">
<option value="0.75">SD (810p)</option>
<option value="1.0">HD (1080p)</option>
<option value="1.5" selected>Ultra HD (1620p)</option>
<option value="2.0">Ultra HD Pro Max 4K (2160p)</option>
</select>
<button class="btn-nav btn-download" onclick="exportPoster()">💾 Simpan</button>
</div>
</header>

<main class="workspace-viewport" id="workspaceViewport" onclick="handleViewportClick(event)">
<div class="pixellab-zoom-widget">
<button class="zoom-btn" onclick="zoomCanvasManual(-0.25)">🔍-</button>
<button class="zoom-btn" id="zoomLevelLabel" onclick="resetCanvasZoom()" style="min-width:44px;font-weight:700;">100%</button>
<button class="zoom-btn" onclick="zoomCanvasManual(0.25)">🔍+</button>
<button class="zoom-btn" onclick="centerCanvasArtboard()">🎯</button>
<div class="pan-group">
<button class="zoom-btn" onclick="panCanvas(0,-40)">▲</button>
<button class="zoom-btn" onclick="panCanvas(-40,0)">◀</button>
<button class="zoom-btn" onclick="panCanvas(40,0)">▶</button>
<button class="zoom-btn" onclick="panCanvas(0,40)">▼</button>
</div>
</div>

<div class="artboard-container" id="artboard">
<canvas id="mainCanvas"></canvas>

<!-- Snap Guides Magnet Canva -->
<div class="snap-guide snap-guide-h" id="snapGuideH"></div>
<div class="snap-guide snap-guide-v" id="snapGuideV"></div>

<div class="bleed-guides" id="bleedGuides">
<div class="guide-line-h" id="bleedLineTop" style="top:5%;"></div>
<div class="guide-line-h" id="bleedLineBottom" style="bottom:5%;"></div>
<div class="guide-line-v" id="bleedLineLeft" style="left:5%;"></div>
<div class="guide-line-v" id="bleedLineRight" style="right:5%;"></div>
<div class="guide-line-h" id="bleedLineMidH" style="top:50%;border-top-color:#00e5ff;display:none;"></div>

img.onload=()=>requestRender();
imageCache.set(src,img);
return img;

}

function requestRender(){
if(!renderPending){
renderPending=true;
requestAnimationFrame(()=>{renderPending=false;renderAll();});
}

function serializeSlides(slidesList){
return slidesList.map(s=>({
...s,
background:{...s.background,imgSrc:s.background.img?s.background.img.src:(s.background.imgSrc||null),img:undefined},
elements:s.elements.map(el=>{
const copy={...el};
if(el.type==='image'){
copy.imgSrc=el.src||(el.img?el.img.src:copy.imgSrc);
delete copy.img;
}
if(el.textSkinImg){copy.textSkinSrc=el.textSkinSrc||el.textSkinImg.src;delete copy.textSkinImg;}
if(el.imageSkinImg){copy.imageSkinSrc=el.imageSkinSrc||el.imageSkinImg.src;delete copy.imageSkinImg;}
return copy;
})
}));
}

function deserializeSlides(rawSlides){
return rawSlides.map(s=>{
const bgSrc=s.background.imgSrc||(s.background.img&&s.background.img.src);
return{
...s,
background:{...s.background,imgSrc:bgSrc,img:bgSrc?getImageFromCache(bgSrc):null},
elements:s.elements.map(el=>{
const copy={...el};
if(copy.type==='image'){
const src=copy.imgSrc||copy.src;
copy.src=src;
copy.img=src?getImageFromCache(src):null;
if(copy.cropL===undefined)copy.cropL=0;
if(copy.cropR===undefined)copy.cropR=0;
if(copy.cropT===undefined)copy.cropT=0;
if(copy.cropB===undefined)copy.cropB=0;
}
if(copy.textSkinSrc){copy.textSkinImg=getImageFromCache(copy.textSkinSrc);}
if(copy.imageSkinSrc){copy.imageSkinImg=getImageFromCache(copy.imageSkinSrc);}
return copy;
})
};
});
}

function saveToStorage(){
try{
const dataToSave={id:currentProjectId,ratio:currentRatio,slideIndex:currentSlideIndex,slides:serializeSlides(slides)};

function loadFromStorage(){
try{
const storedId=localStorage.getItem(CURRENT_PROJ_ID_KEY);
if(storedId)currentProjectId=storedId;
const raw=localStorage.getItem(STORAGE_KEY);
if(!raw)return;
const parsed=JSON.parse(raw);
if(parsed.ratio&&RATIO_PRESETS[parsed.ratio]){currentRatio=parsed.ratio;document.getElementById('currentRatioLabel').innerText=currentRatio;}
currentSlideIndex=parsed.slideIndex||0;
slides=deserializeSlides(parsed.slides||[]);
}catch(e){console.error("Gagal load storage:",e);}
}

function pushHistoryState(){
clearTimeout(historyDebounceTimer);
if(historyIndex<historyStack.length-1){historyStack=historyStack.slice(0,historyIndex+1);}
const state=JSON.stringify({ratio:currentRatio,currentSlideIndex,slides:serializeSlides(slides)});
historyStack.push(state);
if(historyStack.length>MAX_HISTORY){historyStack.shift();}
historyIndex=historyStack.length-1;
updateUndoRedoButtons();
triggerAutoSave();
}

function undo(){if(historyIndex>0){historyIndex--;applyHistoryState(historyStack[historyIndex]);}}
function redo(){if(historyIndex<historyStack.length-1){historyIndex++;applyHistoryState(historyStack[historyIndex]);}}

function applyHistoryState(jsonStr){
const parsed=JSON.parse(jsonStr);
currentRatio=parsed.ratio;
currentSlideIndex=Math.min(parsed.currentSlideIndex,parsed.slides.length-1);
document.getElementById('currentRatioLabel').innerText=currentRatio;
slides=deserializeSlides(parsed.slides);
adjustArtboardSize();
updateUndoRedoButtons();
requestRender();
renderCarouselThumbs();
renderBottomToolbar();
triggerAutoSave();
}

function updateUndoRedoButtons(){

function adjustArtboardSize(){

mainCanvas.width=targetW;
mainCanvas.height=targetH;
const vp=document.getElementById('workspaceViewport');

const availW=vp.clientWidth-padding;
const availH=vp.clientHeight-padding;

const scaleH=availH/targetH;
canvasScale=Math.min(scaleW,scaleH);
artboard.style.width=`${targetW*canvasScale}px`;
artboard.style.height=`${targetH*canvasScale}px`;
updateCanvasTransform();
updateSelectionBox();
}

function zoomCanvasManual(delta){userZoomScale=Math.max(0.4,Math.min(5.0,userZoomScale+delta));updateCanvasTransform();}

function centerCanvasArtboard(){viewportPanX=0;viewportPanY=0;userZoomScale=1.0;updateCanvasTransform();showToast('🎯 Kanvas dipusatkan');}
function panCanvas(dx,dy){viewportPanX+=dx;viewportPanY+=dy;updateCanvasTransform();}
function updateCanvasTransform(){
const lbl=document.getElementById('zoomLevelLabel');
if(lbl)lbl.innerText=`${Math.round(userZoomScale*100)}%`;
artboard.style.transform=`translate(${viewportPanX}px,${viewportPanY}px) scale(${userZoomScale})`;
}

function stepSliderVal(sliderId,delta,callback){
const slider=document.getElementById(sliderId);
if(!slider)return;
const min=parseFloat(slider.min)||0;
const max=parseFloat(slider.max)||100;
let val=parseFloat(slider.value)+delta;
val=Math.max(min,Math.min(max,val));
const step=parseFloat(slider.step)||1;
if(step>=1)val=Math.round(val);
slider.value=val;
if(callback)callback(val);
}

/* ========== TEXT FORMATTING & JUSTIFY ENGINE ========== */
function getCleanFont(font){
if(!font)return '"Plus Jakarta Sans",sans-serif';
const parts=font.split(',').map(p=>{
const trimmed=p.trim().replace(/['"]/g,'');
if(trimmed.includes(' ')&&!trimmed.startsWith('"'))return `"${trimmed}"`;
return trimmed;
});
return parts.join(', ');
}

function getWrappedLines(targetCtx,text,maxWidth,el){
if(!maxWidth||maxWidth<=0)maxWidth=750;
const rawText=text||'';
const paragraphs=rawText.split('\n');
const lines=[];
targetCtx.font=`${el.fontStyle||'normal'} ${el.fontWeight||'normal'} ${el.fontSize}px ${getCleanFont(el.fontFamily)}`;

for(let pIdx=0;pIdx<paragraphs.length;pIdx++){
const para=paragraphs[pIdx];
if(!para){
lines.push({words:[''],isLastLineOfPara:true});
continue;
}
const words=para.split(' ').filter(w=>w.length>0);
if(words.length===0){
lines.push({words:[''],isLastLineOfPara:true});
continue;
}

let currentLineWords=[];
let currentLineWidth=0;

for(let w=0;w<words.length;w++){
const word=words[w];
const wordMetrics=targetCtx.measureText(word).width+((el.letterSpacing||0)*word.length);

if(wordMetrics>maxWidth){
let chunk='';
for(let c=0;c<word.length;c++){
const char=word[c];
const testChunk=chunk+char;
const cw=targetCtx.measureText(testChunk).width+((el.letterSpacing||0)*testChunk.length);
if(cw>maxWidth&&chunk.length>0){
currentLineWords.push(chunk);
lines.push({words:currentLineWords,isLastLineOfPara:false});
currentLineWords=[];
chunk=char;
}else{
chunk=testChunk;
}
}
if(chunk.length>0){
currentLineWords.push(chunk);
currentLineWidth=targetCtx.measureText(chunk).width;
}
continue;
}

const wordWithSpace=(w<words.length-1)?word+' ':word;
const wMetrics=targetCtx.measureText(wordWithSpace);
const addSpacing=(el.letterSpacing||0)*wordWithSpace.length;
const wordW=wMetrics.width+addSpacing;

if(currentLineWidth+wordW>maxWidth&&currentLineWords.length>0){
lines.push({words:currentLineWords,isLastLineOfPara:false});
currentLineWords=[];
currentLineWidth=0;
}
currentLineWords.push(word);
currentLineWidth+=wordW;
}
if(currentLineWords.length>0){
lines.push({words:currentLineWords,isLastLineOfPara:true});
}
}
return lines;
}

/* ========== RENDER ENGINE UTAMA ========== */
function renderAll(){
const s=getCurrentSlide();
if(!s)return;
const W=mainCanvas.width;
const H=mainCanvas.height;
ctx.clearRect(0,0,W,H);
renderBackground(s.background,W,H);
if(s.elements){
s.elements.forEach(el=>{
if(el.id===editingElementId)return;
if(el.type==='text')renderTextElement(ctx,el);
else if(el.type==='image')renderImageElement(ctx,el);
});
}
updateSelectionBox();
}

function renderBackground(bg,W,H){
if(!bg)return;
if(bg.img&&bg.img.complete){
ctx.save();
if(bg.blur>0)ctx.filter=`blur(${bg.blur*2}px)`;
const baseRatio=Math.max(W/bg.img.width,H/bg.img.height);
const scale=(bg.scale||1.0)*baseRatio;
const drawW=bg.img.width*scale;
const drawH=bg.img.height*scale;
const x=((W-drawW)/2)+(bg.offsetX||0);
const y=((H-drawH)/2)+(bg.offsetY||0);
ctx.drawImage(bg.img,x,y,drawW,drawH);
ctx.restore();
}else{
const grad=ctx.createRadialGradient(W/2,H*0.35,100,W/2,H/2,W);
grad.addColorStop(0,bg.color1||'#241a14');
grad.addColorStop(1,bg.color2||'#090807');
ctx.fillStyle=grad;
ctx.fillRect(0,0,W,H);
}
if(bg.darken>0){ctx.fillStyle=`rgba(0,0,0,${bg.darken})`;ctx.fillRect(0,0,W,H);}
}

function applyAlphaToColor(col,alpha){
if(!col||col==='transparent')return 'transparent';
if(col.startsWith('rgba')){
return col.replace(/[\d\.]+\)$/,`${alpha})`);
}
if(col.startsWith('rgb')){
return col.replace('rgb','rgba').replace(')',`, ${alpha})`);
}
if(col.startsWith('#')){
let c=col.substring(1);
if(c.length===3)c=c.split('').map(x=>x+x).join('');
const num=parseInt(c,16);
return `rgba(${(num>>16)&255}, ${(num>>8)&255}, ${num&255}, ${alpha})`;
}
return col;
}

/* ========== RENDER TEKS (JUSTIFY, STABILO SLANTED, EMBOSS, INNER SHADOW) ========== */
function renderTextElement(targetCtx,el){
targetCtx.save();
targetCtx.translate(el.x,el.y);
if(el.rotation)targetCtx.rotate((el.rotation*Math.PI)/180);
if(el.italicSlant){const rad=(el.italicSlant*Math.PI)/180;targetCtx.transform(1,0,Math.tan(rad),1,0,0);}
targetCtx.globalAlpha=el.opacity!==undefined?el.opacity:1;

const fontSize=el.fontSize;
const lineHeight=fontSize*(el.lineHeight||1.3);
const cleanFont=getCleanFont(el.fontFamily);
const maxBoxWidth=el.width||750;
let displayText=el.text||'';

if(el.textTransform==='uppercase')displayText=displayText.toUpperCase();
else if(el.textTransform==='lowercase')displayText=displayText.toLowerCase();
else if(el.textTransform==='sentence')displayText=displayText.replace(/(^\s*\w|[\.\!\?]\s*\w)/g,c=>c.toUpperCase());
else if(el.textTransform==='title')displayText=displayText.replace(/\b\w/g,c=>c.toUpperCase());

const wrappedData=getWrappedLines(targetCtx,displayText,maxBoxWidth,el);
const totalHeight=wrappedData.length*lineHeight;
el._calculatedHeight=totalHeight;
el._renderedW=maxBoxWidth;

if(el.curveAngle&&Math.abs(el.curveAngle)>=3){
renderCurvedTextLine(targetCtx,el,displayText,cleanFont);
targetCtx.restore();
return;
}

let startY=-(totalHeight/2)+(lineHeight/2);
const letterSpace=el.letterSpacing||0;
let globalWordCount=0;

wrappedData.forEach((lineObj,idx)=>{
const words=lineObj.words;
const isLast=lineObj.isLastLineOfPara;
const lineY=startY+(idx*lineHeight);

targetCtx.font=`${el.fontStyle||'normal'} ${el.fontWeight||'normal'} ${fontSize}px ${cleanFont}`;
let lineText=words.join(' ');
let totalLineWidth=targetCtx.measureText(lineText).width+(letterSpace*lineText.length);

let isJustify=(el.textAlign==='justify');
let extraGapPerWord=0;

if(isJustify&&!isLast&&words.length>1){
const diff=maxBoxWidth-totalLineWidth;
if(diff>0)extraGapPerWord=diff/(words.length-1);
}

let startX=-(totalLineWidth/2);
if(el.textAlign==='left'||(isJustify&&!extraGapPerWord))startX=-(maxBoxWidth/2);
else if(el.textAlign==='right')startX=(maxBoxWidth/2)-totalLineWidth;
else if(isJustify&&extraGapPerWord>0)startX=-(maxBoxWidth/2);

const drawW=isJustify&&extraGapPerWord>0?maxBoxWidth:totalLineWidth;
const padX=el.highlightPaddingX!==undefined?el.highlightPaddingX:12;
const padY=el.highlightPaddingY!==undefined?el.highlightPaddingY:4;
const radius=el.highlightRadius!==undefined?el.highlightRadius:6;

if(el.highlightColor&&el.highlightColor!=='transparent'&&(!el.wordHighlights||el.wordHighlights.length===0)){
targetCtx.save();
targetCtx.fillStyle=el.highlightColor;
targetCtx.globalAlpha=(el.opacity||1)*(el.highlightAlpha!==undefined?el.highlightAlpha:0.5);
targetCtx.beginPath();
targetCtx.roundRect(startX-padX,lineY-(lineHeight/2)-padY,drawW+(padX*2),lineHeight+(padY*2),radius);
targetCtx.fill();
targetCtx.restore();
}

if(el.shadow&&el.shadow.color&&el.shadow.color!=='transparent'){
targetCtx.save();
const shAlpha=el.shadow.alpha!==undefined?el.shadow.alpha:0.8;
targetCtx.shadowColor=applyAlphaToColor(el.shadow.color,shAlpha);
targetCtx.shadowBlur=el.shadow.blur||0;
const rad=(el.shadow.angle||45)*Math.PI/180;
const dist=el.shadow.distance||0;
targetCtx.shadowOffsetX=Math.cos(rad)*dist;
targetCtx.shadowOffsetY=Math.sin(rad)*dist;
}

let curX=startX;
targetCtx.textAlign='left';
targetCtx.textBaseline='middle';

words.forEach((word,wIdx)=>{
const currentGlobalWordIdx=globalWordCount++;
const isWordHighlighted=el.wordHighlights&&el.wordHighlights.includes(currentGlobalWordIdx);
const isWordBold=(el.boldWords&&el.boldWords.includes(currentGlobalWordIdx))||el.fontWeight==='bold'||el.fontWeight==='900';
const isWordItalic=(el.italicWords&&el.italicWords.includes(currentGlobalWordIdx))||el.fontStyle==='italic';
const isWordUnderline=(el.underlineWords&&el.underlineWords.includes(currentGlobalWordIdx))||el.textDecoration==='underline';

const fStyle=isWordItalic?'italic':'normal';
const fWeight=isWordBold?'bold':'normal';
targetCtx.font=`${fStyle} ${fWeight} ${fontSize}px ${cleanFont}`;

const wordWithSpace=(wIdx<words.length-1)?word+' ':word;
const wordW=targetCtx.measureText(wordWithSpace).width+(letterSpace*wordWithSpace.length);

if(isWordHighlighted&&el.highlightColor&&el.highlightColor!=='transparent'){
targetCtx.save();
targetCtx.fillStyle=el.highlightColor;
targetCtx.globalAlpha=(el.opacity||1)*(el.highlightAlpha!==undefined?el.highlightAlpha:0.5);
targetCtx.beginPath();
targetCtx.roundRect(curX-4,lineY-(lineHeight/2)-2,wordW+8,lineHeight+4,radius);
targetCtx.fill();
targetCtx.restore();
}

if(el.emboss&&el.emboss.active){
const depth=el.emboss.depth||2.5;
const emRad=(el.emboss.lightAngle||45)*Math.PI/180;
const edx=Math.cos(emRad)*depth;
const edy=Math.sin(emRad)*depth;
targetCtx.save();
targetCtx.globalAlpha=(el.opacity||1)*(el.emboss.intensity!==undefined?el.emboss.intensity:0.85);
targetCtx.fillStyle=el.emboss.highlightColor||'rgba(255,255,255,0.85)';
targetCtx.fillText(wordWithSpace,curX-edx,lineY-edy);
targetCtx.fillStyle=el.emboss.shadowColor||'rgba(0,0,0,0.85)';
targetCtx.fillText(wordWithSpace,curX+edx,lineY+edy);
targetCtx.restore();
}

if(el.textSkinImg&&el.textSkinImg.complete){
drawTextWithSkinImageFull(targetCtx,wordWithSpace,curX,lineY,wordW,fontSize,el);
}else{
targetCtx.fillStyle=el.color||'#fff';
if(letterSpace===0){targetCtx.fillText(wordWithSpace,curX,lineY);}
else{
let charX=curX;
for(let c=0;c<wordWithSpace.length;c++){
const ch=wordWithSpace[c];
targetCtx.fillText(ch,charX,lineY);
charX+=targetCtx.measureText(ch).width+letterSpace;
}
}
if(el.borderWidth&&el.borderWidth>0){
targetCtx.lineWidth=el.borderWidth*2;
targetCtx.strokeStyle=el.borderColor||'#D4AF37';
targetCtx.strokeText(wordWithSpace,curX,lineY);
}
}

if(el.innerShadow&&el.innerShadow.color&&el.innerShadow.color!=='transparent'){
targetCtx.save();
targetCtx.lineWidth=el.innerShadow.blur||4;
const ishAlpha=el.innerShadow.alpha!==undefined?el.innerShadow.alpha:0.85;
targetCtx.strokeStyle=applyAlphaToColor(el.innerShadow.color,ishAlpha);
const srad=(el.innerShadow.angle||45)*Math.PI/180;
const sdist=el.innerShadow.distance||3;
targetCtx.strokeText(wordWithSpace,curX+Math.cos(srad)*sdist,lineY+Math.sin(srad)*sdist);
targetCtx.restore();
}

if(isWordUnderline){
targetCtx.save();
targetCtx.strokeStyle=el.color||'#fff';
targetCtx.lineWidth=Math.max(2,fontSize*0.06);
targetCtx.beginPath();
targetCtx.moveTo(curX,lineY+(fontSize*0.45));
targetCtx.lineTo(curX+wordW,lineY+(fontSize*0.45));
targetCtx.stroke();
targetCtx.restore();
}

curX+=wordW+extraGapPerWord;
});
});

if(el.shadow&&el.shadow.color&&el.shadow.color!=='transparent'){
targetCtx.restore();
}
targetCtx.restore();
}

function renderCurvedTextLine(targetCtx,el,text,cleanFont){
if(!text)return;
const angleRad=(el.curveAngle*Math.PI)/180;
const len=text.length;
targetCtx.font=`${el.fontStyle||'normal'} ${el.fontWeight||'normal'} ${el.fontSize}px ${cleanFont}`;
targetCtx.textAlign='center';
targetCtx.textBaseline='middle';
const totalTextWidth=targetCtx.measureText(text).width+((el.letterSpacing||0)*len);
const radius=Math.max(120,totalTextWidth/Math.abs(angleRad));
const isDownward=el.curveAngle>0;
const circleCenterY=isDownward?radius:-radius;
const startAngle=isDownward?(-Math.PI/2)-(angleRad/2):(Math.PI/2)-(angleRad/2);
const stepAngle=angleRad/(len-1||1);

for(let i=0;i<len;i++){
const ch=text[i];
const curA=startAngle+(i*stepAngle);
const charX=radius*Math.cos(curA);
const charY=circleCenterY+(radius*Math.sin(curA));
targetCtx.save();
targetCtx.translate(charX,charY);
const rotA=isDownward?(curA+Math.PI/2):(curA-Math.PI/2);
targetCtx.rotate(rotA);
targetCtx.fillStyle=el.color||'#fff';
targetCtx.fillText(ch,0,0);
targetCtx.restore();
}
}

function drawTextWithSkinImageFull(targetCtx,text,x,y,runW,fontSize,el){
const skin=el.textSkinImg;
if(!skin||!skin.complete){
targetCtx.fillStyle=el.color||'#fff';
targetCtx.fillText(text,x,y);
return;
}
const offW=Math.max(runW+40,100);
const offH=Math.max(fontSize*2,80);
const offscreen=document.createElement('canvas');
offscreen.width=offW;
offscreen.height=offH;
const octx=offscreen.getContext('2d');
octx.font=targetCtx.font;
octx.textAlign='left';
octx.textBaseline='middle';
octx.fillStyle='#000';
octx.fillText(text,10,offH/2);
octx.globalCompositeOperation='source-in';

if(el.skinFilter){
octx.filter=`brightness(${el.skinFilter.brightness||100}%) contrast(${el.skinFilter.contrast||100}%) hue-rotate(${el.skinFilter.hue||0}deg) saturate(${el.skinFilter.saturate||100}%)`;
}
const scale=el.textSkinScale||1.0;
const aspect=skin.width/skin.height;
let drawW=Math.max(offW,offH*aspect)*scale;
let drawH=drawW/aspect;
const dx=((offW-drawW)/2)+(el.textSkinOffsetX||0);
const dy=((offH-drawH)/2)+(el.textSkinOffsetY||0);
octx.drawImage(skin,dx,dy,drawW,drawH);
targetCtx.drawImage(offscreen,x-10,y-(offH/2));
}

/* ========== RENDER IMAGE LENGKAP ========== */
function renderImageElement(targetCtx,el){
if(!el.img||!el.img.complete){
if(el.src||el.imgSrc){el.img=getImageFromCache(el.src||el.imgSrc);}
if(!el.img||!el.img.complete)return;
}

const cropL=el.cropL||0;
const cropR=el.cropR||0;
const cropT=el.cropT||0;
const cropB=el.cropB||0;
const visWFrac=Math.max(0.05,(100-cropL-cropR)/100);
const visHFrac=Math.max(0.05,(100-cropT-cropB)/100);

const sx=el.img.width*(cropL/100);
const sy=el.img.height*(cropT/100);
const sWidth=el.img.width*visWFrac;
const sHeight=el.img.height*visHFrac;

const baseW=el.width||300;
const baseH=el.height||300;
const finalDrawW=Math.round(baseW*visWFrac);
const finalDrawH=Math.round(baseH*visHFrac);
el._renderedW=finalDrawW;
el._renderedH=finalDrawH;

targetCtx.save();
targetCtx.translate(el.x,el.y);
if(el.rotation)targetCtx.rotate((el.rotation*Math.PI)/180);
targetCtx.scale(el.flipH?-1:1,el.flipV?-1:1);
targetCtx.globalAlpha=el.opacity!==undefined?el.opacity:1;
if(el.blendMode&&el.blendMode!=='normal'){targetCtx.globalCompositeOperation=el.blendMode;}

if(el.shadow&&el.shadow.color&&el.shadow.color!=='transparent'){
targetCtx.save();
const shAlpha=el.shadow.alpha!==undefined?el.shadow.alpha:0.8;
targetCtx.shadowColor=applyAlphaToColor(el.shadow.color,shAlpha);
targetCtx.shadowBlur=el.shadow.blur||0;
const rad=(el.shadow.angle||45)*Math.PI/180;
const dist=el.shadow.distance||0;
targetCtx.shadowOffsetX=Math.cos(rad)*dist;
targetCtx.shadowOffsetY=Math.sin(rad)*dist;
}

const off=document.createElement('canvas');
off.width=finalDrawW;
off.height=finalDrawH;
const octx=off.getContext('2d');

const radius=Math.min(el.cornerRadius||0,Math.min(finalDrawW,finalDrawH)/2);
if(radius>0){
octx.beginPath();
octx.roundRect(0,0,finalDrawW,finalDrawH,radius);
octx.clip();
}

if(el.depthFocus&&el.depthFocus.active){
renderTiltShiftDepthBlur(octx,el.img,sx,sy,sWidth,sHeight,finalDrawW,finalDrawH,el.depthFocus);
}else{
if(el.blur&&el.blur>0)octx.filter=`blur(${el.blur}px)`;
octx.drawImage(el.img,sx,sy,sWidth,sHeight,0,0,finalDrawW,finalDrawH);
octx.filter='none';
}

if(el.colorOverlay&&el.colorOverlay!=='none'){
octx.globalCompositeOperation='source-in';
octx.fillStyle=el.colorOverlay;
octx.fillRect(0,0,finalDrawW,finalDrawH);
}

if(el.imageSkinImg&&el.imageSkinImg.complete){
const sOff=document.createElement('canvas');
sOff.width=finalDrawW;
sOff.height=finalDrawH;
const soctx=sOff.getContext('2d');
const sImg=el.imageSkinImg;
const sScale=el.imageSkinScale||1.0;
const sAspect=sImg.width/sImg.height;
let sDrawW=Math.max(finalDrawW,finalDrawH*sAspect)*sScale;
let sDrawH=sDrawW/sAspect;
const sDx=((finalDrawW-sDrawW)/2)+(el.imageSkinOffsetX||0);
const sDy=((finalDrawH-sDrawH)/2)+(el.imageSkinOffsetY||0);
soctx.drawImage(sImg,sDx,sDy,sDrawW,sDrawH);

octx.save();
octx.globalCompositeOperation=el.imageSkinBlend||'source-in';
octx.globalAlpha=el.imageSkinOpacity!==undefined?el.imageSkinOpacity:1.0;
octx.drawImage(sOff,0,0);
octx.restore();
}

if(el.innerShadow&&el.innerShadow.color&&el.innerShadow.color!=='transparent'){
applySilhouetteInnerShadow(octx,finalDrawW,finalDrawH,el.innerShadow);
}

if(el.emboss&&el.emboss.active){
applySilhouetteEmboss(octx,finalDrawW,finalDrawH,el.emboss);
}

if(el.borderWidth&&el.borderWidth>0&&el.borderColor){
renderContourStrokePNG(targetCtx,off,finalDrawW,finalDrawH,el);
}else{
targetCtx.drawImage(off,-finalDrawW/2,-finalDrawH/2,finalDrawW,finalDrawH);
}

if(el.shadow&&el.shadow.color&&el.shadow.color!=='transparent'){
targetCtx.restore();
}
targetCtx.restore();
}

function renderContourStrokePNG(targetCtx,imgCanvas,w,h,el){
const bw=el.borderWidth||4;
const bcolor=el.borderColor||'#D4AF37';
const blur=el.borderBlur||0;
const pad=(bw+blur)*4;
const strokeCanvas=document.createElement('canvas');
strokeCanvas.width=w+pad;
strokeCanvas.height=h+pad;
const sctx=strokeCanvas.getContext('2d');
const cx=pad/2;
const cy=pad/2;

sctx.save();
if(blur>0)sctx.filter=`blur(${blur}px)`;
for(let a=0;a<Math.PI*2;a+=Math.PI/8){
const ox=Math.cos(a)*bw;
const oy=Math.sin(a)*bw;
sctx.drawImage(imgCanvas,cx+ox,cy+oy);
}
sctx.globalCompositeOperation='source-in';
sctx.fillStyle=bcolor;
sctx.globalAlpha=el.borderAlpha!==undefined?el.borderAlpha:1.0;
sctx.fillRect(0,0,strokeCanvas.width,strokeCanvas.height);
sctx.restore();

targetCtx.drawImage(strokeCanvas,(-w/2)-cx,(-h/2)-cy);
targetCtx.drawImage(imgCanvas,-w/2,-h/2,w,h);
}

function applySilhouetteInnerShadow(targetCtx,w,h,ish){
const blur=ish.blur||8;
const rad=(ish.angle||45)*Math.PI/180;
const dist=ish.distance||4;
const ox=Math.cos(rad)*dist;
const oy=Math.sin(rad)*dist;
const temp=document.createElement('canvas');
temp.width=w;temp.height=h;
const tctx=temp.getContext('2d');
tctx.fillStyle='#000';
tctx.fillRect(0,0,w,h);
tctx.globalCompositeOperation='destination-out';
tctx.drawImage(targetCtx.canvas,0,0);

targetCtx.save();
targetCtx.globalCompositeOperation='source-atop';
const ishAlpha=ish.alpha!==undefined?ish.alpha:0.85;
targetCtx.shadowColor=applyAlphaToColor(ish.color||'#000000',ishAlpha);
targetCtx.shadowBlur=blur;
targetCtx.shadowOffsetX=ox;
targetCtx.shadowOffsetY=oy;
targetCtx.drawImage(temp,0,0);
targetCtx.restore();
}

function applySilhouetteEmboss(targetCtx,w,h,em){
const depth=em.depth||2.5;
const rad=(em.lightAngle||45)*Math.PI/180;
const dx=Math.cos(rad)*depth;
const dy=Math.sin(rad)*depth;

const hl=document.createElement('canvas');
hl.width=w;hl.height=h;
const hctx=hl.getContext('2d');
hctx.drawImage(targetCtx.canvas,0,0);
hctx.globalCompositeOperation='source-out';
hctx.drawImage(targetCtx.canvas,dx,dy);

const sh=document.createElement('canvas');
sh.width=w;sh.height=h;
const sctx=sh.getContext('2d');
sctx.drawImage(targetCtx.canvas,0,0);
sctx.globalCompositeOperation='source-out';
sctx.drawImage(targetCtx.canvas,-dx,-dy);

targetCtx.save();
targetCtx.globalCompositeOperation='source-atop';
targetCtx.globalAlpha=em.intensity!==undefined?em.intensity:0.85;
hctx.globalCompositeOperation='source-in';
hctx.fillStyle=em.highlightColor||'rgba(255,255,255,0.85)';
hctx.fillRect(0,0,w,h);
targetCtx.drawImage(hl,0,0);

sctx.globalCompositeOperation='source-in';
sctx.fillStyle=em.shadowColor||'rgba(0,0,0,0.85)';
sctx.fillRect(0,0,w,h);
targetCtx.drawImage(sh,0,0);
targetCtx.restore();
}

/* ========== FOKUS LENSA DSLR / TILT-SHIFT ENGINE ========== */
function renderTiltShiftDepthBlur(targetCtx,img,sx,sy,sw,sh,dw,dh,focusData){
const sharpCanvas=document.createElement('canvas');
sharpCanvas.width=dw;sharpCanvas.height=dh;
sharpCanvas.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,dw,dh);

const blurCanvas=document.createElement('canvas');
blurCanvas.width=dw;blurCanvas.height=dh;
const bctx=blurCanvas.getContext('2d');
bctx.filter=`blur(${focusData.blurAmount||14}px)`;
bctx.drawImage(img,sx,sy,sw,sh,0,0,dw,dh);

const maskCanvas=document.createElement('canvas');
maskCanvas.width=dw;maskCanvas.height=dh;
const mctx=maskCanvas.getContext('2d');

if(focusData.mode==='linear'){
const grad=mctx.createLinearGradient(0,0,0,dh);
const center=(focusData.centerY||50)/100;
const radius=(focusData.radius||30)/100;
grad.addColorStop(Math.max(0,center-radius),'rgba(0,0,0,1)');
grad.addColorStop(center,'rgba(0,0,0,0)');
grad.addColorStop(Math.min(1,center+radius),'rgba(0,0,0,1)');
mctx.fillStyle=grad;
mctx.fillRect(0,0,dw,dh);
}else if(focusData.mode==='vertical'){
const grad=mctx.createLinearGradient(0,0,dw,0);
const center=(focusData.centerX||50)/100;
const radius=(focusData.radius||30)/100;
grad.addColorStop(Math.max(0,center-radius),'rgba(0,0,0,1)');
grad.addColorStop(center,'rgba(0,0,0,0)');
grad.addColorStop(Math.min(1,center+radius),'rgba(0,0,0,1)');
mctx.fillStyle=grad;
mctx.fillRect(0,0,dw,dh);
}else{
const cx=dw*(focusData.centerX||50)/100;
const cy=dh*(focusData.centerY||50)/100;
const maxR=Math.max(dw,dh)*(focusData.radius||35)/100;
const grad=mctx.createRadialGradient(cx,cy,maxR*0.3,cx,cy,maxR);
grad.addColorStop(0,'rgba(0,0,0,0)');
grad.addColorStop(1,'rgba(0,0,0,1)');
mctx.fillStyle=grad;
mctx.fillRect(0,0,dw,dh);
}

targetCtx.drawImage(sharpCanvas,0,0);
bctx.globalCompositeOperation='destination-in';
bctx.drawImage(maskCanvas,0,0);
targetCtx.drawImage(blurCanvas,0,0);
}

function deselectElement(){activeElementId=null;editingElementId=null;selBox.classList.remove('active');hideSnapGuides();closeDirectCanvasTextEditor();renderBottomToolbar();closeToolPanel();}

function openDirectCanvasTextEditor(el){

isEditingText=true;

canvasDirectTextEditor.style.width=`${domW}px`;

if(el&&canvasDirectTextEditor.innerText!==undefined){
el.text=canvasDirectTextEditor.innerText;
}
editingElementId=null;
canvasDirectTextEditor.style.display='none';

}

/* ========== DRAG & RESIZE ENGINE ========== */
let dragMode=null;
let activeHandle=null;
let startPointer={x:0,y:0};
let startElementState={};
let rotateCenter={x:0,y:0};
let lastTapTime=0;
let lastTapId=null;

function setupDraggingEngine(){
artboard.addEventListener('pointerdown',handleArtboardPointerDown);
window.addEventListener('pointermove',handleWindowPointerMove);
window.addEventListener('pointerup',handleWindowPointerUp);
window.addEventListener('pointercancel',handleWindowPointerUp);

const stalkMove=document.getElementById('stalkMove');
const stalkRotate=document.getElementById('stalkRotate');
if(stalkMove){
stalkMove.addEventListener('pointerdown',(e)=>{
const el=getActiveElement();
if(!el||el.locked)return;
e.stopPropagation();
dragMode='stalk-move';
startPointer={x:e.clientX,y:e.clientY};
startElementState={x:el.x,y:el.y};
prepareGroupMove(el);
});
}
if(stalkRotate){
stalkRotate.addEventListener('pointerdown',(e)=>{
const el=getActiveElement();
if(!el||el.locked)return;
e.stopPropagation();
dragMode='stalk-rotate';
startPointer={x:e.clientX,y:e.clientY};
startElementState={rotation:el.rotation||0};
const rect=artboard.getBoundingClientRect();
rotateCenter={x:rect.left+(el.x*canvasScale*userZoomScale),y:rect.top+(el.y*canvasScale*userZoomScale)};
});
}
document.querySelectorAll('.sel-handle,.sel-handle-edge').forEach(h=>{
h.addEventListener('pointerdown',(e)=>{
const el=getActiveElement();
if(!el||el.locked)return;
e.stopPropagation();
dragMode='resize-handle';
activeHandle=e.target.dataset.handle;
startPointer={x:e.clientX,y:e.clientY};
startElementState={width:el.width||300,height:el.height||300,fontSize:el.fontSize||50,x:el.x,y:el.y};
});
});
}

function prepareGroupMove(hitEl){
if(hitEl&&hitEl.groupId){
const s=getCurrentSlide();
s.elements.forEach(other=>{
if(other.groupId===hitEl.groupId){other._startGroupPos={x:other.x,y:other.y};}
});
}
}

function handleArtboardPointerDown(e){
if(e.target.closest('#stalkContainer')||e.target.closest('.sel-handle')||e.target.closest('.sel-handle-edge'))return;
const rect=artboard.getBoundingClientRect();
const clickX=(e.clientX-rect.left)/(canvasScale*userZoomScale);
const clickY=(e.clientY-rect.top)/(canvasScale*userZoomScale);
const s=getCurrentSlide();
let hitEl=null;
for(let i=s.elements.length-1;i>=0;i--){
const el=s.elements[i];
if(isPointerInsideElement(clickX,clickY,el)){hitEl=el;break;}
}
if(hitEl){
const now=Date.now();
if(activeElementId===hitEl.id&&hitEl.type==='text'&&(now-lastTapTime<320)&&lastTapId===hitEl.id){
openDirectCanvasTextEditor(hitEl);
lastTapTime=0;
return;
}
lastTapTime=now;
lastTapId=hitEl.id;
selectElement(hitEl.id);
if(!hitEl.locked){
dragMode='move';
startPointer={x:e.clientX,y:e.clientY};
startElementState={x:hitEl.x,y:hitEl.y};
prepareGroupMove(hitEl);
}
}else{
deselectElement();
}
}

function isPointerInsideElement(px,py,el){
const halfW=((el.type==='text'?el.width:(el._renderedW||el.width))||200)/2;
const halfH=((el.type==='text'?el._calculatedHeight:(el._renderedH||el.height))||100)/2;
return(px>=el.x-halfW&&px<=el.x+halfW&&py>=el.y-halfH&&py<=el.y+halfH);
}

function handleWindowPointerMove(e){
if(!dragMode)return;
const el=getActiveElement();
if(!el||el.locked)return;
const currentCanvasScale=canvasScale*userZoomScale;
const deltaX=(e.clientX-startPointer.x)/currentCanvasScale;
const deltaY=(e.clientY-startPointer.y)/currentCanvasScale;

if(dragMode==='move'||dragMode==='stalk-move'){
let targetX=Math.round(startElementState.x+deltaX);
let targetY=Math.round(startElementState.y+deltaY);

const snapThreshold=12;
const W=mainCanvas.width;
const H=mainCanvas.height;
let snappedH=false;
let snappedV=false;

if(Math.abs(targetX-(W/2))<=snapThreshold){
targetX=W/2;
snapGuideV.style.left=`${(W/2)*canvasScale}px`;
snapGuideV.style.display='block';
snappedV=true;
}
if(Math.abs(targetY-(H/2))<=snapThreshold){
targetY=H/2;
snapGuideH.style.top=`${(H/2)*canvasScale}px`;
snapGuideH.style.display='block';
snappedH=true;
}
if(!snappedV)snapGuideV.style.display='none';
if(!snappedH)snapGuideH.style.display='none';

el.x=targetX;
el.y=targetY;

if(el.groupId){
const s=getCurrentSlide();
s.elements.forEach(other=>{
if(other.groupId===el.groupId&&other.id!==el.id&&other._startGroupPos){
other.x=Math.round(other._startGroupPos.x+deltaX);
other.y=Math.round(other._startGroupPos.y+deltaY);
}
});
}
requestRender();
}else if(dragMode==='stalk-rotate'){
const dx=e.clientX-rotateCenter.x;
const dy=e.clientY-rotateCenter.y;
let angle=Math.atan2(dy,dx)*(180/Math.PI)-90;
angle=Math.round(angle);
if(angle<0)angle+=360;
el.rotation=angle;
requestRender();
}else if(dragMode==='resize-handle'){
if(['br','bl','tr','tl'].includes(activeHandle)){
let factor=1+(deltaX/(startElementState.width||300));
if(activeHandle==='bl'||activeHandle==='tl')factor=1-(deltaX/(startElementState.width||300));
factor=Math.max(0.15,factor);
if(el.type==='text'){
el.fontSize=Math.round(startElementState.fontSize*factor);
el.width=Math.round(startElementState.width*factor);
}else if(el.type==='image'){
el.width=Math.round(startElementState.width*factor);
el.height=Math.round(startElementState.height*factor);
}
}else if(activeHandle==='r'||activeHandle==='l'){
const sign=activeHandle==='r'?1:-1;
el.width=Math.max(80,Math.round(startElementState.width+(deltaX*2*sign)));
}else if(activeHandle==='b'||activeHandle==='t'){
const sign=activeHandle==='b'?1:-1;
if(el.type==='image')el.height=Math.max(40,Math.round(startElementState.height+(deltaY*2*sign)));
}
requestRender();
}
}

function handleWindowPointerUp(){
hideSnapGuides();
if(dragMode){
dragMode=null;
const el=getActiveElement();
if(el){el.x=Math.round(el.x);el.y=Math.round(el.y);}
const s=getCurrentSlide();
s.elements.forEach(other=>delete other._startGroupPos);
pushHistoryState();
}
}

/* ========== CAROUSEL SLIDE ========== */
function renderCarouselThumbs(){
const container=document.getElementById('slideThumbList');
container.innerHTML='';
slides.forEach((slide,idx)=>{
const thumb=document.createElement('div');
thumb.className=`slide-thumb ${idx===currentSlideIndex?'active':''}`;
thumb.innerText=`${idx+1}`;
thumb.onclick=()=>switchSlide(idx);
container.appendChild(thumb);
});
}
function switchSlide(idx){
if(idx===currentSlideIndex)return;
deselectElement();
currentSlideIndex=idx;
renderCarouselThumbs();
renderAll();
pushHistoryState();
}
function addNewSlide(){
deselectElement();
slides.push(createDefaultSlide());
currentSlideIndex=slides.length-1;
renderCarouselThumbs();
renderAll();
pushHistoryState();
}
function duplicateCurrentSlide(){
deselectElement();
const curr=getCurrentSlide();
const serialized=serializeSlides([curr])[0];
slides.push(deserializeSlides([serialized])[0]);
currentSlideIndex=slides.length-1;
renderCarouselThumbs();
renderAll();
pushHistoryState();
}
function deleteCurrentSlide(){
if(slides.length<=1){alert('Minimal 1 slide');return;}
if(confirm(`Hapus Slide ${currentSlideIndex+1}?`)){
deselectElement();
slides.splice(currentSlideIndex,1);
if(currentSlideIndex>=slides.length)currentSlideIndex=slides.length-1;
renderCarouselThumbs();
renderAll();
pushHistoryState();
}
}

/* ========== PROJEK MODAL ========== */
function getProjectsList(){try{const raw=localStorage.getItem(PROJECTS_KEY);return raw?JSON.parse(raw):[];}catch(e){return[];}}
function saveProjectsList(list){try{localStorage.setItem(PROJECTS_KEY,JSON.stringify(list));}catch(e){}}
function openProjectModal(){saveCurrentProjectAuto();renderProjectList();document.getElementById('projectModal').classList.add('active');}
function closeProjectModal(){document.getElementById('projectModal').classList.remove('active');}
function saveCurrentProjectAuto(customName){
let list=getProjectsList();
let p=list.find(x=>x.id===currentProjectId);
let thumb='';
try{thumb=(mainCanvas&&typeof mainCanvas.toDataURL==='function')?mainCanvas.toDataURL('image/jpeg',0.3):'';}catch(e){}
if(!p){
p={id:currentProjectId||('proj_'+Date.now()),name:customName||('Projek '+(list.length+1)),ratio:currentRatio,slideCount:slides.length,thumb:thumb,slides:serializeSlides(slides),updatedAt:Date.now()};
list.unshift(p);
}else{
if(customName)p.name=customName;
p.ratio=currentRatio;p.slideCount=slides.length;p.thumb=thumb;p.slides=serializeSlides(slides);p.updatedAt=Date.now();
}
saveProjectsList(list);
}
function renderProjectList(){
const list=getProjectsList();
const c=document.getElementById('projectGridContainer');
if(!c)return;
c.innerHTML='';
list.forEach(p=>{
const card=document.createElement('div');
card.className=`project-card ${p.id===currentProjectId?'active':''}`;
card.innerHTML=`<img class="project-thumb" src="${p.thumb||''}" onerror="this.style.display='none'"><div class="project-title">${p.name}</div><div class="project-meta">${p.ratio||'4:5'}</div><div class="project-actions"><button class="btn-proj-action" onclick="loadProjectById('${p.id}')">Buka</button><button class="btn-proj-action" onclick="deleteProjectById('${p.id}')" style="color:#ff6b6b;">Hapus</button></div>`;
c.appendChild(card);
});
}
function createNewProjectPrompt(){
const name=prompt('Nama projek baru:','Projek '+(getProjectsList().length+1));
if(!name)return;
saveCurrentProjectAuto();
currentProjectId='proj_'+Date.now();
localStorage.setItem(CURRENT_PROJ_ID_KEY,currentProjectId);
slides=[createDefaultSlide()];
currentSlideIndex=0;
currentRatio='4:5';
adjustArtboardSize();
renderAll();renderCarouselThumbs();pushHistoryState();
saveCurrentProjectAuto(name);
closeProjectModal();
showToast('✅ Projek dibuat');
}
function saveAsNewProjectPrompt(){
const name=prompt('Nama salinan:','Salinan '+new Date().toLocaleTimeString());
if(!name)return;
currentProjectId='proj_'+Date.now();
saveCurrentProjectAuto(name);
renderProjectList();
showToast('✅ Projek disalin');
}
function loadProjectById(id){
saveCurrentProjectAuto();
const p=getProjectsList().find(x=>x.id===id);
if(!p)return;
currentProjectId=p.id;
localStorage.setItem(CURRENT_PROJ_ID_KEY,currentProjectId);
currentRatio=p.ratio||'4:5';
document.getElementById('currentRatioLabel').innerText=currentRatio;
slides=deserializeSlides(p.slides||[]);
currentSlideIndex=0;
adjustArtboardSize();renderAll();renderCarouselThumbs();renderBottomToolbar();pushHistoryState();closeProjectModal();showToast(`✅ Membuka: ${p.name}`);
}
function deleteProjectById(id){
let list=getProjectsList();
if(list.length<=1){alert('Minimal 1 projek');return;}
if(confirm('Hapus projek ini?')){
list=list.filter(x=>x.id!==id);
saveProjectsList(list);
if(currentProjectId===id)loadProjectById(list[0].id);
else renderProjectList();
showToast('🗑️ Projek dihapus');
}
}

/* ========== EXPORT ULTRA HD PRO ========== */
function exportPoster(){
deselectElement();
showToast('Menyiapkan gambar resolusi tinggi...');
const mult=parseFloat(document.getElementById('exportQualitySelect').value)||1.5;
const expC=document.createElement('canvas');
expC.width=mainCanvas.width*mult;
expC.height=mainCanvas.height*mult;
const ectx=expC.getContext('2d');
ectx.scale(mult,mult);
const s=getCurrentSlide();

renderBackground(s.background,mainCanvas.width,mainCanvas.height);
ectx.drawImage(mainCanvas,0,0);

setTimeout(()=>{
const a=document.createElement('a');
a.download=`poster-${currentRatio.replace(':','-')}-${Date.now()}.jpg`;
a.href=expC.toDataURL('image/jpeg',0.98);
a.click();
showToast('✅ Berhasil diunduh!');
},150);
}

window.onload=initApp;
</script>
