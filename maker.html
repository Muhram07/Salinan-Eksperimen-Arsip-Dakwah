function setupMagicGrabEvents(){
const canvas=document.getElementById('magicGrabCanvas');
const stalk=document.getElementById('magicGrabStalk');
const dragHandle=document.getElementById('grabDragHandle');
let isDraggingStalk=false;
let stalkOffset={x:0,y:0};

dragHandle.addEventListener('pointerdown',(e)=>{
isDraggingStalk=true;
dragHandle.setPointerCapture(e.pointerId);
const rect=stalk.getBoundingClientRect();
stalkOffset={x:e.clientX-rect.left,y:e.clientY-rect.top};
e.stopPropagation();
});

window.addEventListener('pointermove',(e)=>{
if(isDraggingStalk){
    const canvasRect=canvas.getBoundingClientRect();
    const stalkX = e.clientX - stalkOffset.x;
    const stalkY = e.clientY - stalkOffset.y;
    
    stalk.style.left = stalkX + 'px';
    stalk.style.top = stalkY + 'px';
    stalk.style.transform = 'none';
    
    if(grabPaintMode) {
        const brushX = stalkX - canvasRect.left + (stalk.offsetWidth/2);
        const brushY = stalkY - canvasRect.top - 20;
        paintGrabAtCoords(brushX, brushY);
    }
} else if(isPaintingGrab && grabPaintMode){
    const rect=canvas.getBoundingClientRect();
    paintGrabAtCoords(e.clientX-rect.left, e.clientY-rect.top);
}
});

window.addEventListener('pointerup',()=>{
isDraggingStalk=false;
isPaintingGrab=false;
document.getElementById('brushMonitor').style.display='none';
});

canvas.addEventListener('pointerdown',(e)=>{
if(!grabPaintMode) return;
isPaintingGrab=true;
const rect=canvas.getBoundingClientRect();
paintGrabAtCoords(e.clientX-rect.left, e.clientY-rect.top);
});
}

function paintGrabAtCoords(x, y){
const bSize=parseInt(document.getElementById('magicBrushSize').value||35);
const mctx=grabMaskCanvas.getContext('2d');
mctx.save();
mctx.beginPath();
mctx.arc(x,y,bSize/2,0,Math.PI*2);
mctx.fillStyle='#00ff88';
mctx.fill();
mctx.restore();

const mon=document.getElementById('brushMonitor');
mon.style.width=bSize+'px';
mon.style.height=bSize+'px';
mon.style.display='block';
const canvasRect = document.getElementById('magicGrabCanvas').getBoundingClientRect();
mon.style.left=(canvasRect.left + x)+'px';
mon.style.top=(canvasRect.top + y)+'px';

renderMagicGrabDisplay();
}

function setupMagicWandEvents(){
const canvas=document.getElementById('magicWandCanvas');
canvas.addEventListener('pointerdown',(e)=>{
if(wandMode === 'auto') return;
const rect=canvas.getBoundingClientRect();
const x=Math.round(e.clientX-rect.left);

const tol=parseInt(document.getElementById('wandTolerance').value||30);

if(wandMode === 'manual'){
    applyFloodFill(canvas.getContext('2d'), x, y, tol);
} else if(wandMode === 'global'){
    applyGlobalColorRemoval(canvas.getContext('2d'), x, y, tol);
}
});
}

function applyGlobalColorRemoval(ctx, startX, startY, tolerance) {
const w = ctx.canvas.width;
const h = ctx.canvas.height;
const imgData = ctx.getImageData(0, 0, w, h);
const data = imgData.data;
const startIndex = (startY * w + startX) * 4;
const sr = data[startIndex], sg = data[startIndex+1], sb = data[startIndex+2], sa = data[startIndex+3];

if(sa === 0) return;
const tolSq = (tolerance * 2.55) ** 2 * 3;

for(let i=0; i<data.length; i+=4){
    if(data[i+3] > 0){
        const distSq = (data[i]-sr)**2 + (data[i+1]-sg)**2 + (data[i+2]-sb)**2;
        if(distSq <= tolSq){
            data[i+3] = 0;
        }
    }
}
ctx.putImageData(imgData, 0, 0);
}

function applyFloodFill(ctx, startX, startY, tolerance) {
const w = ctx.canvas.width;
const h = ctx.canvas.height;
const imgData = ctx.getImageData(0, 0, w, h);
const data = imgData.data;
const startIndex = (startY * w + startX) * 4;
const sr = data[startIndex], sg = data[startIndex+1], sb = data[startIndex+2], sa = data[startIndex+3];

if(sa === 0) return;

const tolSq = (tolerance * 2.55) ** 2 * 3;
const pixelStack = [startX, startY];
const visited = new Uint8Array(w * h);

while(pixelStack.length > 0) {
    const y = pixelStack.pop();
    const x = pixelStack.pop();
    const idx = (y * w + x) * 4;
    
    data[idx+3] = 0;
    
    const neighbors = [[x+1, y], [x-1, y], [x, y+1], [x, y-1]];
    for(let i=0; i<neighbors.length; i++){
        const nx = neighbors[i][0];
        const ny = neighbors[i][1];
        if(nx >= 0 && nx < w && ny >= 0 && ny < h){
            const nIdx = ny * w + nx;
            if(!visited[nIdx]){
                const pIdx = nIdx * 4;
                if(data[pIdx+3] > 0){
                    const distSq = (data[pIdx]-sr)**2 + (data[pIdx+1]-sg)**2 + (data[pIdx+2]-sb)**2;
                    if(distSq <= tolSq){
                        visited[nIdx] = 1;
                        pixelStack.push(nx, ny);
                    }
                }
            }
        }
    }
}
ctx.putImageData(imgData, 0, 0);
}

    renderAll(); debouncedPushHistory();

function handleImageUpload(e){
const file=e.target.files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=(evt)=>{
const img=new Image();
img.onload=()=>{
const s=getCurrentSlide();
const maxInit=550;
let initW=img.width;
let initH=img.height;
if(initW>maxInit||initH>maxInit){
const ratio=Math.min(maxInit/initW,maxInit/initH);
initW*=ratio;
initH*=ratio;
}
const newEl={
id:'el_'+Date.now(),
type:'image',
img:img,
src:evt.target.result,
x:mainCanvas.width/2,
y:mainCanvas.height/2,
width:Math.round(initW),
height:Math.round(initH),
origWidth:img.width,
origHeight:img.height,
flipH:false,flipV:false,cornerRadius:0,borderWidth:0,borderColor:'#D4AF37',colorOverlay:'none',blur:0,blendMode:'normal',cropL:0,cropR:0,cropT:0,cropB:0,shadow:{color:'transparent',blur:0,angle:45,distance:0},opacity:1,locked:false,groupId:null
};
s.elements.push(newEl);
selectElement(newEl.id);
renderAll();
pushHistoryState();
};
img.src=evt.target.result;
};
reader.readAsDataURL(file);
e.target.value='';
}

/* ========== CAROUSEL SLIDE ========== */
function renderCarouselThumbs(){
const container=document.getElementById('slideThumbList');
container.innerHTML='';
slides.forEach((slide,idx)=>{
const thumb=document.createElement('div');
thumb.className=`slide-thumb ${idx===currentSlideIndex?'active':''}`;
thumb.innerText=`${idx+1}`;
thumb.onclick=()=>switchSlide(idx);
container.appendChild(thumb);
});
}
function switchSlide(idx){
if(idx===currentSlideIndex)return;
deselectElement();
currentSlideIndex=idx;
renderCarouselThumbs();
renderAll();
pushHistoryState();
}
function addNewSlide(){
deselectElement();
slides.push(createDefaultSlide());
currentSlideIndex=slides.length-1;
renderCarouselThumbs();
renderAll();
pushHistoryState();
}
function duplicateCurrentSlide(){
deselectElement();
const curr=getCurrentSlide();
const serialized=serializeSlides([curr])[0];
slides.push(deserializeSlides([serialized])[0]);
currentSlideIndex=slides.length-1;
renderCarouselThumbs();
renderAll();
pushHistoryState();
}
function deleteCurrentSlide(){
if(slides.length<=1){alert('Minimal 1 slide');return;}
if(confirm(`Hapus Slide ${currentSlideIndex+1}?`)){
deselectElement();
slides.splice(currentSlideIndex,1);
if(currentSlideIndex>=slides.length)currentSlideIndex=slides.length-1;
renderCarouselThumbs();
renderAll();
pushHistoryState();
}
}

async function openProjectModal(){

}

}

async function saveCurrentProjectAuto(customName){
if(customName) currentProjectName = customName;
const dataToSave={
    id: currentProjectId,
    name: currentProjectName,
    ratio: currentRatio,
    slideIndex: currentSlideIndex,
    slides: serializeSlides(slides),
    slideCount: slides.length,
    thumb: (mainCanvas && typeof mainCanvas.toDataURL==='function') ? mainCanvas.toDataURL('image/jpeg',0.2) : '',
    updatedAt: Date.now()
};
await saveProjectToDB(dataToSave);
}

async function renderProjectList(){
const list = await getAllProjectsMetaFromDB();
const c=document.getElementById('projectGridContainer');
if(!c)return;
c.innerHTML='';
list.forEach(p=>{
    const card=document.createElement('div');

    card.innerHTML=`<img class="project-thumb" src="${p.thumb||''}" onerror="this.style.display='none'"><div class="project-title">${p.name}</div><div class="project-meta">${p.ratio||'4:5'}</div><div class="project-actions"><button class="btn-proj-action" onclick="loadProjectById('${p.id}')">Buka</button><button class="btn-proj-action" onclick="deleteProjectById('${p.id}')" style="color:#ff6b6b;">Hapus</button></div>`;

});
}

async function saveAsNewProjectPrompt(){

if(!name)return;
currentProjectId='proj_'+Date.now();
currentProjectName=name;
await saveCurrentProjectAuto();
await renderProjectList();
showToast('✅ Projek disalin');
}

async function loadProjectById(id){
await saveCurrentProjectAuto();
const p = await getProjectFromDB(id);
if(!p)return;
currentProjectId=p.id;
currentProjectName=p.name;
localStorage.setItem(CURRENT_PROJ_ID_KEY,currentProjectId);
currentRatio=p.ratio||'4:5';
document.getElementById('currentRatioLabel').innerText=currentRatio;
slides=deserializeSlides(p.slides||[]);
currentSlideIndex=p.slideIndex||0;
adjustArtboardSize();renderAll();renderCarouselThumbs();renderBottomToolbar();pushHistoryState();closeProjectModal();showToast(`✅ Membuka: ${p.name}`);
}

async function deleteProjectById(id){
const list = await getAllProjectsMetaFromDB();
if(list.length<=1){alert('Minimal 1 projek');return;}
if(confirm('Hapus projek ini?')){
    await deleteProjectFromDB(id);
    if(currentProjectId===id){
        const newList = await getAllProjectsMetaFromDB();
        await loadProjectById(newList[0].id);
    } else {
        await renderProjectList();
    }
    showToast('🗑️ Projek dihapus');
}
}

/* ========== EXPORT ULTRA HD PRO ========== */
function exportPoster(){
deselectElement();
showToast('⏳ Menyiapkan gambar resolusi tinggi...');

// Pastikan semua gambar sudah termuat sebelum export
const s=getCurrentSlide();
let allLoaded = true;
if(s.background.img && !s.background.img.complete) allLoaded = false;
s.elements.forEach(el => {
    if(el.type === 'image' && el.img && !el.img.complete) allLoaded = false;
    if(el.textSkinImg && !el.textSkinImg.complete) allLoaded = false;
    if(el.imageSkinImg && !el.imageSkinImg.complete) allLoaded = false;
});

if(!allLoaded) {
    setTimeout(exportPoster, 500);
    return;
}

const mult=parseFloat(document.getElementById('exportQualitySelect').value)||3.0;
const expC=document.createElement('canvas');
expC.width=mainCanvas.width*mult;
expC.height=mainCanvas.height*mult;
const ectx=expC.getContext('2d');
ectx.scale(mult,mult);

// Render ulang semua elemen ke canvas resolusi tinggi
renderBackground(s.background,mainCanvas.width,mainCanvas.height,ectx);
s.elements.forEach(el=>{
    if(el.type==='text')renderTextElement(ectx,el);
    else if(el.type==='image')renderImageElement(ectx,el);
});
