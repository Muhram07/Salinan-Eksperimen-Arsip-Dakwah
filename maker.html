let dpadInterval = null;
let dpadTimeout = null;
function startDpadContinuous(dx, dy) {
    stopDpadContinuous();
    nudgeElement(dx, dy);
    dpadTimeout = setTimeout(() => {
        dpadInterval = setInterval(() => nudgeElement(dx, dy), 50);
    }, 200);
}
function stopDpadContinuous() {
    clearTimeout(dpadTimeout);
    clearInterval(dpadInterval);
}

function nudgeElement(dx, dy) {
    const el = getActiveElement();
    if (!el || el.locked) return;
    el.x = Math.round(el.x + dx);
    el.y = Math.round(el.y + dy);

    if (el.groupId) {
        const s = getCurrentSlide();
        s.elements.forEach(other => {
            if (other.groupId === el.groupId && other.id !== el.id) {
                other.x = Math.round(other.x + dx);
                other.y = Math.round(other.y + dy);
            }
        });
    }

    const lbl = document.getElementById('posCoordLabel');
    if (lbl) lbl.innerHTML = \`X: \${el.x}<br>Y: \${el.y}\`;
    requestRender();
    triggerAutoSave();
}

function setAlignPosition(pos) {
    const el = getActiveElement();
    if (!el || el.locked) return;

    const W = mainCanvas.width || 1080;
    const H = mainCanvas.height || 1350;
    const elW = el.width || 300;
    const elH = el._calculatedHeight || el.height || 100;
    const padX = 70;
    const padY = 90;

    switch (pos) {
        case 'top-left': el.x = padX + (elW / 2); el.y = padY + (elH / 2); break;
        case 'top': el.x = W / 2; el.y = padY + (elH / 2); break;
        case 'top-right': el.x = W - padX - (elW / 2); el.y = padY + (elH / 2); break;
        case 'left': el.x = padX + (elW / 2); el.y = H / 2; break;
        case 'center': el.x = W / 2; el.y = H / 2; break;
        case 'right': el.x = W - padX - (elW / 2); el.y = H / 2; break;
        case 'bottom-left': el.x = padX + (elW / 2); el.y = H - padY - (elH / 2); break;
        case 'bottom': el.x = W / 2; el.y = H - padY - (elH / 2); break;
        case 'bottom-right': el.x = W - padX - (elW / 2); el.y = H - padY - (elH / 2); break;
    }

    el.x = Math.round(el.x);
    el.y = Math.round(el.y);
    const lbl = document.getElementById('posCoordLabel');
    if (lbl) lbl.innerHTML = \`X: \${el.x}<br>Y: \${el.y}\`;
    requestRender();
    pushHistoryState();
}

function handleImageUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
            const s = getCurrentSlide();
            const maxInit = 550;
            let initW = img.width;
            let initH = img.height;
            if (initW > maxInit || initH > maxInit) {
                const ratio = Math.min(maxInit / initW, maxInit / initH);
                initW *= ratio;
                initH *= ratio;
            }

            const newEl = {
                id: 'el_' + Date.now(),
                type: 'image',
                img: img,
                src: evt.target.result,
                x: mainCanvas.width / 2,
                y: mainCanvas.height / 2,
                width: Math.round(initW),
                height: Math.round(initH),
                origWidth: img.width,
                origHeight: img.height,
                flipH: false,
                flipV: false,
                cornerRadius: 0,
                borderWidth: 0,
                borderColor: '#D4AF37',
                colorOverlay: 'none',
                blur: 0,
                blendMode: 'normal',
                crop: { t: 0, b: 0, l: 0, r: 0 },
                shadow: { color: 'transparent', blur: 0, angle: 45, distance: 0 },
                opacity: 1,
                locked: false,
                groupId: null
            };

            s.elements.push(newEl);
            selectElement(newEl.id);
            renderAll();
            pushHistoryState();
        };
        img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = '';
}

    el.locked = !el.locked;
    renderAll();
    renderBottomToolbar();
    pushHistoryState();
}

function toggleElementLockById(id) {
    const s = getCurrentSlide();
    const el = s.elements.find(e => e.id === id);
    if (el) { el.locked = !el.locked; renderAll(); renderBottomToolbar(); pushHistoryState(); }
}

function deleteActiveElement() {
    const el = getActiveElement();
    if (!el) return;
    deleteElementById(el.id);
}

function deleteElementById(id) {
    const s = getCurrentSlide();
    s.elements = s.elements.filter(e => e.id !== id);
    deselectElement();
    renderAll();
    pushHistoryState();
}

        // Initialize application on window load
        window.onload = initApp;
    </script>
