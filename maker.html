<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio Poster Maker - Canva & PixelLab Style</title>
    <!-- Font Lengkap Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Caveat:wght@700&family=Cinzel:wght@700;900&family=Montserrat:ital,wght@0,400;0,700;0,900;1,700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400;1,700&family=Scheherazade+New:wght@700&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;outline:none;}
        html,body{width:100%;height:100%;overflow:hidden;background:#0b0b0b;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;user-select:none;}

        /* TOP HEADER TOOLBAR */
        .top-navbar{
            height:50px;background:#141414;border-bottom:1px solid rgba(212,175,55,0.25);
            display:flex;align-items:center;justify-content:flex-start;padding:0 10px;gap:8px;z-index:200;position:relative;
            overflow-x:auto;overflow-y:hidden;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;
        }
        .top-navbar::-webkit-scrollbar{display:none;}
        .nav-left, .nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
        .btn-nav{
            background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#ddd;
            height:34px;padding:0 10px;border-radius:17px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;cursor:pointer;flex-shrink:0;
        }

        .btn-nav:hover{background:rgba(212,175,55,0.15);border-color:#D4AF37;color:#D4AF37;}
        .btn-nav.active{background:#D4AF37;color:#111;border-color:#D4AF37;}
        .btn-nav:disabled{opacity:0.35;cursor:not-allowed;}
        .btn-download{background:linear-gradient(135deg,#FFE259,#D4AF37);color:#111;border:none;box-shadow:0 2px 10px rgba(212,175,55,0.3);}

        /* AUTO SAVE STATUS */
        .save-indicator{font-size:10px;color:#888;display:flex;align-items:center;gap:4px;padding:0 4px;}
        .save-dot{width:7px;height:7px;border-radius:50%;background:#4CAF50;transition:0.3s;}
        .save-dot.syncing{background:#FFA000;animation:pulseSync 1s infinite;}
        @keyframes pulseSync{0%,100%{opacity:0.3;}50%{opacity:1;}}

        /* WORKSPACE AREA */
        .workspace-viewport{
            position:absolute;top:50px;bottom:120px;left:0;right:0;background:#060606;
            background-image:radial-gradient(rgba(255,255,255,0.06) 1px, transparent 0);background-size:20px 20px;
            display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;
        }

        /* ARTBOARD STAGE CONTAINER */
        .artboard-container{
            position:relative;box-shadow:0 15px 45px rgba(0,0,0,0.9), 0 0 0 1px rgba(212,175,55,0.3);
            border-radius:6px;overflow:visible;background:#181818;transform-origin:center center;touch-action:none;
        }
        #mainCanvas{display:block;width:100%;height:100%;border-radius:6px;touch-action:none;}

        /* BLEED & SAFETY MARGIN LINES (PATOKAN CETAK GARIS TRANSPARAN) */
        .bleed-guides{
            position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;display:none;z-index:90;
        }
        .bleed-guides.visible{display:block;}
        .guide-line-h{position:absolute;left:0;right:0;height:1px;border-top:1px dashed rgba(212,175,55,0.5);}
        .guide-line-v{position:absolute;top:0;bottom:0;width:1px;border-left:1px dashed rgba(212,175,55,0.5);}

        /* BOUNDING BOX SELECTION (SELEKSI ELEMEN ALA CANVA & PIXELLAB) */
        .selection-box{
            position:absolute;border:2px solid #D4AF37;pointer-events:none;display:none;z-index:99;box-shadow:0 0 12px rgba(212,175,55,0.4);
        }
        .selection-box.active{display:block;}
        .sel-handle{
            position:absolute;width:14px;height:14px;background:#fff;border:2px solid #D4AF37;border-radius:50%;
            pointer-events:auto;box-shadow:0 2px 6px rgba(0,0,0,0.6);
        }
        .sel-handle.tl{top:-7px;left:-7px;cursor:nwse-resize;}
        .sel-handle.tr{top:-7px;right:-7px;cursor:nesw-resize;}
        .sel-handle.bl{bottom:-7px;left:-7px;cursor:nesw-resize;}
        .sel-handle.br{bottom:-7px;right:-7px;cursor:nwse-resize;}
        /* Edge handles for width/height resize */
        .sel-handle-edge{position:absolute;background:#D4AF37;pointer-events:auto;border-radius:3px;}
        .sel-handle-edge.r{top:50%;right:-6px;transform:translateY(-50%);width:6px;height:24px;cursor:ew-resize;}
        .sel-handle-edge.l{top:50%;left:-6px;transform:translateY(-50%);width:6px;height:24px;cursor:ew-resize;}
        .sel-handle-edge.t{left:50%;top:-6px;transform:translateX(-50%);width:24px;height:6px;cursor:ns-resize;}
        .sel-handle-edge.b{left:50%;bottom:-6px;transform:translateX(-50%);width:24px;height:6px;cursor:ns-resize;}

        /* IN-PLACE DIRECT KEYBOARD INPUT (LANGSUNG KELUAR KEYBOARD DI SATU LAYAR) */
        #inlineTextInput{
            position:absolute;display:none;background:rgba(20,20,20,0.92);border:2px solid #D4AF37;color:#fff;
            padding:10px 12px;border-radius:10px;font-family:inherit;font-size:16px;z-index:150;resize:none;
            box-shadow:0 10px 30px rgba(0,0,0,0.9);line-height:1.4;
        }

        /* SLIDE CAROUSEL THUMBNAILS BAR (MINI BAR BAWAH) */
        .carousel-bar{
            position:absolute;bottom:62px;left:0;right:0;height:56px;background:rgba(18,18,18,0.95);
            border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;padding:0 10px;gap:8px;
            overflow-x:auto;z-index:180;scrollbar-width:none;
        }
        .carousel-bar::-webkit-scrollbar{display:none;}
        .slide-thumb{
            flex-shrink:0;width:38px;height:50px;background:#252525;border:2px solid transparent;border-radius:6px;
            overflow:hidden;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;
            font-size:10px;color:#aaa;font-weight:bold;
        }
        .slide-thumb.active{border-color:#D4AF37;box-shadow:0 0 8px rgba(212,175,55,0.4);color:#fff;}
        .slide-thumb canvas{width:100%;height:100%;object-fit:cover;}
        .btn-add-slide{
            flex-shrink:0;width:38px;height:50px;background:rgba(212,175,55,0.1);border:1px dashed #D4AF37;
            border-radius:6px;color:#D4AF37;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;
        }
        .btn-dup-slide{
            background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#bbb;
            height:32px;padding:0 8px;border-radius:8px;font-size:11px;font-weight:bold;white-space:nowrap;cursor:pointer;
        }

        /* BOTTOM TOOLBAR ALA CANVA (SCROLL HORIZONTAL & MODULAR) */
        .bottom-toolbar-container{
            position:absolute;bottom:0;left:0;right:0;height:62px;background:#141414;
            border-top:1px solid rgba(212,175,55,0.25);z-index:190;display:flex;align-items:center;padding:0 8px;
            overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;gap:6px;
        }
        .bottom-toolbar-container::-webkit-scrollbar{display:none;}
        .tool-btn{
            flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
            gap:3px;min-width:62px;height:54px;background:transparent;border:none;color:#aaa;
            font-size:10px;font-weight:700;border-radius:10px;cursor:pointer;transition:0.2s;
        }
        .tool-btn .icon{font-size:18px;line-height:1;}
        .tool-btn:hover, .tool-btn.active{background:rgba(212,175,55,0.15);color:#D4AF37;}

        /* POPUP TOOL DRAWER / PANEL PENGATURAN SPESIFIK */
        .tool-panel{
            position:absolute;bottom:62px;left:0;right:0;max-height:270px;background:#181818;
            border-top:1px solid rgba(212,175,55,0.3);border-radius:18px 18px 0 0;z-index:185;
            padding:14px 16px;box-shadow:0 -10px 30px rgba(0,0,0,0.8);display:none;flex-direction:column;
            overflow-y:auto;gap:12px;animation:slideUpPanel 0.25s cubic-bezier(0.16,1,0.3,1);
        }
        .tool-panel.active{display:flex;}
        @keyframes slideUpPanel{from{transform:translateY(100%);}to{transform:translateY(0);}}
        .panel-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.08);padding-bottom:8px;}
        .panel-title{font-size:13px;font-weight:800;color:#D4AF37;letter-spacing:0.5px;}
        .panel-close{background:none;border:none;color:#888;font-size:18px;cursor:pointer;}

        /* UI CONTROLS DALAM PANEL */
        .ctrl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
        .ctrl-label{font-size:11px;color:#bbb;font-weight:bold;min-width:70px;}
        .ctrl-slider{flex:1;accent-color:#D4AF37;cursor:pointer;}
        .ctrl-val{font-size:11px;color:#D4AF37;font-weight:bold;width:35px;text-align:right;}
        .ctrl-grid-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
        .btn-sub-tool{
            background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#ddd;
            padding:8px 4px;border-radius:8px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
        }
        .btn-sub-tool.active{background:#D4AF37;color:#111;border-color:#D4AF37;}
        .color-palette-scroll{display:flex;gap:8px;overflow-x:auto;padding:4px 0;}
        .color-circle{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);flex-shrink:0;cursor:pointer;}
        .color-circle.active{border-color:#D4AF37;transform:scale(1.2);}

        /* MODAL LAYER LIST ALA CANVA */
        .layer-list-container{display:flex;flex-direction:column;gap:6px;}
        .layer-item{
            display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,0.08);padding:8px 12px;border-radius:8px;font-size:12px;cursor:pointer;
        }
        .layer-item.active{border-color:#D4AF37;background:rgba(212,175,55,0.15);color:#D4AF37;font-weight:bold;}
        .layer-actions{display:flex;gap:6px;}
        .layer-btn{background:none;border:none;color:#aaa;cursor:pointer;font-size:14px;padding:2px 4px;}
        .layer-btn:hover{color:#fff;}
    
        /* FLOATING TEXT FORMATTING TOOLBAR DI ATAS KEYBOARD */
        .inline-text-toolbar{
            position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,0.95);
            border:1px solid #D4AF37;border-radius:24px;padding:4px 8px;display:none;align-items:center;gap:6px;z-index:260;
            box-shadow:0 8px 25px rgba(0,0,0,0.85);backdrop-filter:blur(10px);
        }
        .inline-text-toolbar.active{display:flex;}
        .btn-format-tag{
            background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;
            min-width:32px;height:32px;border-radius:16px;font-size:12px;font-weight:bold;cursor:pointer;
            display:flex;align-items:center;justify-content:center;
        }
        .btn-format-tag:hover{background:#D4AF37;color:#111;}
        .btn-format-done{
            background:linear-gradient(135deg,#FFE259,#D4AF37);color:#111;border:none;height:32px;
            padding:0 12px;border-radius:16px;font-size:12px;font-weight:700;cursor:pointer;
        }

        /* 3X3 POSISI PRESISI & DPAD JOYSTICK */
        .pos-grid-3x3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
        .btn-pos-cell{
            background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#ccc;
            padding:10px 4px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;text-align:center;
        }
        .btn-pos-cell:hover, .btn-pos-cell.active{border-color:#D4AF37;color:#D4AF37;background:rgba(212,175,55,0.15);}
        .dpad-container{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:6px;}
        .dpad-row{display:flex;align-items:center;gap:4px;}
        .dpad-btn{
            width:42px;height:38px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);
            color:#fff;border-radius:8px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;
        }
        .dpad-btn:hover{background:#D4AF37;color:#111;}
        .dpad-center{width:70px;height:38px;background:rgba(0,0,0,0.4);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#aaa;}

        .btn-del-slide{
            background:rgba(255,75,75,0.12);border:1px solid rgba(255,75,75,0.3);color:#ff6b6b;
            height:32px;padding:0 8px;border-radius:8px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px;cursor:pointer;flex-shrink:0;
        }
        .btn-del-slide:hover{background:#ff4b4b;color:#fff;}

    </style>
<script src="/_aistudio-iframe.js?v=2c34bde1"></script></head>
<body>
    <!-- 1. TOP HEADER TOOLBAR -->
    <header class="top-navbar">
        <div class="nav-left">
            <a href="index.html" class="btn-nav" title="Kembali ke Beranda">⬅️ Arsip</a>
            <button class="btn-nav" id="btnUndo" onclick="undo()" title="Undo (Kembali)" disabled>↩️</button>
            <button class="btn-nav" id="btnRedo" onclick="redo()" title="Redo (Maju)" disabled>↪️</button>
            <div class="save-indicator" title="Status Simpan Otomatis">
                <span class="save-dot" id="saveDot"></span>
                <span id="saveText">Tersimpan</span>
            </div>
        </div>

        <div class="nav-right">
            <!-- Pilihan Rasio Poster (Tanpa Merusak Posisi Elemen) -->
            <button class="btn-nav" id="btnRatio" onclick="toggleRatioSelector()" title="Ubah Ukuran Poster">
                📏 <span id="currentRatioLabel">9:16</span>
            </button>
            <button class="btn-nav" onclick="openPanelBleed()" title="Garis Bantu Cetak / Margin">
                📐 Garis Bantu
            </button>
            <button class="btn-nav btn-download" onclick="exportPoster()" title="Unduh Desain">
                💾 Simpan
            </button>
            <button class="btn-nav" onclick="copyFullSourceCode()" title="Salin Seluruh Kode maker.html untuk GitHub" style="border-color:#4CAF50;color:#81C784;">
                📋 Salin Kode
            </button>
            <button class="btn-nav" onclick="downloadSourceCodeFile()" title="Unduh File maker.html Utuh untuk GitHub" style="border-color:#2196F3;color:#64B5F6;">
                📥 Unduh HTML
            </button>
        </div>
    </header>

    <!-- 2. WORKSPACE CANVAS AREA -->
    <main class="workspace-viewport" id="workspaceViewport" onclick="handleViewportClick(event)">
        <div class="artboard-container" id="artboard">
            <!-- CANVAS HIGH RESOLUTION (1080 Width Base) -->
            <canvas id="mainCanvas"></canvas>

            <!-- BLEED & MARGIN GUIDES (GARIS PATOKAN POTONG & AMAN) -->
            <div class="bleed-guides" id="bleedGuides">
                <div class="guide-line-h" id="bleedLineTop" style="top:5%;"></div>
                <div class="guide-line-h" id="bleedLineBottom" style="bottom:5%;"></div>
                <div class="guide-line-v" id="bleedLineLeft" style="left:5%;"></div>
                <div class="guide-line-v" id="bleedLineRight" style="right:5%;"></div>
                <div class="guide-line-h" id="bleedLineMidH" style="top:50%;border-top-color:rgba(0,229,255,0.4);display:none;"></div>
                <div class="guide-line-v" id="bleedLineMidV" style="left:50%;border-left-color:rgba(0,229,255,0.4);display:none;"></div>
            </div>
            <!-- SELECTION BOUNDING BOX DENGAN HANDLE SUDUT & SISI -->
            <div class="selection-box" id="selBox">
                <!-- 4 Sudut Lancip (Resize Asli Proporsional Bebas Meleyot) -->
                <div class="sel-handle tl" data-handle="tl"></div>
                <div class="sel-handle tr" data-handle="tr"></div>
                <div class="sel-handle bl" data-handle="bl"></div>
                <div class="sel-handle br" data-handle="br"></div>
                <!-- 4 Handle Sisi Meluaskan Lebar / Tinggi -->
                <div class="sel-handle-edge r" data-handle="r"></div>
                <div class="sel-handle-edge l" data-handle="l"></div>
                <div class="sel-handle-edge t" data-handle="t"></div>
                <div class="sel-handle-edge b" data-handle="b"></div>
            </div>

            <!-- IN-PLACE DIRECT KEYBOARD INPUT (Ketik langsung di layar) -->
            <textarea id="inlineTextInput" spellcheck="false" placeholder="Ketik teks di sini (Enter untuk baris baru)..."></textarea>
        </div>
    </main>

    <!-- FLOATING TEXT FORMATTING TOOLBAR SAAT EDIT TEKS -->
    <div class="inline-text-toolbar" id="inlineTextToolbar">
        <button type="button" class="btn-format-tag" onpointerdown="event.preventDefault(); applyFormatToSelection('**', '**');" title="Tebal"><b>B</b></button>
        <button type="button" class="btn-format-tag" onpointerdown="event.preventDefault(); applyFormatToSelection('*', '*');" title="Miring"><i>I</i></button>
        <button type="button" class="btn-format-tag" onpointerdown="event.preventDefault(); applyFormatToSelection('__', '__');" title="Garis Bawah"><u>U</u></button>
        <button type="button" class="btn-format-tag" onpointerdown="event.preventDefault(); applyFormatToSelection('==', '==');" title="Stabilo">🖍️</button>
        <button type="button" class="btn-format-tag" onpointerdown="event.preventDefault(); toggleCaseSelection();" title="Kapitalisasi">aA</button>
        <button type="button" class="btn-format-done" onclick="closeInlineTextEditor()" title="Selesai">✅ Selesai</button>
    </div>
        </div>
    </main>

    <!-- 3. SLIDE CAROUSEL BAR (MINI THUMBNAIL BAWAH) -->
    <div class="carousel-bar" id="carouselBar">
        <div id="slideThumbList" style="display:flex;gap:8px;"></div>
        <button class="btn-add-slide" onclick="addNewSlide()" title="Tambah Slide Baru">+</button>
        <button class="btn-dup-slide" onclick="duplicateCurrentSlide()" title="Duplikat Gaya & Elemen Slide Ini">📑 Duplikat Slide</button>
        <button class="btn-del-slide" onclick="deleteCurrentSlide()" title="Hapus Slide Ini">🗑️ Hapus Slide</button>
    </div>

    <!-- 4. BOTTOM DYNAMIC TOOLBAR (ALA CANVA) -->
    <nav class="bottom-toolbar-container" id="bottomToolbar">
        <!-- Akan diisi otomatis sesuai elemen yang sedang dipilih (Teks / PNG / Canvas Kosong) -->
    </nav>

    <!-- 5. MODAL POPUP SUB-PANEL KONTROL SPESIFIK -->
    <div class="tool-panel" id="toolPanel">
        <div class="panel-header">
            <span class="panel-title" id="panelTitle">Pengaturan</span>
            <button class="panel-close" onclick="closeToolPanel()">&times;</button>
        </div>
        <div id="panelContent"></div>
    </div>

    <!-- FILE INPUT TRANSPARAN (UPLOAD GAMBAR/PNG) -->
    
    <!-- Hidden Input File untuk Unggah Foto/PNG, Skin & Background -->
    <input type="file" id="fileImageInput" accept="image/png,image/jpeg,image/webp" style="display:none;" onchange="handleImageUpload(event)">
    <input type="file" id="fileInputImage" accept="image/png,image/jpeg,image/webp" style="display:none;" onchange="handleImageUpload(event)">
    <input type="file" id="fileTextSkinInput" accept="image/png,image/jpeg,image/webp" style="display:none;" onchange="handleTextSkinUpload(event)">
    <input type="file" id="fileInputSkin" accept="image/png,image/jpeg,image/webp" style="display:none;" onchange="handleTextSkinUpload(event)">
    <input type="file" id="fileBgInput" accept="image/png,image/jpeg,image/webp" style="display:none;" onchange="handleBgUpload(event)">

    <input type="file" id="fileTextSkinInput" accept="image/*" style="display:none;" onchange="handleTextSkinUpload(event)">

    <script>
        /* =========================================================================
           STUDIO POSTER MAKER - ENGINE CORE & CACHE STORAGE
           ========================================================================= */
        const STORAGE_KEY = 'MAKER_STUDIO_CACHE_V2';
        const QUICK_COLORS = ['#FFFFFF', '#D4AF37', '#FFE259', '#E5E7EB', '#9CA3AF', '#000000', '#1F2937', '#EF4444', '#10B981', '#3B82F6', '#8B5CF6', '#EC4899', '#F59E0B', '#14B8A6', '#6366F1'];
        const RATIO_PRESETS = {
            '9:16': { width: 1080, height: 1920, label: '9:16 (Story/Reels)' },
            '4:5':  { width: 1080, height: 1350, label: '4:5 (Feed Portrait)' },
            '1:1':  { width: 1080, height: 1080, label: '1:1 (Feed Kotak)' }
        };

        const FONT_FAMILIES = [
            { name: 'Plus Jakarta Sans', font: "'Plus Jakarta Sans', sans-serif" },
            { name: 'Montserrat Bold', font: "'Montserrat', sans-serif" },
            { name: 'Playfair Serif', font: "'Playfair Display', serif" },
            { name: 'Caveat Handwrite', font: "'Caveat', cursive" },
            { name: 'Amiri Arabic / Tajdid', font: "'Amiri', serif" },
            { name: 'Cinzel Royal', font: "'Cinzel', serif" }
        ];

        let currentRatio = '9:16';
        let currentSlideIndex = 0;
        let slides = [];
        let activeElementId = null;
        let isEditingText = false;
        let bleedGuidesVisible = false;
        let bleedSettings = { margin: 5, mode: 'margin', color: '#D4AF37', opacity: 0.5 };
        let nudgeStep = 10;

        // Image Memory Cache (Mencegah PNG Hilang Saat Undo/Redo)
        const imageCache = new Map();
        function getImageFromCache(src) {
            if (!src) return null;
            if (imageCache.has(src)) return imageCache.get(src);
            const img = new Image();
            img.src = src;
            img.onload = () => requestRender();
            imageCache.set(src, img);
            return img;
        }

        // Canvas & Artboard DOM
        const mainCanvas = document.getElementById('mainCanvas');
        const ctx = mainCanvas.getContext('2d');
        const artboard = document.getElementById('artboard');
        const selBox = document.getElementById('selBox');
        const inlineTextInput = document.getElementById('inlineTextInput');
        const inlineTextToolbar = document.getElementById('inlineTextToolbar');

        // Auto Save Timer & Render Throttle
        let autoSaveTimer = null;
        let canvasScale = 1;
        let renderPending = false;

        function requestRender() {
            if (!renderPending) {
                renderPending = true;
                requestAnimationFrame(() => {
                    renderPending = false;
                    renderAll();
                });
            }
        }

        function serializeSlides(slidesList) {
            return slidesList.map(s => ({
                ...s,
                background: {
                    ...s.background,
                    imgSrc: s.background.img ? s.background.img.src : (s.background.imgSrc || null),
                    img: undefined
                },
                elements: s.elements.map(el => {
                    const copy = { ...el };
                    if (el.type === 'image') {
                        copy.imgSrc = el.src || (el.img ? el.img.src : copy.imgSrc);
                        delete copy.img;
                    }
                    if (el.textSkinImg) {
                        copy.textSkinSrc = el.textSkinSrc || el.textSkinImg.src;
                        delete copy.textSkinImg;
                    }
                    return copy;
                })
            }));
        }

        function deserializeSlides(rawSlides) {
            return rawSlides.map(s => {
                const bgSrc = s.background.imgSrc || (s.background.img && s.background.img.src);
                return {
                    ...s,
                    background: {
                        ...s.background,
                        imgSrc: bgSrc,
                        img: bgSrc ? getImageFromCache(bgSrc) : null
                    },
                    elements: s.elements.map(el => {
                        const copy = { ...el };
                        if (copy.type === 'image') {
                            const src = copy.imgSrc || copy.src;
                            copy.src = src;
                            copy.img = src ? getImageFromCache(src) : null;
                        }
                        if (copy.textSkinSrc) {
                            copy.textSkinImg = getImageFromCache(copy.textSkinSrc);
                        }
                        return copy;
                    })
                };
            });
        }

        function initApp() {
            loadFromStorage();
            if (!slides || slides.length === 0) {
                slides = [createDefaultSlide()];
                currentSlideIndex = 0;
            }
            adjustArtboardSize();
            pushHistoryState();
            renderAll();
            renderCarouselThumbs();
            renderBottomToolbar();

            window.addEventListener('resize', () => {
                adjustArtboardSize();

        function triggerAutoSave() {
            setSaveIndicator(false);
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                saveToStorage();
                setSaveIndicator(true);
            }, 800); // Simpan 800ms setelah interaksi terakhir
        }

        function setSaveIndicator(isSaved) {
            const dot = document.getElementById('saveDot');
            const txt = document.getElementById('saveText');
            if (isSaved) {
                dot.className = 'save-dot';
                txt.innerText = 'Tersimpan';
            } else {
                dot.className = 'save-dot syncing';
                txt.innerText = 'Menyimpan...';
            }
        }

        function saveToStorage() {
            try {
                const dataToSave = {
                    ratio: currentRatio,
                    slideIndex: currentSlideIndex,
                    slides: serializeSlides(slides)
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
            } catch (e) {
                console.warn("Storage penuh:", e);
            }
        }

        function loadFromStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (parsed.ratio && RATIO_PRESETS[parsed.ratio]) {
                    currentRatio = parsed.ratio;
                    document.getElementById('currentRatioLabel').innerText = currentRatio;
                }
                currentSlideIndex = parsed.slideIndex || 0;
                slides = deserializeSlides(parsed.slides || []);
            } catch (e) {
                console.error("Gagal load storage:", e);
            }
        }

        function pushHistoryState() {
            if (historyIndex < historyStack.length - 1) {
                historyStack = historyStack.slice(0, historyIndex + 1);
            }
            const state = JSON.stringify({
                ratio: currentRatio,
                currentSlideIndex,
                slides: serializeSlides(slides)
            });
            historyStack.push(state);
            if (historyStack.length > MAX_HISTORY) {
                historyStack.shift();
            }
            historyIndex = historyStack.length - 1;
            updateUndoRedoButtons();
            triggerAutoSave();
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                applyHistoryState(historyStack[historyIndex]);
            }
        }

        function redo() {
            if (historyIndex < historyStack.length - 1) {
                historyIndex++;
                applyHistoryState(historyStack[historyIndex]);
            }
        }

        function applyHistoryState(jsonStr) {
            const parsed = JSON.parse(jsonStr);
            currentRatio = parsed.ratio;
            currentSlideIndex = Math.min(parsed.currentSlideIndex, parsed.slides.length - 1);
            document.getElementById('currentRatioLabel').innerText = currentRatio;

            slides = deserializeSlides(parsed.slides);

            adjustArtboardSize();
            updateUndoRedoButtons();
            requestRender();
            renderCarouselThumbs();
            renderBottomToolbar();
            triggerAutoSave();
        }

        function updateUndoRedoButtons() {
            document.getElementById('btnUndo').disabled = (historyIndex <= 0);
            document.getElementById('btnRedo').disabled = (historyIndex >= historyStack.length - 1);
        }

        function adjustArtboardSize() {
            const preset = RATIO_PRESETS[currentRatio];
            const targetW = preset.width;
            const targetH = preset.height;

            mainCanvas.width = targetW;
            mainCanvas.height = targetH;

            // Hitung skala viewport agar pas di layar HP tanpa lag
            const vp = document.getElementById('workspaceViewport');
            const padding = 20;
            const availW = vp.clientWidth - padding;
            const availH = vp.clientHeight - padding;

            const scaleW = availW / targetW;
            const scaleH = availH / targetH;
            canvasScale = Math.min(scaleW, scaleH);

            artboard.style.width = `${targetW * canvasScale}px`;
            artboard.style.height = `${targetH * canvasScale}px`;

            updateSelectionBox();
        }

        function renderAll() {
            const s = getCurrentSlide();
            const W = mainCanvas.width;
            const H = mainCanvas.height;

            ctx.clearRect(0, 0, W, H);

            // 1. Gambar Background
            renderBackground(s.background, W, H);

            // 2. Gambar Elemen Berdasarkan Urutan Lapisan (Layer Index)
            s.elements.forEach(el => {
                ctx.save();
                ctx.globalAlpha = el.opacity !== undefined ? el.opacity : 1;

                if (el.type === 'text') {
                    renderTextElement(el);
                } else if (el.type === 'image') {
                    renderImageElement(el);
                }

                ctx.restore();
            });

            updateSelectionBox();
        }

        function renderBackground(bg, W, H) {
            if (bg.img && bg.img.complete) {
                ctx.save();
                if (bg.blur > 0) ctx.filter = `blur(${bg.blur * 2}px)`;
                const ratio = Math.max(W / bg.img.width, H / bg.img.height);
                const x = (W - bg.img.width * ratio) / 2;
                const y = (H - bg.img.height * ratio) / 2;
                ctx.drawImage(bg.img, x, y, bg.img.width * ratio, bg.img.height * ratio);
                ctx.restore();
            } else {
                const grad = ctx.createRadialGradient(W / 2, H * 0.35, 100, W / 2, H / 2, W);
                grad.addColorStop(0, bg.color1 || '#251c16');
                grad.addColorStop(1, bg.color2 || '#090807');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
            }

            if (bg.darken > 0) {
                ctx.fillStyle = `rgba(0,0,0,${bg.darken})`;
                ctx.fillRect(0, 0, W, H);
            }
        }

        
        function getWrappedLines(ctx, text, maxWidth) {
            if (!maxWidth || maxWidth <= 0) maxWidth = 700;
            const paragraphs = text.split('\n');
            const lines = [];

            for (const para of paragraphs) {
                if (!para) {
                    lines.push('');
                    continue;
                }
                const words = para.split(' ');
                let curLine = '';
                for (let i = 0; i < words.length; i++) {
                    const testLine = curLine ? curLine + ' ' + words[i] : words[i];
                    const cleanTest = testLine.replace(/(\*\*|\*|__|==)/g, '');
                    const metrics = ctx.measureText(cleanTest);
                    if (metrics.width > maxWidth && curLine) {
                        lines.push(curLine);
                        curLine = words[i];
                    } else {
                        curLine = testLine;
                    }
                }
                if (curLine) lines.push(curLine);
            }
            return lines;
        }

        function parseFormattedRuns(rawText) {
            const regex = /(\*\*.*?\*\*|\*[^*]+?\*|__.*?__|==.*?==)/g;
            const parts = rawText.split(regex);
            return parts.filter(p => p.length > 0).map(p => {
                let bold = false, italic = false, underline = false, highlight = false;
                let clean = p;
                if (clean.startsWith('**') && clean.endsWith('**') && clean.length >= 4) {
                    bold = true; clean = clean.slice(2, -2);
                } else if (clean.startsWith('*') && clean.endsWith('*') && clean.length >= 2) {
                    italic = true; clean = clean.slice(1, -1);
                } else if (clean.startsWith('__') && clean.endsWith('__') && clean.length >= 4) {
                    underline = true; clean = clean.slice(2, -2);
                } else if (clean.startsWith('==') && clean.endsWith('==') && clean.length >= 4) {
                    highlight = true; clean = clean.slice(2, -2);
                }
                return { text: clean, bold, italic, underline, highlight };
            });
        }

        function renderTextElement(el) {
            ctx.save();
            ctx.translate(el.x, el.y);

            if (el.rotation) ctx.rotate((el.rotation * Math.PI) / 180);
            if (el.italicSlant) {
                const rad = (el.italicSlant * Math.PI) / 180;
                ctx.transform(1, 0, Math.tan(rad), 1, 0, 0);
            }

            const fontSize = el.fontSize;
            const lineHeight = fontSize * (el.lineHeight || 1.3);
            const baseFont = `${el.fontStyle || 'normal'} ${el.fontWeight || 'normal'} ${fontSize}px "${el.fontFamily}"`;
            ctx.font = baseFont;
            ctx.textAlign = el.textAlign || 'center';
            ctx.textBaseline = 'middle';

            const maxBoxWidth = el.width || 750;
            const lines = getWrappedLines(ctx, el.text, maxBoxWidth);
            const totalHeight = lines.length * lineHeight;
            el._calculatedHeight = totalHeight;

            if (el.curveAngle && Math.abs(el.curveAngle) > 2 && lines.length === 1) {
                renderCurvedTextLine(el, lines[0], baseFont);
                ctx.restore();
                return;
            }

            let startY = -(totalHeight / 2) + (lineHeight / 2);

            lines.forEach((lineText, idx) => {
                let displayLine = lineText;
                if (el.textTransform === 'uppercase') displayLine = displayLine.toUpperCase();
                else if (el.textTransform === 'lowercase') displayLine = displayLine.toLowerCase();
                else if (el.textTransform === 'capitalize') {
                    displayLine = displayLine.replace(/\b\w/g, l => l.toUpperCase());
                }

                const lineY = startY + (idx * lineHeight);
                const runs = parseFormattedRuns(displayLine);

                let totalLineWidth = 0;
                runs.forEach(r => {
                    ctx.font = `${r.italic ? 'italic' : (el.fontStyle || 'normal')} ${r.bold ? '900' : (el.fontWeight || 'normal')} ${fontSize}px "${el.fontFamily}"`;
                    totalLineWidth += ctx.measureText(r.text).width;
                });

                let startX = -(totalLineWidth / 2);
                if (el.textAlign === 'left') startX = -(maxBoxWidth / 2);
                else if (el.textAlign === 'right') startX = (maxBoxWidth / 2) - totalLineWidth;

                if (el.highlightColor && el.highlightColor !== 'transparent') {
                    ctx.save();
                    ctx.fillStyle = el.highlightColor;
                    ctx.globalAlpha = (el.opacity || 1) * (el.highlightAlpha !== undefined ? el.highlightAlpha : 0.4);
                    ctx.beginPath();
                    ctx.roundRect(startX - 12, lineY - (lineHeight / 2) + 2, totalLineWidth + 24, lineHeight - 4, 8);
                    ctx.fill();
                    ctx.restore();
                }

                let curX = startX;
                runs.forEach(run => {
                    ctx.save();
                    ctx.font = `${run.italic ? 'italic' : (el.fontStyle || 'normal')} ${run.bold ? '900' : (el.fontWeight || 'normal')} ${fontSize}px "${el.fontFamily}"`;
                    ctx.textAlign = 'left';
                    const runMetrics = ctx.measureText(run.text);
                    const runW = runMetrics.width;

                    if (run.highlight) {
                        ctx.save();
                        ctx.fillStyle = el.highlightColor || '#FFE259';
                        ctx.globalAlpha = 0.5;
                        ctx.beginPath();
                        ctx.roundRect(curX - 4, lineY - (lineHeight / 2) + 4, runW + 8, lineHeight - 8, 4);
                        ctx.fill();
                        ctx.restore();
                    }

                    if (el.shadow && el.shadow.color && el.shadow.color !== 'transparent') {
                        ctx.shadowColor = el.shadow.color;
                        ctx.shadowBlur = el.shadow.blur || 0;
                        const rad = (el.shadow.angle || 45) * Math.PI / 180;
                        const dist = el.shadow.distance || 0;
                        ctx.shadowOffsetX = Math.cos(rad) * dist;
                        ctx.shadowOffsetY = Math.sin(rad) * dist;
                    }

                    if (el.textSkinImg && el.textSkinImg.complete) {
                        drawTextWithSkinImage(ctx, run.text, curX, lineY, el);
                    } else {
                        ctx.fillStyle = el.color || '#fff';
                        ctx.fillText(run.text, curX, lineY);

                        if (el.borderWidth && el.borderWidth > 0) {
                            ctx.lineWidth = el.borderWidth * 2;
                            ctx.strokeStyle = el.borderColor || '#D4AF37';
                            if (el.borderBlur) ctx.filter = `blur(${el.borderBlur}px)`;
                            ctx.strokeText(run.text, curX, lineY);
                        }
                    }

                    if (el.underline || run.underline) {
                        ctx.save();
                        ctx.strokeStyle = el.color || '#fff';
                        ctx.lineWidth = Math.max(2, fontSize * 0.06);
                        ctx.beginPath();
                        ctx.moveTo(curX, lineY + (fontSize * 0.45));
                        ctx.lineTo(curX + runW, lineY + (fontSize * 0.45));
                        ctx.stroke();
                        ctx.restore();
                    }

                    ctx.restore();
                    curX += runW;
                });
            });

            ctx.restore();
        }

        function renderCurvedTextLine(el, text, font) {
            const angleRad = (el.curveAngle * Math.PI) / 180;
            const len = text.length;
            const radius = Math.max(100, (el.width || 600) / Math.abs(angleRad));
            const arcDirection = el.curveAngle > 0 ? 1 : -1;

            ctx.save();
            ctx.font = font;
            ctx.fillStyle = el.color || '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const startAngle = -angleRad / 2;
            const stepAngle = angleRad / (len - 1 || 1);

            for (let i = 0; i < len; i++) {
                const ch = text[i];
                const curA = startAngle + (i * stepAngle);
                ctx.save();
                ctx.rotate(curA);
                ctx.translate(0, -arcDirection * radius);
                if (arcDirection < 0) ctx.rotate(Math.PI);
                ctx.fillText(ch, 0, 0);
                ctx.restore();
            }
            ctx.restore();
        }

        function drawTextWithSkinImage(targetCtx, text, x, y, el) {
            const offscreen = document.createElement('canvas');
            offscreen.width = mainCanvas.width;
            offscreen.height = mainCanvas.height;
            const octx = offscreen.getContext('2d');

            octx.font = targetCtx.font;
            octx.textAlign = 'left';
            octx.textBaseline = 'middle';
            octx.fillStyle = '#000';
            octx.fillText(text, x, y);

            octx.globalCompositeOperation = 'source-in';
            const skin = el.textSkinImg;
            const scale = el.textSkinScale || 1.0;
            const sw = skin.width * scale;
            const sh = skin.height * scale;
            const sx = x + (el.textSkinOffsetX || 0) - (sw / 4);
            const sy = y + (el.textSkinOffsetY || 0) - (sh / 4);
            octx.drawImage(skin, sx, sy, sw, sh);

            targetCtx.drawImage(offscreen, 0, 0);
        }

        
        function renderImageElement(el) {
            if (!el.img || !el.img.complete) {
                if (el.src || el.imgSrc) {
                    el.img = getImageFromCache(el.src || el.imgSrc);
                }
                if (!el.img || !el.img.complete) return;
            }

            const w = el.width || 300;
            const h = el.height || 300;

            ctx.save();
            ctx.translate(el.x, el.y);

            if (el.rotation) ctx.rotate((el.rotation * Math.PI) / 180);
            ctx.scale(el.flipH ? -1 : 1, el.flipV ? -1 : 1);

            if (el.shadow && el.shadow.color && el.shadow.color !== 'transparent') {
                ctx.shadowColor = el.shadow.color;
                ctx.shadowBlur = el.shadow.blur || 0;
                const rad = (el.shadow.angle || 45) * Math.PI / 180;
                const dist = el.shadow.distance || 0;
                ctx.shadowOffsetX = Math.cos(rad) * dist;
                ctx.shadowOffsetY = Math.sin(rad) * dist;
            }

            const radius = el.cornerRadius || 0;
            ctx.beginPath();
            ctx.roundRect(-w / 2, -h / 2, w, h, radius);
            ctx.clip();

            ctx.drawImage(el.img, -w / 2, -h / 2, w, h);

            if (el.borderWidth && el.borderWidth > 0 && el.borderColor) {
                ctx.lineWidth = el.borderWidth * 2;
                ctx.strokeStyle = el.borderColor;
                if (el.borderBlur) ctx.filter = `blur(${el.borderBlur}px)`;
                ctx.stroke();
            }

            ctx.restore();
        }

        function selectElement(elId) {
            activeElementId = elId;
            updateSelectionBox();
            renderBottomToolbar();
            closeToolPanel();
        }

        function deselectElement() {
            activeElementId = null;
            selBox.classList.remove('active');
            closeInlineTextEditor();
            renderBottomToolbar();
            closeToolPanel();
        }

        function updateSelectionBox() {
            const el = getActiveElement();
            if (!el || isEditingText) {
                selBox.classList.remove('active');
                return;
            }

            let boxW = el.width || 200;
            let boxH = el.height || 100;

            if (el.type === 'text') {
                boxH = el._calculatedHeight || (el.fontSize * 1.5);
            }

            // Konversi ke koordinat DOM artboard yang diskalakan
            const domW = boxW * canvasScale;
            const domH = boxH * canvasScale;
            const domX = (el.x * canvasScale) - (domW / 2);
            const domY = (el.y * canvasScale) - (domH / 2);

            selBox.style.width = `${domW}px`;
            selBox.style.height = `${domH}px`;
            selBox.style.left = `${domX}px`;
            selBox.style.top = `${domY}px`;
            selBox.classList.add('active');
        }

        function setupInlineTextEvents() {

            const domH = Math.max(120, ((el._calculatedHeight || 120) * canvasScale) + 40);
            const domX = Math.max(10, (el.x * canvasScale) - (domW / 2));
            const domY = Math.max(10, (el.y * canvasScale) - (domH / 2));

            inlineTextInput.style.width = `${domW}px`;

            setTimeout(() => {

        function showToast(msg) {
            const t = document.getElementById('toast');
            if (!t) return;

        function applyFormatTag(tag) {
            if (tag === 'b') applyFormatToSelection('**', '**');
            else if (tag === 'i') applyFormatToSelection('*', '*');
            else if (tag === 'u') applyFormatToSelection('__', '__');
            else if (tag === 'mark') applyFormatToSelection('==', '==');
        }

        function closeInlineTextEditor() {
            if (!isEditingText) return;
            isEditingText = false;
            inlineTextInput.style.display = 'none';
            inlineTextToolbar.classList.remove('active');
            requestRender();
            pushHistoryState();
        }

        function applyFormatToSelection(tagOpen, tagClose) {
            const start = inlineTextInput.selectionStart;
            const end = inlineTextInput.selectionEnd;
            const val = inlineTextInput.value;
            if (start === end) return;

            const selected = val.substring(start, end);
            const before = val.substring(0, start);
            const after = val.substring(end);
            inlineTextInput.value = before + tagOpen + selected + tagClose + after;
            inlineTextInput.selectionStart = start + tagOpen.length;
            inlineTextInput.selectionEnd = end + tagOpen.length;

            const el = getActiveElement();
            if (el) {
                el.text = inlineTextInput.value;
                requestRender();
            }
        }

        function toggleCaseSelection() {
            const start = inlineTextInput.selectionStart;
            const end = inlineTextInput.selectionEnd;
            const val = inlineTextInput.value;
            if (start === end) return;

            const selected = val.substring(start, end);
            const transformed = selected === selected.toUpperCase() ? selected.toLowerCase() : selected.toUpperCase();
            inlineTextInput.value = val.substring(0, start) + transformed + val.substring(end);
            inlineTextInput.selectionStart = start;
            inlineTextInput.selectionEnd = end;

            const el = getActiveElement();
            if (el) {
                el.text = inlineTextInput.value;
                requestRender();
            }
        }
        /* =========================================================================
           DRAGGING & RESIZE CORNER ENGINE (ANTI MELEYOT / BEBAS DISTORSI)
           ========================================================================= */
        let dragMode = null; // 'move', 'resize-handle'
        let activeHandle = null;
        let startPointer = { x: 0, y: 0 };
        let startElementState = {};

        function setupDraggingEngine() {
            artboard.addEventListener('pointerdown', handleArtboardPointerDown);
            window.addEventListener('pointermove', handleWindowPointerMove);
            window.addEventListener('pointerup', handleWindowPointerUp);
        }

        function handleViewportClick(e) {
            if (e.target.id === 'workspaceViewport') {
                deselectElement();
            }
        }

        function handleArtboardPointerDown(e) {
            // Cek jika klik pada handle resize
            if (e.target.classList.contains('sel-handle') || e.target.classList.contains('sel-handle-edge')) {
                dragMode = 'resize-handle';
                activeHandle = e.target.dataset.handle;
                startPointer = { x: e.clientX, y: e.clientY };
                const el = getActiveElement();
                startElementState = { ...el };
                e.stopPropagation();
                return;
            }

            // Koordinat Canvas
            const rect = artboard.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) / canvasScale;
            const clickY = (e.clientY - rect.top) / canvasScale;

            const s = getCurrentSlide();
            // Cari elemen dari lapisan paling atas ke bawah
            let hitEl = null;
            for (let i = s.elements.length - 1; i >= 0; i--) {
                const el = s.elements[i];
                if (isPointerInsideElement(clickX, clickY, el)) {
                    hitEl = el;
                    break;
                }
            }

            if (hitEl) {
                // Deteksi double tap / klik kedua untuk edit keyboard
                if (activeElementId === hitEl.id && hitEl.type === 'text') {
                    openInlineTextEditor(hitEl);
                    return;
                }

                selectElement(hitEl.id);
                if (!hitEl.locked) {
                    dragMode = 'move';
                    startPointer = { x: e.clientX, y: e.clientY };
                    startElementState = { x: hitEl.x, y: hitEl.y };
                }
            } else {
                deselectElement();
            }
        }

        function isPointerInsideElement(px, py, el) {
            const halfW = (el.width || 200) / 2;
            const halfH = (el._calculatedHeight || el.height || 100) / 2;
            return (px >= el.x - halfW && px <= el.x + halfW &&
                    py >= el.y - halfH && py <= el.y + halfH);
        }

        function handleWindowPointerMove(e) {
            if (!dragMode) return;
            const el = getActiveElement();
            if (!el || el.locked) return;

            const deltaX = (e.clientX - startPointer.x) / canvasScale;
            const deltaY = (e.clientY - startPointer.y) / canvasScale;

            if (dragMode === 'move') {
                el.x = startElementState.x + deltaX;
                el.y = startElementState.y + deltaY;

                if (el.groupId) {
                    const s = getCurrentSlide();
                    s.elements.forEach(other => {
                        if (other.groupId === el.groupId && other.id !== el.id) {
                            if (!other._startGroupPos) other._startGroupPos = { x: other.x, y: other.y };
                            other.x = other._startGroupPos.x + deltaX;
                            other.y = other._startGroupPos.y + deltaY;
                        }
                    });
                }
                requestRender();
            } else if (dragMode === 'resize-handle') {
                if (['br', 'bl', 'tr', 'tl'].includes(activeHandle)) {
                    let factor = 1 + (deltaX / (startElementState.width || 300));
                    if (activeHandle === 'bl' || activeHandle === 'tl') factor = 1 - (deltaX / (startElementState.width || 300));
                    factor = Math.max(0.2, factor);

                    if (el.type === 'text') {
                        el.fontSize = Math.round(startElementState.fontSize * factor);
                        el.width = Math.round(startElementState.width * factor);
                    } else if (el.type === 'image') {
                        el.width = Math.round(startElementState.width * factor);
                        el.height = Math.round(startElementState.height * factor);
                    }
                } else if (activeHandle === 'r' || activeHandle === 'l') {
                    const sign = activeHandle === 'r' ? 1 : -1;
                    el.width = Math.max(120, Math.round(startElementState.width + (deltaX * 2 * sign)));
                } else if (activeHandle === 'b' || activeHandle === 't') {
                    const sign = activeHandle === 'b' ? 1 : -1;
                    if (el.type === 'image') {
                        el.height = Math.max(40, Math.round(startElementState.height + (deltaY * 2 * sign)));
                    }
                }
                requestRender();
            }
        }

        function handleWindowPointerUp() {
            if (dragMode) {
                dragMode = null;
                const el = getActiveElement();
                if (el) {
                    el.x = Math.round(el.x);
                    el.y = Math.round(el.y);
                }
                const s = getCurrentSlide();
                s.elements.forEach(other => delete other._startGroupPos);
                pushHistoryState();
            }
        }

        function setAlignPosition(pos) {
            const el = getActiveElement();
            if (!el || el.locked) return;
            const W = mainCanvas.width;
            const H = mainCanvas.height;
            const elW = el.type === 'text' ? (el.width || 750) : (el.width || 300);
            const elH = el.type === 'text' ? (el._calculatedHeight || 120) : (el.height || 300);
            const pad = 60;

            switch (pos) {
                case 'top-left': el.x = pad + (elW / 2); el.y = pad + (elH / 2); break;
                case 'top': el.x = W / 2; el.y = pad + (elH / 2); break;
                case 'top-right': el.x = W - pad - (elW / 2); el.y = pad + (elH / 2); break;
                case 'left': el.x = pad + (elW / 2); el.y = H / 2; break;
                case 'center': el.x = W / 2; el.y = H / 2; break;
                case 'right': el.x = W - pad - (elW / 2); el.y = H / 2; break;
                case 'bottom-left': el.x = pad + (elW / 2); el.y = H - pad - (elH / 2); break;
                case 'bottom': el.x = W / 2; el.y = H - pad - (elH / 2); break;
                case 'bottom-right': el.x = W - pad - (elW / 2); el.y = H - pad - (elH / 2); break;
            }

            requestRender();
            pushHistoryState();
            openPanelPosition();
        }

                s.elements.push(el);

            const s = getCurrentSlide();
            const idx = s.elements.findIndex(e => e.id === activeElementId);

            const s = getCurrentSlide();

                s.elements[idx] = s.elements[idx + 1];
                s.elements[idx + 1] = el;
                renderAll(); pushHistoryState();
            }

            const s = getCurrentSlide();
            const idx = s.elements.findIndex(e => e.id === activeElementId);

                s.elements[idx] = s.elements[idx - 1];

        function openPanelLayers() {
            const s = getCurrentSlide();
            let html = '<div class="layer-list-container">';
            // Tampilkan dari lapisan teratas ke terbawah
            for (let i = s.elements.length - 1; i >= 0; i--) {
                const el = s.elements[i];
                const isAct = el.id === activeElementId;
                const name = el.type === 'text' ? (el.text.substring(0, 24) || 'Teks') : 'Foto / PNG';
                html += `
                    <div class="layer-item ${isAct ? 'active' : ''}" onclick="selectElement('${el.id}'); openPanelLayers();">
                        <span>${el.type === 'text' ? '📝' : '🖼️'} ${name}</span>
                        <div class="layer-actions">
                            <button class="layer-btn" onclick="event.stopPropagation(); toggleElementLockById('${el.id}')">${el.locked ? '🔒' : '🔓'}</button>
                            <button class="layer-btn" onclick="event.stopPropagation(); deleteElementById('${el.id}')">🗑️</button>
                        </div>
                    </div>
                `;
            }
            html += '</div>';
            openToolPanel('Daftar Lapisan Layer', html);
        }

        // 10. TOOL GAMBAR / PNG SPESIFIK (CERMIN, BORDER, BAYANGAN, TRANSPARANSI)
        function openPanelImageFlip() {
            const el = getActiveElement();
            const html = `
                <div class="ctrl-grid-btns">
                    <button class="btn-sub-tool ${el.flipH ? 'active' : ''}" onclick="toggleFlip('H')">↔️ Cermin Kiri-Kanan</button>
                    <button class="btn-sub-tool ${el.flipV ? 'active' : ''}" onclick="toggleFlip('V')">↕️ Balik Atas-Bawah</button>
                </div>
            `;
            openToolPanel('Cermin Gambar', html);
        }
        function toggleFlip(dir) {
            const el = getActiveElement();
            if (dir === 'H') el.flipH = !el.flipH;
            if (dir === 'V') el.flipV = !el.flipV;
            renderAll(); pushHistoryState(); openPanelImageFlip();
        }

        function openPanelImageBorder() {
            const el = getActiveElement();
            let html = `
                <div class="ctrl-row">
                    <span class="ctrl-label">Kelengkungan Sudut:</span>
                    <input type="range" class="ctrl-slider" min="0" max="150" value="${el.cornerRadius || 0}" oninput="updateCornerRadius(this.value)">
                    <span class="ctrl-val" id="valRadius">${el.cornerRadius || 0}px</span>
                </div>
                <div class="ctrl-row" style="margin-top:8px;">
                    <span class="ctrl-label">Tebal Garis Tepi:</span>
                    <input type="range" class="ctrl-slider" min="0" max="30" value="${el.borderWidth || 0}" oninput="updateBorderWidth(this.value)">
                    <span class="ctrl-val" id="valBorderW">${el.borderWidth || 0}px</span>
                </div>
                <span class="ctrl-label" style="margin-top:6px;display:block;">Warna Garis Tepi:</span>
                <div class="color-palette-scroll">
            `;
            QUICK_COLORS.forEach(c => {
                html += `<div class="color-circle ${el.borderColor === c ? 'active' : ''}" style="background:${c};" onclick="setBorderColor('${c}')"></div>`;
            });
            html += '</div>';
            openToolPanel('Garis Tepi & Sudut', html);
        }
        function updateCornerRadius(v) {
            const el = getActiveElement();
            el.cornerRadius = parseInt(v);
            document.getElementById('valRadius').innerText = v + 'px';
            renderAll(); triggerAutoSave();
        }
        function updateBorderWidth(v) {
            const el = getActiveElement();
            el.borderWidth = parseInt(v);
            if (!el.borderColor) el.borderColor = '#D4AF37';
            document.getElementById('valBorderW').innerText = v + 'px';
            renderAll(); triggerAutoSave();
        }
        function setBorderColor(c) {
            const el = getActiveElement();
            el.borderColor = c;
            renderAll(); pushHistoryState(); openPanelImageBorder();
        }

        function openPanelImageShadow() {
            const el = getActiveElement();
            if (!el.shadow) el.shadow = { color: 'rgba(0,0,0,0.8)', blur: 15, angle: 45, distance: 8 };
            let html = `
                <div class="ctrl-row">
                    <span class="ctrl-label">Keburaman (Blur):</span>
                    <input type="range" class="ctrl-slider" min="0" max="50" value="${el.shadow.blur || 0}" oninput="updateShadowBlur(this.value)">
                    <span class="ctrl-val" id="valShadowB">${el.shadow.blur || 0}</span>
                </div>
                <div class="ctrl-row" style="margin-top:6px;">
                    <span class="ctrl-label">Jarak / Sudut:</span>
                    <input type="range" class="ctrl-slider" min="0" max="50" value="${el.shadow.distance || 0}" oninput="updateShadowDistance(this.value)">
                    <span class="ctrl-val" id="valShadowD">${el.shadow.distance || 0}</span>
                </div>
                <span class="ctrl-label" style="margin-top:6px;display:block;">Warna Bayangan:</span>
                <div class="color-palette-scroll">
                    <div class="color-circle ${el.shadow.color === 'transparent' ? 'active' : ''}" style="background:#444;" title="Tanpa Bayangan" onclick="setShadowColor('transparent')"></div>
                    <div class="color-circle ${el.shadow.color === 'rgba(0,0,0,0.85)' ? 'active' : ''}" style="background:#000;" onclick="setShadowColor('rgba(0,0,0,0.85)')"></div>
                    <div class="color-circle ${el.shadow.color === 'rgba(212,175,55,0.7)' ? 'active' : ''}" style="background:#D4AF37;" onclick="setShadowColor('rgba(212,175,55,0.7)')"></div>
                    <div class="color-circle ${el.shadow.color === 'rgba(255,255,255,0.7)' ? 'active' : ''}" style="background:#fff;" onclick="setShadowColor('rgba(255,255,255,0.7)')"></div>
                </div>
            `;
            openToolPanel('Pengaturan Bayangan', html);
        }
        function updateShadowBlur(v) {
            const el = getActiveElement();
            el.shadow.blur = parseInt(v);
            document.getElementById('valShadowB').innerText = v;
            renderAll(); triggerAutoSave();
        }
        function updateShadowDistance(v) {
            const el = getActiveElement();
            el.shadow.distance = parseInt(v);
            document.getElementById('valShadowD').innerText = v;
            renderAll(); triggerAutoSave();
        }
        function setShadowColor(c) {
            const el = getActiveElement();
            el.shadow.color = c;
            renderAll(); pushHistoryState(); openPanelImageShadow();
        }

        function openPanelImageOpacity() {
            const el = getActiveElement();
            const html = `
                <div class="ctrl-row">
                    <span class="ctrl-label">Transparansi:</span>
                    <input type="range" class="ctrl-slider" min="10" max="100" value="${Math.round((el.opacity !== undefined ? el.opacity : 1) * 100)}" oninput="updateOpacity(this.value)">
                    <span class="ctrl-val" id="valOpacity">${Math.round((el.opacity !== undefined ? el.opacity : 1) * 100)}%</span>
                </div>
            `;
            openToolPanel('Tingkat Transparansi', html);
        }
        function updateOpacity(v) {
            const el = getActiveElement();
            el.opacity = parseInt(v) / 100;
            document.getElementById('valOpacity').innerText = v + '%';
            renderAll(); triggerAutoSave();
        }

        // 11. TAMBAH ELEMEN BARU
        function addNewText() {
            const s = getCurrentSlide();
            const newEl = {
                id: 'el_' + Date.now(),
                type: 'text',
                text: 'Ketik Teks Baru\nDi Sini',
                x: mainCanvas.width / 2,
                y: mainCanvas.height / 2,
                width: 600,
                fontFamily: "'Plus Jakarta Sans', sans-serif",
                fontSize: 50,
                fontWeight: 'bold',
                fontStyle: 'normal',
                textDecoration: 'none',
                textAlign: 'center',
                textTransform: 'none',
                color: '#FFFFFF',
                lineHeight: 1.3,
                letterSpacing: 0,
                highlightColor: 'transparent',
                highlightAlpha: 0.5,
                opacity: 1,
                rotation: 0,
                locked: false,
                groupId: null,
                shadow: { color: 'rgba(0,0,0,0.8)', blur: 10, angle: 45, distance: 4 }
            };
            s.elements.push(newEl);
            selectElement(newEl.id);
            renderAll();
            pushHistoryState();
            openInlineTextEditor(newEl);
        }

        function triggerImageUpload() {
            document.getElementById('fileImageInput').click();
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const s = getCurrentSlide();
                    // Batasi ukuran awal max 600px proporsional
                    const maxInit = 600;
                    let initW = img.width;
                    let initH = img.height;
                    if (initW > maxInit || initH > maxInit) {
                        const ratio = Math.min(maxInit / initW, maxInit / initH);
                        initW *= ratio;
                        initH *= ratio;
                    }

                    const newEl = {
                        id: 'el_' + Date.now(),
                        type: 'image',
                        img: img,
                        x: mainCanvas.width / 2,
                        y: mainCanvas.height / 2,
                        width: Math.round(initW),
                        height: Math.round(initH),
                        origWidth: img.width,
                        origHeight: img.height,
                        flipH: false,
                        flipV: false,
                        cornerRadius: 0,
                        borderWidth: 0,
                        borderColor: '#D4AF37',
                        shadow: { color: 'transparent', blur: 0, angle: 45, distance: 0 },
                        opacity: 1,
                        locked: false,
                        groupId: null
                    };

                    s.elements.push(newEl);
                    selectElement(newEl.id);
                    renderAll();
                    pushHistoryState();
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
            e.target.value = ''; // Reset input
        }

        function duplicateActiveElement() {
            const el = getActiveElement();
            if (!el) return;
            const s = getCurrentSlide();
            const copy = JSON.parse(JSON.stringify(el));
            copy.id = 'el_' + Date.now();
            copy.x += 40;
            copy.y += 40;
            if (el.type === 'image' && el.img) copy.img = el.img;

            s.elements.push(copy);
            selectElement(copy.id);
            renderAll();
            pushHistoryState();
        }

        function toggleElementLock() {
            const el = getActiveElement();
            if (!el) return;
            el.locked = !el.locked;
            renderAll();
            renderBottomToolbar();
            pushHistoryState();
        }

        function toggleElementLockById(id) {
            const s = getCurrentSlide();
            const el = s.elements.find(e => e.id === id);
            if (el) { el.locked = !el.locked; renderAll(); renderBottomToolbar(); pushHistoryState(); }
        }

        function deleteActiveElement() {
            const el = getActiveElement();
            if (!el) return;
            deleteElementById(el.id);
        }

        function deleteElementById(id) {
            const s = getCurrentSlide();
            s.elements = s.elements.filter(e => e.id !== id);
            deselectElement();
            renderAll();
            pushHistoryState();
        }

        function toggleGroupElement() {
            const el = getActiveElement();
            if (!el) return;
            if (el.groupId) {
                // Pisahkan dari grup
                el.groupId = null;
            } else {
                // Hubungkan dengan elemen lain terdekat
                el.groupId = 'grp_' + Date.now();
                const s = getCurrentSlide();
                const neighbor = s.elements.find(e => e.id !== el.id && !e.groupId);
                if (neighbor) neighbor.groupId = el.groupId;
            }
            renderBottomToolbar();
            pushHistoryState();
        }

        /* =========================================================================
           SLIDE CAROUSEL ENGINE (DUPLIKAT GAYA & ELEMEN KE SLIDE LAIN)
           ========================================================================= */
        function renderCarouselThumbs() {
            const container = document.getElementById('slideThumbList');
            container.innerHTML = '';

            slides.forEach((slide, idx) => {
                const thumb = document.createElement('div');
                thumb.className = `slide-thumb ${idx === currentSlideIndex ? 'active' : ''}`;
                thumb.innerText = `${idx + 1}`;
                thumb.onclick = () => switchSlide(idx);
                container.appendChild(thumb);
            });
        }

        function switchSlide(idx) {
            if (idx === currentSlideIndex) return;
            deselectElement();
            currentSlideIndex = idx;
            renderCarouselThumbs();
            renderAll();
            pushHistoryState();
        }

        function addNewSlide() {
            deselectElement();
            slides.push(createDefaultSlide());
            currentSlideIndex = slides.length - 1;
            renderCarouselThumbs();
            renderAll();
            pushHistoryState();
        }

        function duplicateCurrentSlide() {
            deselectElement();
            const curr = getCurrentSlide();
            const serialized = serializeSlides([curr])[0];
            const deserialized = deserializeSlides([serialized])[0];
            slides.push(deserialized);
            currentSlideIndex = slides.length - 1;
            renderCarouselThumbs();
            requestRender();
            pushHistoryState();
        }

        
        function deleteCurrentSlide() {
            if (slides.length <= 1) {
                alert('Minimal harus ada 1 slide poster');
                return;
            }
            if (confirm(`Hapus Slide ${currentSlideIndex + 1}?`)) {
                deselectElement();
                slides.splice(currentSlideIndex, 1);
                if (currentSlideIndex >= slides.length) {
                    currentSlideIndex = slides.length - 1;
                }
                renderCarouselThumbs();
                requestRender();
                pushHistoryState();
            }
        }


        function exportPoster() {
            deselectElement();
            renderAll();

            setTimeout(() => {
                const link = document.createElement('a');
                link.download = `poster-dakwah-slide-${currentSlideIndex + 1}-${Date.now()}.jpg`;
                link.href = mainCanvas.toDataURL('image/jpeg', 0.98);
                link.click();
            }, 100);
        }

        // Jalankan saat pertama kali halaman terbuka
        window.onload = initApp;

        // Fitur Salin & Unduh Kode Sumber maker.html untuk GitHub
        function copyFullSourceCode() {
            fetch('/maker.html?t=' + Date.now())
                .then(res => res.text())
                .then(text => {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast('✅ Berhasil menyalin 100% kode maker.html ke clipboard! Siap dipaste ke GitHub.');
                    }).catch(() => {
                        downloadSourceCodeFile();
                    });
                }).catch(err => {
                    showToast('Gagal memuat kode: ' + err);
                });
        }

        function downloadSourceCodeFile() {
            fetch('/maker.html?t=' + Date.now())
                .then(res => res.text())
                .then(text => {
                    const blob = new Blob([text], {type: 'text/html'});
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'maker.html';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    showToast('📥 File maker.html berhasil diunduh utuh!');
                });
        }

    </script>
