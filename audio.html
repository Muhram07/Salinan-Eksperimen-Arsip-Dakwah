<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suara Alam - Arsip Dakwah</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0b0b0b;color:#fff;font-family:Arial, sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;}
        .container{text-align:center;max-width:500px;padding:40px 20px;background:#1a1a1a;border-radius:20px;border:1px solid #333;}
        h1{color:#FFD700;font-size:24px;font-weight:bold;margin-bottom:10px;}
        p{color:#bdbdbd;font-size:14px;margin-bottom:20px;line-height:1.6;}
        .audio-wrapper{background:#0d1117;padding:15px;border-radius:15px;border:1px solid #30363d;margin:10px 0;}
        audio{width:100%;outline:none;}
        .btn-back{display:inline-block;margin-top:15px;padding:10px 30px;background:#FFD700;color:#111;text-decoration:none;border-radius:25px;font-weight:bold;font-size:14px;transition:0.3s;}
        .btn-back:hover{transform:scale(1.02);}

        /* Petunjuk kecil agar pengguna tahu harus scroll */
        .hint{color:#777;font-size:12px;margin-bottom:15px;animation:blink 2s infinite;}
        @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.2;}}
    </style>
</head>
<body>

    <div class="container">
        <h1>🌊 Suara Alam</h1>
        <p class="hint">⬇️ Geser layar atau ketuk di mana saja untuk memutar suara ⬇️</p>
        <p>Backsound relaksasi untuk menemani bacaan Anda.</p>

        <div class="audio-wrapper">
            <audio id="audioPlayer" controls loop>
                <source src="suara-ombak.mp3" type="audio/mpeg">
                Browser Anda tidak mendukung tag audio.
            </audio>
        </div>

        <a href="index.html" class="btn-back">⬅ Kembali ke Arsip Dakwah</a>
    </div>

    <script>
        const audio = document.getElementById('audioPlayer');
        let sudahMenyala = false;

        function nyalakanSuara() {
            if (sudahMenyala) return; // Jangan nyalakan dua kali
            sudahMenyala = true;

            audio.volume = 0.8; // Volume 80%
            audio.play().catch(() => {
                // Jika gagal, coba lagi
                setTimeout(nyalakanSuara, 500);
            });
            
            // Hapus animasi kedip setelah suara menyala
            document.querySelector('.hint').style.display = 'none';
        }

        // 1. Nyalakan saat pengguna menyentuh layar (Tap)
        document.addEventListener('touchstart', nyalakanSuara, { once: true });
        document.addEventListener('click', nyalakanSuara, { once: true });

        // 2. Nyalakan saat pengguna menggulir layar (Scroll)
        document.addEventListener('scroll', nyalakanSuara, { once: true });

        console.log("Menunggu interaksi pengguna (scroll/tap) untuk memutar suara...");
    </script>
</body>
</html>
