<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Generator Voucher - Poster Pro</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #fff; padding: 20px; text-align: center; }
        .box { background: #222; border: 1px solid #D4AF37; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto; }
        select, input, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; border: 1px solid #555; background: #333; color: #fff; font-size: 16px; }
        button { background: #D4AF37; color: #000; font-weight: bold; cursor: pointer; border: none; margin-top: 20px; }
        button:hover { background: #FFE259; }
        #hasil { font-size: 20px; color: #00ff88; margin-top: 20px; font-weight: bold; letter-spacing: 1px; user-select: all; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="color: #D4AF37;">🔑 Generator Lisensi</h2>
        
        <label style="display:block; text-align:left; margin-top:15px; font-size:12px; color:#aaa;">Pilih Paket Durasi:</label>
        <select id="durasi">
            <option value="1">1 Hari (Rp 5.000)</option>
            <option value="3">3 Hari (Rp 10.000)</option>
            <option value="7">7 Hari (Rp 20.000)</option>
            <option value="14">14 Hari (Rp 35.000)</option>
            <option value="28">28 Hari (Rp 55.000)</option>
            <option value="42">42 Hari (Rp 75.000)</option>
            <option value="60">2 Bulan / 60 Hari (Rp 95.000)</option>
        </select>

        <label style="display:block; text-align:left; margin-top:15px; font-size:12px; color:#aaa;">Batas Penukaran Voucher (Maksimal dipakai kapan?):</label>
        <input type="date" id="expireDate">

        <button onclick="buatVoucher()">Buat Kode Sekarang</button>

        <div id="hasil"></div>
        <button id="copyBtn" style="display:none; background:#25D366; color:white;" onclick="copyKode()">📋 Copy ke WhatsApp</button>
    </div>

    <script>
        // Set default date ke 1 bulan dari sekarang
        const nextMonth = new Date();
        nextMonth.setMonth(nextMonth.getMonth() + 1);
        document.getElementById('expireDate').valueAsDate = nextMonth;

        function buatVoucher() {
            const durasi = document.getElementById('durasi').value;
            const dateInput = document.getElementById('expireDate').value;
            
            if(!dateInput) { alert("Pilih tanggal kadaluarsa voucher!"); return; }

            // Ubah YYYY-MM-DD jadi YYYYMMDD
            const tglBatas = dateInput.replace(/-/g, '');
            
            // Bikin 4 huruf/angka acak untuk keamanan
            const acak = Math.random().toString(36).substring(2, 6).toUpperCase();

            // Format akhir
            const kodeFinal = `POSTER-${acak}-${durasi}H-${tglBatas}`;
            
            document.getElementById('hasil').innerText = kodeFinal;
            document.getElementById('copyBtn').style.display = 'block';
        }

        function copyKode() {
            const teks = document.getElementById('hasil').innerText;
            navigator.clipboard.writeText(teks).then(() => {
                alert("Kode berhasil di-copy! Silakan paste ke pelanggan di WhatsApp.");
            });
        }
    </script>
</body>
</html>
