here<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip Dakwah Manhaj Salaf</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #09090b;
            color: #f4f4f5;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        /* Tampilan Dropdown Saran Pencarian dengan Batas Tinggi & BISA DIGULIR */
        #searchResults {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            margin-top: 8px;
            z-index: 50;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            display: none;
            max-height: 380px; /* Menampung sekitar 8-10 baris hasil */
            overflow-y: auto;  /* Mengaktifkan fitur gulir (scroll) di dalam dropdown */
        }

        /* Kustomisasi Scrollbar Dropdown agar Rapi dan Elegan */
        #searchResults::-webkit-scrollbar {
            width: 6px;
        }
        #searchResults::-webkit-scrollbar-track {
            background: #18181b;
            border-radius: 0 12px 12px 0;
        }
        #searchResults::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 10px;
        }
        #searchResults::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Hide Scrollbar for Carousel */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 bg-zinc-950/80 backdrop-blur-md border-b border-zinc-800">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-500 font-bold text-lg">
                    📚
                </div>
                <div>
                    <h1 class="font-bold text-zinc-100 leading-tight">Arsip Dakwah</h1>
                    <p class="text-xs text-zinc-400">Manhaj Salaf</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button id="btnBookmarkView" onclick="toggleBookmarkView()" class="p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-amber-500 transition">
                    <i class="fa-solid fa-bookmark"></i>
                </button>
                <button id="btnAudioToggle" onclick="toggleAudio()" class="p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-amber-500 transition">
                    <i class="fa-solid fa-volume-xmark" id="audioIcon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 pt-6">

        <!-- Search Bar -->
        <div class="relative mb-6">
            <div class="relative flex items-center">
                <i class="fa-solid fa-magnifying-glass absolute left-4 text-zinc-500"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Cari judul, kata kunci, atau penjelasan..." 
                    class="w-full pl-11 pr-10 py-3.5 bg-zinc-900 border border-zinc-800 rounded-2xl text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-amber-500/50 transition">
                <button id="btnClearSearch" onclick="clearSearch()" class="hidden absolute right-4 text-zinc-500 hover:text-zinc-300">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <!-- Dropdown Hasil Pencarian -->
            <div id="searchResults"></div>
        </div>

        <!-- Filter Kategori -->
        <div class="mb-6">
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1" id="categoryContainer">
                <button onclick="filterCategory('all')" class="cat-btn active px-4 py-2 rounded-xl text-xs font-medium whitespace-nowrap bg-amber-500 text-zinc-950">
                    Semua
                </button>
                <!-- Categories injected dynamically -->
            </div>
        </div>

        <!-- Layout Controls & Total Count -->
        <div class="flex items-center justify-between mb-4">
            <p id="totalCount" class="text-xs text-zinc-400 font-medium">Memuat data...</p>
            <div class="flex items-center bg-zinc-900 border border-zinc-800 rounded-xl p-1 gap-1">
                <button id="btnGridMode" onclick="setLayoutMode('grid')" class="p-1.5 rounded-lg text-xs text-amber-500 bg-zinc-800">
                    <i class="fa-solid fa-border-all"></i>
                </button>
                <button id="btnCompactMode" onclick="setLayoutMode('compact')" class="p-1.5 rounded-lg text-xs text-zinc-500 hover:text-zinc-300">
                    <i class="fa-solid fa-list"></i>
                </button>
            </div>
        </div>

        <!-- Poster Grid / List Container -->
        <div id="posterContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Items injected dynamically -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16">
            <div class="w-16 h-16 mx-auto mb-3 rounded-full bg-zinc-900 flex items-center justify-center text-zinc-600 text-xl">
                <i class="fa-solid fa-folder-open"></i>
            </div>
            <p class="text-sm text-zinc-400 font-medium">Tidak ada poster ditemukan</p>
        </div>

    </main>

    <!-- Modal Detail Poster -->
    <div id="posterModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
            <!-- Modal Header -->
            <div class="p-4 border-b border-zinc-800 flex items-center justify-between bg-zinc-950">
                <div class="flex items-center gap-2">
                    <span id="modalEmoji" class="text-lg">📂</span>
                    <span id="modalKategori" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-500 border border-amber-500/20 uppercase tracking-wider">Kategori</span>
                </div>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-zinc-800 text-zinc-400 hover:text-zinc-100 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <!-- Modal Body -->
            <div class="p-4 overflow-y-auto space-y-4">
                <div class="relative group rounded-xl overflow-hidden bg-zinc-950">
                    <img id="modalImage" src="" alt="" class="w-full h-auto object-contain max-h-[350px] mx-auto">
                    <div id="carouselControls" class="hidden absolute inset-0 flex items-center justify-between p-2 pointer-events-none">
                        <button onclick="prevImage()" class="pointer-events-auto p-2 rounded-full bg-black/60 text-white hover:bg-black/80">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <button onclick="nextImage()" class="pointer-events-auto p-2 rounded-full bg-black/60 text-white hover:bg-black/80">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                    <div id="imageCounter" class="hidden absolute bottom-2 right-2 px-2 py-1 rounded bg-black/70 text-[10px] text-white">
                        1/1
                    </div>
                </div>

                <div>
                    <h2 id="modalJudul" class="text-lg font-bold text-zinc-100 leading-snug mb-1"></h2>
                    <p id="modalCollaborator" class="text-xs text-amber-500/90 italic whitespace-pre-line mb-3"></p>
                    <div id="modalContent" class="text-sm text-zinc-300 leading-relaxed space-y-2 bg-zinc-950 p-3 rounded-xl border border-zinc-800/50 whitespace-pre-line"></div>
                </div>

                <div id="modalTags" class="flex flex-wrap gap-1.5 pt-2"></div>
            </div>

            <!-- Modal Footer -->
            <div class="p-4 border-t border-zinc-800 bg-zinc-950 flex items-center gap-2">
                <button onclick="copyCaption()" class="flex-1 py-2.5 px-4 bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold rounded-xl text-xs flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-copy"></i> Copy Caption
                </button>
                <button id="btnModalBookmark" onclick="toggleBookmarkModal()" class="py-2.5 px-4 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-semibold rounded-xl text-xs flex items-center gap-2 transition">
                    <i class="fa-solid fa-bookmark"></i> Simpan
                </button>
            </div>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="bgAudio" loop src="suara-ombak.mp3"></audio>

    <script>
        let manifestData = null;
        let currentLayout = 'grid';
        let currentCategory = 'all';
        let currentModalPoster = null;
        let currentImageIndex = 0;
        let currentImagesList = [];
        let bookmarks = JSON.parse(localStorage.getItem('poster_bookmarks') || '[]');
        let isBookmarkViewOnly = false;

        // Fetch Manifest Data
        async function init() {
            try {
                const res = await fetch('manifest.json');
                manifestData = await res.json();
                renderCategories();
                renderPosters();
            } catch (e) {
                console.error("Gagal memuat manifest.json", e);
                document.getElementById('totalCount').innerText = "Gagal memuat data.";
            }
        }

        function renderCategories() {
            const container = document.getElementById('categoryContainer');
            let html = `
                <button onclick="filterCategory('all')" id="cat-all" class="cat-btn px-4 py-2 rounded-xl text-xs font-medium whitespace-nowrap bg-amber-500 text-zinc-950">
                    Semua
                </button>
            `;

            manifestData.kategori_list.forEach(cat => {
                const key = cat.toLowerCase();
                const emoji = manifestData.kategori_emoji[key] || '📂';
                html += `
                    <button onclick="filterCategory('${key}')" id="cat-${key}" class="cat-btn px-4 py-2 rounded-xl text-xs font-medium whitespace-nowrap bg-zinc-900 text-zinc-400 border border-zinc-800 hover:text-zinc-200">
                        ${emoji} ${cat}
                    </button>
                `;
            });
            container.innerHTML = html;
        }

        function filterCategory(catKey) {
            currentCategory = catKey;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-4 py-2 rounded-xl text-xs font-medium whitespace-nowrap bg-zinc-900 text-zinc-400 border border-zinc-800 hover:text-zinc-200";
            });
            
            const activeBtn = document.getElementById(`cat-${catKey}`);
            if (activeBtn) {
                activeBtn.className = "cat-btn px-4 py-2 rounded-xl text-xs font-medium whitespace-nowrap bg-amber-500 text-zinc-950 font-bold";
            }
            renderPosters();
        }

        function renderPosters() {
            if (!manifestData) return;

            let list = manifestData.posters;

            if (isBookmarkViewOnly) {
                list = list.filter(p => bookmarks.includes(p.path));
            } else if (currentCategory !== 'all') {
                list = list.filter(p => p.kategori.toLowerCase() === currentCategory);
            }

            const totalEl = document.getElementById('totalCount');
            totalEl.innerText = `Menampilkan ${list.length} poster`;

            const container = document.getElementById('posterContainer');
            const emptyState = document.getElementById('emptyState');

            if (list.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            if (currentLayout === 'grid') {
                container.className = "grid grid-cols-1 sm:grid-cols-2 gap-4";
                container.innerHTML = list.map(p => {
                    const isBookmarked = bookmarks.includes(p.path);
                    const firstImg = p.images ? p.images.split(',')[0].trim() : '1.jpg';
                    const imgUrl = `posters/${p.path}/${firstImg}`;
                    const emoji = manifestData.kategori_emoji[p.kategori.toLowerCase()] || '📂';

                    return `
                        <div onclick="openModal('${p.path}')" class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-3 flex gap-3.5 cursor-pointer hover:border-zinc-700 transition group">
                            <div class="w-24 h-24 rounded-xl overflow-hidden bg-zinc-950 flex-shrink-0 relative">
                                <img src="${imgUrl}" alt="${p.judul}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                            </div>
                            <div class="flex-1 flex flex-col justify-between min-w-0">
                                <div>
                                    <div class="flex items-center gap-1.5 mb-1">
                                        <span class="text-xs">${emoji}</span>
                                        <span class="text-[10px] uppercase font-bold text-amber-500/90 tracking-wider truncate">${p.kategori}</span>
                                    </div>
                                    <h3 class="font-bold text-sm text-zinc-100 line-clamp-2 leading-snug group-hover:text-amber-400 transition">${p.judul}</h3>
                                </div>
                                <div class="flex items-center justify-between mt-2 pt-2 border-t border-zinc-800/50">
                                    <span class="text-[11px] text-zinc-500">Lihat Detail</span>
                                    <button onclick="event.stopPropagation(); toggleBookmark('${p.path}')" class="text-xs ${isBookmarked ? 'text-amber-500' : 'text-zinc-600 hover:text-zinc-400'}">
                                        <i class="fa-solid fa-bookmark"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                container.className = "space-y-2";
                container.innerHTML = list.map(p => {
                    const isBookmarked = bookmarks.includes(p.path);
                    const emoji = manifestData.kategori_emoji[p.kategori.toLowerCase()] || '📂';

                    return `
                        <div onclick="openModal('${p.path}')" class="bg-zinc-900/40 border border-zinc-800/60 rounded-xl px-4 py-3 flex items-center justify-between cursor-pointer hover:border-zinc-700 transition">
                            <div class="flex items-center gap-3 min-w-0 pr-2">
                                <span class="text-sm">${emoji}</span>
                                <div class="min-w-0">
                                    <h3 class="font-semibold text-xs text-zinc-200 truncate">${p.judul}</h3>
                                    <p class="text-[10px] text-zinc-500 uppercase">${p.kategori}</p>
                                </div>
                            </div>
                            <button onclick="event.stopPropagation(); toggleBookmark('${p.path}')" class="text-xs ${isBookmarked ? 'text-amber-500' : 'text-zinc-600 hover:text-zinc-400'} flex-shrink-0">
                                <i class="fa-solid fa-bookmark"></i>
                            </button>
                        </div>
                    `;
                }).join('');
            }
        }

        function handleSearch() {
            const input = document.getElementById('searchInput').value.toLowerCase().trim();
            const resultsContainer = document.getElementById('searchResults');
            const btnClear = document.getElementById('btnClearSearch');

            if (input.length > 0) {
                btnClear.classList.remove('hidden');
            } else {
                btnClear.classList.add('hidden');
                resultsContainer.style.display = 'none';
                return;
            }

            if (!manifestData) return;

            const matched = manifestData.posters.filter(p => {
                const j = p.judul ? p.judul.toLowerCase() : '';
                const k = p.kategori ? p.kategori.toLowerCase() : '';
                const t = p.tags ? p.tags.toLowerCase() : '';
                return j.includes(input) || k.includes(input) || t.includes(input);
            });

            if (matched.length === 0) {
                resultsContainer.innerHTML = `<div class="p-4 text-xs text-zinc-500 text-center">Tidak ada hasil cocok</div>`;
            } else {
                resultsContainer.innerHTML = matched.map(p => {
                    const emoji = manifestData.kategori_emoji[p.kategori.toLowerCase()] || '📂';
                    return `
                        <div onclick="selectSearchResult('${p.path}')" class="p-3 border-b border-zinc-800/60 last:border-0 hover:bg-zinc-800/50 cursor-pointer flex items-center justify-between transition">
                            <div class="flex items-center gap-2.5 min-w-0">
                                <span class="text-sm">${emoji}</span>
                                <span class="text-xs font-medium text-zinc-200 truncate">${p.judul}</span>
                            </div>
                            <span class="text-[10px] text-amber-500/80 uppercase font-semibold flex-shrink-0 ml-2">${p.kategori}</span>
                        </div>
                    `;
                }).join('');
            }

            resultsContainer.style.display = 'block';
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').style.display = 'none';
            document.getElementById('btnClearSearch').classList.add('hidden');
        }

        function selectSearchResult(path) {
            clearSearch();
            openModal(path);
        }

        async function openModal(path) {
            const poster = manifestData.posters.find(p => p.path === path);
            if (!poster) return;

            currentModalPoster = poster;
            currentImagesList = poster.images ? poster.images.split(',').map(s => s.trim()) : ['1.jpg'];
            currentImageIndex = 0;

            const emoji = manifestData.kategori_emoji[poster.kategori.toLowerCase()] || '📂';
            document.getElementById('modalEmoji').innerText = emoji;
            document.getElementById('modalKategori').innerText = poster.kategori;
            document.getElementById('modalJudul').innerText = poster.judul;

            // Collaborator/Sub Judul
            const collabEl = document.getElementById('modalCollaborator');
            if (poster.sub_judul) {
                collabEl.innerText = poster.sub_judul;
                collabEl.classList.remove('hidden');
            } else {
                collabEl.classList.add('hidden');
            }

            // Tags
            const tagsContainer = document.getElementById('modalTags');
            if (poster.tags) {
                const tagsArr = poster.tags.split(',').map(t => t.trim()).filter(t => t.length > 0);
                tagsContainer.innerHTML = tagsArr.map(t => `<span class="text-[10px] bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded-md">#${t}</span>`).join('');
            } else {
                tagsContainer.innerHTML = '';
            }

            updateCarouselImage();

            // Fetch poster.md content
            const contentEl = document.getElementById('modalContent');
            contentEl.innerText = "Memuat isi penjelasan...";

            try {
                const res = await fetch(`posters/${path}/poster.md`);
                if (res.ok) {
                    const text = await res.text();
                    const cleanText = text.replace(/^---[\s\S]*?---/, '').trim();
                    contentEl.innerText = cleanText || "Tidak ada deskripsi tambahan.";
                } else {
                    contentEl.innerText = "Deskripsi tidak ditemukan.";
                }
            } catch (e) {
                contentEl.innerText = "Gagal memuat isi penjelasan.";
            }

            updateModalBookmarkBtn();
            document.getElementById('posterModal').classList.remove('hidden');
        }

        function updateCarouselImage() {
            const imgEl = document.getElementById('modalImage');
            const controls = document.getElementById('carouselControls');
            const counter = document.getElementById('imageCounter');

            const currentImg = currentImagesList[currentImageIndex];
            imgEl.src = `posters/${currentModalPoster.path}/${currentImg}`;

            if (currentImagesList.length > 1) {
                controls.classList.remove('hidden');
                counter.classList.remove('hidden');
                counter.innerText = `${currentImageIndex + 1}/${currentImagesList.length}`;
            } else {
                controls.classList.add('hidden');
                counter.classList.add('hidden');
            }
        }

        function prevImage() {
            if (currentImagesList.length <= 1) return;
            currentImageIndex = (currentImageIndex - 1 + currentImagesList.length) % currentImagesList.length;
            updateCarouselImage();
        }

        function nextImage() {
            if (currentImagesList.length <= 1) return;
            currentImageIndex = (currentImageIndex + 1) % currentImagesList.length;
            updateCarouselImage();
        }

        function closeModal() {
            document.getElementById('posterModal').classList.add('hidden');
        }

        function copyCaption() {
            if (!currentModalPoster) return;

            const judul = currentModalPoster.judul || '';
            const collabRaw = currentModalPoster.sub_judul || '';
            const collabClean = collabRaw.replace(/\*/g, ''); // Hapus asterisk miring
            const content = document.getElementById('modalContent').innerText;

            let fullCaption = `${judul}\n\n${content}`;
            if (collabClean) {
                fullCaption += `\n\n${collabClean}`;
            }

            navigator.clipboard.writeText(fullCaption).then(() => {
                alert("Caption berhasil disalin ke clipboard!");
            }).catch(() => {
                alert("Gagal menyalin caption.");
            });
        }

        function toggleBookmark(path) {
            const index = bookmarks.indexOf(path);
            if (index > -1) {
                bookmarks.splice(index, 1);
            } else {
                bookmarks.push(path);
            }
            localStorage.setItem('poster_bookmarks', JSON.stringify(bookmarks));
            renderPosters();
        }

        function toggleBookmarkModal() {
            if (!currentModalPoster) return;
            toggleBookmark(currentModalPoster.path);
            updateModalBookmarkBtn();
        }

        function updateModalBookmarkBtn() {
            if (!currentModalPoster) return;
            const btn = document.getElementById('btnModalBookmark');
            const isBookmarked = bookmarks.includes(currentModalPoster.path);
            if (isBookmarked) {
                btn.className = "py-2.5 px-4 bg-amber-500/20 text-amber-500 border border-amber-500/30 font-semibold rounded-xl text-xs flex items-center gap-2 transition";
                btn.innerHTML = `<i class="fa-solid fa-bookmark"></i> Tersimpan`;
            } else {
                btn.className = "py-2.5 px-4 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-semibold rounded-xl text-xs flex items-center gap-2 transition";
                btn.innerHTML = `<i class="fa-solid fa-bookmark"></i> Simpan`;
            }
        }

        function toggleBookmarkView() {
            isBookmarkViewOnly = !isBookmarkViewOnly;
            const btn = document.getElementById('btnBookmarkView');
            if (isBookmarkViewOnly) {
                btn.className = "p-2.5 rounded-xl bg-amber-500 text-zinc-950 font-bold transition";
            } else {
                btn.className = "p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-amber-500 transition";
            }
            renderPosters();
        }

        function setLayoutMode(mode) {
            currentLayout = mode;
            const btnGrid = document.getElementById('btnGridMode');
            const btnCompact = document.getElementById('btnCompactMode');

            if (mode === 'grid') {
                btnGrid.className = "p-1.5 rounded-lg text-xs text-amber-500 bg-zinc-800";
                btnCompact.className = "p-1.5 rounded-lg text-xs text-zinc-500 hover:text-zinc-300";
            } else {
                btnCompact.className = "p-1.5 rounded-lg text-xs text-amber-500 bg-zinc-800";
                btnGrid.className = "p-1.5 rounded-lg text-xs text-zinc-500 hover:text-zinc-300";
            }
            renderPosters();
        }

        function toggleAudio() {
            const audio = document.getElementById('bgAudio');
            const icon = document.getElementById('audioIcon');

            if (audio.paused) {
                audio.play();
                icon.className = "fa-solid fa-volume-high text-amber-500";
            } else {
                audio.pause();
                icon.className = "fa-solid fa-volume-xmark";
            }
        }

        // Run Init
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
