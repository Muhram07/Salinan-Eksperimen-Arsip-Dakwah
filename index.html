<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip Dakwah Manhaj Salaf</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0b0b0b;
            --bg-card: rgba(21, 21, 21, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --gold-main: #D4AF37;
            --gold-light: #E6B800;
            --gold-glow: rgba(212, 175, 55, 0.25);
            --text-main: #ffffff;
            --text-sub: #bdbdbd;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: radial-gradient(circle at 50% 0%, #181818 0%, var(--bg-main) 70%);
            color: var(--text-main);
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
            max-width: 1100px;
            margin: auto;
            min-height: 100vh;
        }

        /* --- HEADER & PENCARIAN --- */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: var(--gold-main);
            letter-spacing: 1.5px;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .header p {
            color: var(--text-sub);
            font-size: 14px;
        }

        .search-box {
            position: relative;
            margin: 20px 0 15px 0;
        }
        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 45px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: #fff;
            font-size: 15px;
            outline: none;
            backdrop-filter: blur(8px);
            transition: 0.3s;
        }
        .search-box input:focus {
            border-color: var(--gold-main);
            box-shadow: 0 0 15px var(--gold-glow);
            background: rgba(255, 255, 255, 0.12);
        }
        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold-main);
        }

        /* --- DESAIN TAB FILTER BERANDA (3 MODE) --- */
        .view-mode-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .segmented-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            padding: 4px;
            gap: 4px;
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 480px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 10px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }
        .tab-btn i { font-size: 14px; }
        .tab-btn:hover {
            color: #fff;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, var(--gold-main), var(--gold-light));
            color: #111;
            box-shadow: 0 2px 10px var(--gold-glow);
        }

        /* --- KATEGORI HORIZONTAL SCROLL --- */
        .category-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .category-scroll::-webkit-scrollbar { display: none; }
        .cat-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 13px;
            color: var(--text-sub);
            cursor: pointer;
            white-space: nowrap;
            transition: 0.3s;
        }
        .cat-chip.active, .cat-chip:hover {
            border-color: var(--gold-main);
            color: var(--gold-main);
            background: rgba(212, 175, 55, 0.1);
        }

        /* --- GRID POSTER --- */
        .poster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .poster-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(6px);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .poster-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            border-color: rgba(212, 175, 55, 0.3);
        }
        
        /* Thumbnail Container Handling All Aspect Ratios (9:16, 4:3, 1:1) */
        .card-img-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%; /* Default Square Base */
            background: #000;
            overflow: hidden;
        }
        .card-img-wrapper img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: 0.3s;
        }

        .pdf-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(220, 53, 69, 0.9);
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 2;
        }

        .fav-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            color: #ff4757;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            z-index: 2;
            transition: 0.2s;
        }
        .fav-badge:hover { transform: scale(1.1); }

        .card-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .card-cat {
            font-size: 12px;
            color: var(--gold-main);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .card-title {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .card-snippet {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .card-btn {
            margin-top: auto;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--gold-main);
            color: var(--gold-main);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
        }
        .card-btn:hover {
            background: var(--gold-main);
            color: #111;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: var(--text-sub);
        }
        .empty-state i {
            font-size: 40px;
            color: var(--gold-main);
            margin-bottom: 12px;
            opacity: 0.6;
        }

        /* --- MODAL DETAIL POSTER --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }
        .modal-content {
            background: #141414;
            border: 1px solid var(--border-color);
            max-width: 700px;
            margin: 30px auto;
            border-radius: 24px;
            padding: 24px;
            position: relative;
        }
        .close-modal {
            position: absolute;
            top: 16px; right: 20px;
            font-size: 24px;
            color: var(--text-sub);
            cursor: pointer;
        }
        .close-modal:hover { color: #fff; }

        .modal-img-slider {
            width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 16px;
            background: #000;
            margin-bottom: 15px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .btn-action {
            flex: 1;
            min-width: 130px;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-action:hover {
            border-color: var(--gold-main);
            color: var(--gold-main);
        }
        .btn-action.pdf-btn {
            background: rgba(220, 53, 69, 0.2);
            border-color: #dc3545;
            color: #ff6b81;
        }
        .btn-action.pdf-btn:hover {
            background: #dc3545;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📚 ARSIP DAKWAH</h1>
        <p>Manhaj Salafus Shalih - Media Edukasi & Pengingat Kebaikan</p>
    </div>

    <!-- PENCARIAN -->
    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Cari judul, kata kunci, atau tag..." oninput="handleSearch()">
    </div>

    <!-- TAB NAVIGASI TERPADU (3 MODE BERANDA) -->
    <div class="view-mode-container">
        <div class="segmented-tabs">
            <button class="tab-btn" id="tabFav" onclick="switchViewMode('fav')">
                <i class="fa-solid fa-bookmark"></i> Tersimpan
            </button>
            <button class="tab-btn" id="tabPdf" onclick="switchViewMode('pdf')">
                <i class="fa-solid fa-file-pdf"></i> Hanya PDF
            </button>
            <button class="tab-btn active" id="tabAll" onclick="switchViewMode('all')">
                <i class="fa-solid fa-border-all"></i> Semua
            </button>
        </div>
    </div>

    <!-- KATEGORI SCROLL -->
    <div class="category-scroll" id="categoryWrapper">
        <!-- Generasi Dinamis via JS -->
    </div>

    <!-- CONTAINER GRID POSTER -->
    <div class="poster-grid" id="posterGrid">
        <!-- Card Poster Diresrender di sini -->
    </div>

    <!-- MODAL DETAIL -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <img id="modalImg" class="modal-img-slider" src="" alt="Poster">
            
            <div id="modalCat" class="card-cat"></div>
            <h2 id="modalTitle" style="color: #fff; margin-bottom: 10px;"></h2>
            
            <div class="modal-actions">
                <button class="btn-action" onclick="copyCaption()"><i class="fa-solid fa-copy"></i> Salin Caption</button>
                <button class="btn-action" onclick="toggleBookmarkCurrent()"><i class="fa-solid fa-heart" id="modalFavIcon"></i> Favorit</button>
                <a id="modalPdfBtn" class="btn-action pdf-btn" style="display:none;" target="_blank"><i class="fa-solid fa-file-pdf"></i> Download PDF</a>
            </div>

            <div id="modalCaption" style="color: #bdbdbd; font-size: 14px; line-height: 1.6; white-space: pre-line; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px;"></div>
        </div>
    </div>

    <script>
        // DATA DUMMY / SIMULASI (Sesuai Manifest Data Proyek)
        let allPosters = [];
        let currentMode = 'all'; // 'all', 'pdf', 'fav'
        let activeCategory = 'SEMUA';
        let favorites = JSON.parse(localStorage.getItem('fav_posters') || '[]');
        let currentActivePoster = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await loadManifestData();
            renderCategories();
            renderPosters();
        });

        async function loadManifestData() {
            try {
                const res = await fetch('/manifest.json');
                if (res.ok) {
                    const data = await res.json();
                    allPosters = data.posters || [];
                } else {
                    useFallbackData();
                }
            } catch (e) {
                useFallbackData();
            }
        }

        function useFallbackData() {
            // Data contoh untuk simulasi UI
            allPosters = [
                {
                    id: "p1",
                    judul: "Pentingnya Menuntut Ilmu Syar'i",
                    kategori: "Aqidah",
                    kategori_emoji: "📖",
                    images: ["1.jpg"],
                    pdf: "brosur.pdf",
                    caption: "Menuntut ilmu syar'i adalah kewajiban bagi setiap muslim."
                },
                {
                    id: "p2",
                    judul: "Keutamaan Dzikir Pagi dan Petang",
                    kategori: "Sunnah",
                    kategori_emoji: "🛡️",
                    images: ["1.jpg"],
                    pdf: "",
                    caption: "Jagalah dzikir pagi dan petang sebagai benteng diri."
                },
                {
                    id: "p3",
                    judul: "Bahaya Riya Dalam Beramal",
                    kategori: "Akhlak",
                    kategori_emoji: "⚠️",
                    images: ["1.jpg"],
                    pdf: "brosur.pdf",
                    caption: "Ikhlas adalah syarat diterimanya amal ibadah."
                }
            ];
        }

        function switchViewMode(mode) {
            currentMode = mode;
            
            // Update Tampilan Tab
            document.getElementById('tabAll').classList.toggle('active', mode === 'all');
            document.getElementById('tabPdf').classList.toggle('active', mode === 'pdf');
            document.getElementById('tabFav').classList.toggle('active', mode === 'fav');

            renderPosters();
        }

        function renderCategories() {
            const wrapper = document.getElementById('categoryWrapper');
            const categories = ['SEMUA', ...new Set(allPosters.map(p => p.kategori))];
            
            wrapper.innerHTML = categories.map(cat => `
                <div class="cat-chip ${cat === activeCategory ? 'active' : ''}" onclick="filterCategory('${cat}')">
                    ${cat}
                </div>
            `).join('');
        }

        function filterCategory(cat) {
            activeCategory = cat;
            renderCategories();
            renderPosters();
        }

        function handleSearch() {
            renderPosters();
        }

        function renderPosters() {
            const grid = document.getElementById('posterGrid');
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allPosters.filter(poster => {
                // Filter Mode (Semua / Hanya PDF / Tersimpan)
                if (currentMode === 'pdf' && (!poster.pdf || poster.pdf === '')) return false;
                if (currentMode === 'fav' && !favorites.includes(poster.id)) return false;

                // Filter Kategori
                if (activeCategory !== 'SEMUA' && poster.kategori !== activeCategory) return false;

                // Filter Pencarian
                if (searchKeyword) {
                    const matchJudul = poster.judul.toLowerCase().includes(searchKeyword);
                    const matchCaption = poster.caption ? poster.caption.toLowerCase().includes(searchKeyword) : false;
                    const matchCat = poster.kategori.toLowerCase().includes(searchKeyword);
                    return matchJudul || matchCaption || matchCat;
                }

                return true;
            });

            if (filtered.length === 0) {
                let emptyMessage = 'Tidak ada konten ditemukan.';
                if (currentMode === 'pdf') emptyMessage = 'Belum ada poster berformat PDF di kategori ini.';
                if (currentMode === 'fav') emptyMessage = 'Belum ada poster yang Anda simpan di favorit.';

                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-folder-open"></i>
                        <p>${emptyMessage}</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(poster => {
                const isFav = favorites.includes(poster.id);
                const hasPdf = poster.pdf && poster.pdf !== '' && poster.pdf !== 'tidakpakepdf: "brosur.pdf"';

                return `
                    <div class="poster-card">
                        <div class="card-img-wrapper">
                            <span class="fav-badge" onclick="toggleBookmark(event, '${poster.id}')">
                                <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                            </span>
                            ${hasPdf ? `<span class="pdf-badge"><i class="fa-solid fa-file-pdf"></i> PDF</span>` : ''}
                            <img src="${poster.images ? poster.images[0] : ''}" alt="${poster.judul}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x400/111/D4AF37?text=Arsip+Dakwah'">
                        </div>
                        <div class="card-content">
                            <div class="card-cat">${poster.kategori_emoji || '📂'} ${poster.kategori}</div>
                            <div class="card-title">${poster.judul}</div>
                            <div class="card-snippet">${poster.caption || ''}</div>
                            <button class="card-btn" onclick="openDetail('${poster.id}')">Buka Detail</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleBookmark(event, id) {
            event.stopPropagation();
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('fav_posters', JSON.stringify(favorites));
            renderPosters();
        }

        function openDetail(id) {
            const poster = allPosters.find(p => p.id === id);
            if (!poster) return;

            currentActivePoster = poster;
            document.getElementById('modalImg').src = poster.images ? poster.images[0] : '';
            document.getElementById('modalCat').innerText = `${poster.kategori_emoji || '📂'} ${poster.kategori}`;
            document.getElementById('modalTitle').innerText = poster.judul;
            document.getElementById('modalCaption').innerText = poster.caption || 'Tidak ada deskripsi.';

            // PDF Action Button
            const pdfBtn = document.getElementById('modalPdfBtn');
            if (poster.pdf && poster.pdf !== '' && poster.pdf !== 'tidakpakepdf: "brosur.pdf"') {
                pdfBtn.style.display = 'flex';
                pdfBtn.href = poster.pdf;
            } else {
                pdfBtn.style.display = 'none';
            }

            updateModalFavIcon();
            document.getElementById('detailModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
            currentActivePoster = null;
        }

        function updateModalFavIcon() {
            if (!currentActivePoster) return;
            const icon = document.getElementById('modalFavIcon');
            if (favorites.includes(currentActivePoster.id)) {
                icon.className = 'fa-solid fa-heart';
                icon.style.color = '#ff4757';
            } else {
                icon.className = 'fa-regular fa-heart';
                icon.style.color = '#fff';
            }
        }

        function toggleBookmarkCurrent() {
            if (!currentActivePoster) return;
            toggleBookmark(new Event('click'), currentActivePoster.id);
            updateModalFavIcon();
        }

        function copyCaption() {
            if (!currentActivePoster || !currentActivePoster.caption) return;
            navigator.clipboard.writeText(currentActivePoster.caption);
            alert('✅ Caption berhasil disalin!');
        }
    </script>
</body>
</html>
