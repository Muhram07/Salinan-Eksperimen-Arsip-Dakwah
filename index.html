<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip Dakwah Manhaj Salaf</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{background:#0b0b0b;color:#fff;font-family:Arial, Helvetica, sans-serif;padding:20px;max-width:1200px;margin:auto;}
        
        /* --- BRANDING DEVELOPER DI ATAS --- */
        .brand-wrapper{text-align:center;margin-bottom:15px;padding-top:5px;}
        .brand-wrapper .developer-name{color:#bdbdbd;font-size:14px;font-weight:bold;letter-spacing:1px;}
        .brand-wrapper .developer-title{color:#666;font-size:11px;letter-spacing:0.5px;margin-top:2px;}

        /* --- NAVIGASI FAVORIT DI ATAS --- */
        .nav-wrapper{display:flex;justify-content:space-between;margin-bottom:20px;gap:10px;flex-wrap:wrap;padding:0 5px;}
        .btn-nav{background:#FFD700;color:#111;border:none;padding:8px 20px;border-radius:20px;font-weight:bold;cursor:pointer;font-size:15px;transition:0.3s;}
        .btn-nav:hover{transform:scale(1.02);}

        /* --- HEADER UTAMA --- */
        .header-container{position:relative;background:linear-gradient(135deg,#0f172a,#111827,#1e293b);padding:40px 20px;text-align:center;border-radius:20px;margin-bottom:30px;}
        .header-container h1{color:#FFD700;font-size:32px;margin-bottom:10px;}
        .header-container p{color:#d1d5db;font-size:16px;margin-bottom:20px;}
        
        /* --- SEARCH WRAPPER (Untuk Dropdown) --- */
        .search-wrapper{position:relative;max-width:600px;margin:0 auto;}
        #search{width:100%;padding:14px 20px;border:none;border-radius:14px;font-size:16px;outline:none;background:#fff;color:#111;}
        
        /* --- DROPDOWN HASIL PENCARIAN --- */
        #search-result{position:absolute;top:100%;left:0;right:0;background:#151515;border:1px solid #252525;border-radius:14px;margin-top:5px;overflow:hidden;display:none;z-index:20;}
        .search-item{padding:12px 16px;border-bottom:1px solid #252525;cursor:pointer;display:flex;justify-content:space-between;color:#fff;transition:0.2s;}
        .search-item:hover{background:#252525;color:#FFD700;}
        .search-item small{color:#888;font-size:12px;}

        /* --- KATEGORI --- */
        .kategori-container{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-bottom:30px;}
        .card-kategori{background:#1a1a1a;padding:15px;border-radius:14px;text-align:center;border:1px solid #222;cursor:pointer;transition:0.3s;}
        .card-kategori:hover{background:#242424;border-color:#FFD700;transform:translateY(-2px);}
        .card-kategori .icon{font-size:32px;}
        .card-kategori .nama{color:#fff;font-size:18px;font-weight:bold;margin:5px 0;}
        .card-kategori .jumlah{color:#FFD700;font-size:14px;}

        /* --- POSTER --- */
        #post-list{display:grid;grid-template-columns:1fr;gap:20px;}
        .poster{background:#151515;border:1px solid #252525;border-radius:20px;overflow:hidden;padding:20px;transition:0.3s;position:relative;}
        .poster:hover{border-color:#FFD700;}
        .poster img{width:100%;border-radius:12px;margin-bottom:15px;}
        .poster h3{color:#FFD700;font-size:24px;margin-bottom:10px;}
        .poster .sub-caption{color:#bdbdbd;font-size:16px;margin-bottom:15px;font-style:italic;}
        
        /* --- POSTER CONTENT & READ MORE --- */
        .poster-content-wrapper{position:relative;color:#ddd;line-height:1.8;font-size:16px;overflow:hidden;transition:max-height 0.4s ease;}
        .poster-content-wrapper.collapsed{max-height:250px;} /* Batas 7 baris */
        .poster-content-wrapper.expanded{max-height:2000px;}
        
        .read-more-btn{display:inline-block;margin-top:10px;background:transparent;color:#FFD700;border:none;font-weight:bold;cursor:pointer;font-size:15px;padding:5px 0;text-decoration:underline;}
        .read-more-btn:hover{color:#fff;}

        /* --- TAG (DIDESAIN ULANG) --- */
        .poster .tags-wrapper{margin-top:15px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
        .poster .tags-label{color:#bdbdbd;font-size:14px;font-weight:bold;margin-right:4px;}
        .poster .tag{background:transparent;color:#FFD700;border:1px solid #FFD700;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:bold;}
        
        /* --- TOMBOL AKSI --- */
        .poster .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px;align-items:center;}
        .poster .actions button{background:#FFD700;color:#111;border:none;padding:8px 18px;border-radius:20px;font-weight:bold;cursor:pointer;font-size:14px;}
        .poster .actions button:hover{transform:scale(1.02);}

        /* --- TOMBOL FAVORIT --- */
        .btn-fav{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.6);border:none;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer;display:flex;justify-content:center;align-items:center;transition:0.3s;}
        .btn-fav:hover{transform:scale(1.1);}
        .btn-fav.favorit{color:#FFD700;}
        .btn-fav:not(.favorit){color:#888;}

        .loading{text-align:center;color:#888;padding:20px;font-size:18px;}
        
        @media(min-width:600px){#post-list{grid-template-columns:repeat(2,1fr));}}
        @media(min-width:900px){#post-list{grid-template-columns:repeat(3,1fr));}}
    </style>
</head>
<body>

    <!-- BRANDING DEVELOPER -->
    <div class="brand-wrapper">
        <div class="developer-name">Muhram Nur Surisma</div>
        <div class="developer-title">Digital Dakwah Developer</div>
    </div>

    <!-- NAVIGASI DI ATAS -->
    <div class="nav-wrapper">
        <button class="btn-nav" onclick="tampilkanFavorit()">❤️ Favorit</button>
        <button class="btn-nav" onclick="resetSemua()">📚 Semua</button>
    </div>

    <!-- HEADER UTAMA -->
    <div class="header-container">
        <h1>📚 Arsip Dakwah Manhaj Salaf</h1>
        <p>Perpustakaan Digital Poster Dakwah</p>
        
        <!-- SEARCH WRAPPER -->
        <div class="search-wrapper">
            <input type="text" id="search" placeholder="🔍 Cari judul, sub judul, kategori, tag, atau isi caption...">
            <div id="search-result"></div>
        </div>
    </div>

    <div id="kategori-wrap" class="kategori-container"></div>
    <div id="post-list" class="loading">Memuat arsip...</div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script>
        const daftarFolder = ["posters/tauhid-001"];
        let kategoriData = {};
        let kategoriAktif = null;
        let semuaPosterCache = [];

        /* --- FAVORIT --- */
        function getFavorit() {
            const data = localStorage.getItem('dakwahFavorit');
            return data ? JSON.parse(data) : [];
        }

        function toggleFavorit(id, btn) {
            let fav = getFavorit();
            if(fav.includes(id)) {
                fav = fav.filter(f => f !== id);
                btn.classList.remove('favorit');
                btn.innerText = '🤍';
            } else {
                fav.push(id);
                btn.classList.add('favorit');
                btn.innerText = '❤️';
            }
            localStorage.setItem('dakwahFavorit', JSON.stringify(fav));
        }

        function tampilkanFavorit() {
            const fav = getFavorit();
            const posters = document.querySelectorAll('.poster');
            posters.forEach(p => {
                const id = p.getAttribute('data-id');
                p.style.display = fav.includes(id) ? 'block' : 'none';
            });
            document.getElementById('search').value = '';
            document.getElementById('search-result').style.display = 'none';
        }

        function resetSemua() {
            const posters = document.querySelectorAll('.poster');
            posters.forEach(p => p.style.display = 'block');
            document.getElementById('search').value = '';
            document.getElementById('search-result').style.display = 'none';
            document.querySelectorAll('.card-kategori').forEach(el => el.style.borderColor = '#222');
            kategoriAktif = null;
        }

        /* --- DOWNLOAD --- */
        function downloadGambar(url, nama) {
            const a = document.createElement('a');
            a.href = url;
            a.download = nama || 'poster.jpg';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function downloadPDF(url, nama) {
            const a = document.createElement('a');
            a.href = url;
            a.download = nama || 'file.pdf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        /* --- COPY CAPTION --- */
        function copyCaptionDariElemen(btn) {
            const poster = btn.closest('.poster');
            const judul = poster.querySelector('h3')?.innerText || '';
            const sub = poster.querySelector('.sub-caption')?.innerText || '';
            const contentWrapper = poster.querySelector('.poster-content-wrapper');
            const isi = contentWrapper ? contentWrapper.innerText : '';
            const konten = `${judul}\n\n${sub}\n\n${isi}`;
            navigator.clipboard.writeText(konten).then(() => {
                alert("✅ Caption berhasil disalin!");
            }).catch(() => {
                alert("❌ Gagal menyalin. Silakan salin secara manual.");
            });
        }

        /* --- LOAD POSTER --- */
        async function loadPosters() {
            const container = document.getElementById('post-list');
            const kategoriWrap = document.getElementById('kategori-wrap');
            container.innerHTML = '<div class="loading">📂 Memuat arsip...</div>';
            
            let htmlPoster = '';
            const favList = getFavorit();
            
            for (let folder of daftarFolder) {
                try {
                    const res = await fetch(`${folder}/poster.md`);
                    if (!res.ok) continue;
                    
                    const text = await res.text();
                    const dataMatch = text.match(/---([\s\S]*?)---/);
                    const contentBody = text.replace(/---([\s\S]*?)---/, '').trim();
                    const info = {};

                    if (dataMatch) {
                        dataMatch[1].split('\n').forEach(line => {
                            const [key, val] = line.split(':').map(s => s.trim());
                            if(key && val) info[key] = val.replace(/^"|"$/g,'');
                        });
                    }

                    const judul = info.judul || "Tanpa Judul";
                    const subJudul = info.sub_judul || "";
                    const kategori = info.kategori || "Umum";
                    const tagArray = info.tags ? info.tags.split(',').map(t => t.trim()) : [];
                    const imageSrc = `${folder}/image.jpg`;
                    const pdfSrc = `${folder}/brosur.pdf`;
                    const posterId = folder.replace('posters/', '');

                    if(!kategoriData[kategori]) kategoriData[kategori] = 0;
                    kategoriData[kategori]++;

                    // --- SIMPAN KE CACHE UNTUK PENCARIAN ---
                    semuaPosterCache.push({ 
                        id: posterId, 
                        judul, 
                        subJudul, 
                        kategori, 
                        tags: tagArray.join(' '),
                        caption: contentBody
                    });

                    const isFav = favList.includes(posterId);
                    const parsedContent = marked.parse(contentBody);

                    // --- TAMPILAN HTML PER POSTER ---
                    htmlPoster += `
                        <div class="poster" data-id="${posterId}" data-kategori="${kategori}">
                            <button class="btn-fav ${isFav ? 'favorit' : ''}" onclick="toggleFavorit('${posterId}', this)">${isFav ? '❤️' : '🤍'}</button>
                            <img src="${imageSrc}" alt="${judul}" onerror="this.style.display='none'">
                            <h3>${judul}</h3>
                            ${subJudul ? `<div class="sub-caption">${subJudul}</div>` : ''}
                            
                            <div class="poster-content-wrapper collapsed" id="content-${posterId}">
                                ${parsedContent}
                            </div>
                            <button class="read-more-btn" id="btn-${posterId}" onclick="toggleReadMore('${posterId}')">📖 Baca Selengkapnya</button>
                            
                            <div class="actions">
                                <button onclick="downloadPDF('${pdfSrc}', '${judul}.pdf')">📄 Download PDF</button>
                                <button onclick="downloadGambar('${imageSrc}', '${judul}.jpg')">🖼️ Download Gambar</button>
                                <button onclick="copyCaptionDariElemen(this)">📋 Copy Caption</button>
                            </div>
                            
                            <!-- TAGS DENGAN LABEL BARU -->
                            ${tagArray.length > 0 ? `
                            <div class="tags-wrapper">
                                <span class="tags-label">Tagar :</span>
                                ${tagArray.map(t => `<span class="tag">${t}</span>`).join('')}
                            </div>
                            ` : ''}
                        </div>
                    `;

                } catch(e) {
                    console.log("Gagal memuat folder:", folder);
                }
            }

            container.innerHTML = htmlPoster || '<div class="loading">Belum ada poster.</div>';

            /* --- KATEGORI --- */
            let htmlKategori = '';
            for(let [nama, jumlah] of Object.entries(kategoriData)) {
                let icon = '📂';
                if(nama === 'Tauhid') icon = '📚';
                else if(nama === 'Bid\'ah') icon = '🚫';
                else if(nama === 'Syirik') icon = '⚠️';
                else if(nama === 'Aqidah') icon = '🕌';

                htmlKategori += `
                    <div class="card-kategori" onclick="filterKategori('${nama}')">
                        <div class="icon">${icon}</div>
                        <div class="nama">${nama}</div>
                        <div class="jumlah">${jumlah} Poster</div>
                    </div>
                `;
            }
            kategoriWrap.innerHTML = htmlKategori;
        }

        /* --- BACA SELENGKAPNYA --- */
        function toggleReadMore(id) {
            const content = document.getElementById(`content-${id}`);
            const btn = document.getElementById(`btn-${id}`);
            
            if (content.classList.contains('collapsed')) {
                content.classList.remove('collapsed');
                content.classList.add('expanded');
                btn.innerText = '📕 Tutup';
            } else {
                content.classList.remove('expanded');
                content.classList.add('collapsed');
                btn.innerText = '📖 Baca Selengkapnya';
            }
        }

        /* --- FILTER KATEGORI --- */
        function filterKategori(nama) {
            kategoriAktif = nama;
            document.querySelectorAll('.card-kategori').forEach(el => {
                const namaEl = el.querySelector('.nama').innerText;
                el.style.borderColor = (namaEl === nama) ? '#FFD700' : '#222';
            });

            const posters = document.querySelectorAll('.poster');
            let adaPoster = false;
            posters.forEach(poster => {
                const kategori = poster.getAttribute('data-kategori');
                if(kategori === nama) {
                    poster.style.display = 'block';
                    adaPoster = true;
                } else {
                    poster.style.display = 'none';
                }
            });

            if(adaPoster) {
                setTimeout(() => {
                    const target = document.getElementById('post-list');
                    if(target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 300);
            }
            document.getElementById('search-result').style.display = 'none';
        }

        /* --- PENCARIAN --- */
        const searchInput = document.getElementById('search');
        const resultBox = document.getElementById('search-result');

        searchInput.addEventListener('input', function() {
            const key = this.value.trim().toLowerCase();
            if (key === '') {
                resultBox.style.display = 'none';
                resultBox.innerHTML = '';
                document.querySelectorAll('.poster').forEach(p => p.style.display = 'block');
                return;
            }

            const hasil = semuaPosterCache.filter(item => 
                item.judul.toLowerCase().includes(key) ||
                item.subJudul.toLowerCase().includes(key) ||
                item.kategori.toLowerCase().includes(key) ||
                item.tags.toLowerCase().includes(key) ||
                item.caption.toLowerCase().includes(key)
            );

            if (hasil.length > 0) {
                resultBox.style.display = 'block';
                resultBox.innerHTML = hasil.map(item => `
                    <div class="search-item" onclick="pilihDariDropdown('${item.id}')">
                        <span>📚 ${item.judul}</span>
                        <small>📂 ${item.kategori}</small>
                    </div>
                `).join('');
            } else {
                resultBox.style.display = 'block';
                resultBox.innerHTML = `<div class="search-item" style="cursor:default;color:#888;">Tidak ada hasil.</div>`;
            }
        });

        function pilihDariDropdown(id) {
            document.getElementById('search-result').style.display = 'none';
            document.getElementById('search').value = '';
            document.querySelectorAll('.poster').forEach(p => {
                const pid = p.getAttribute('data-id');
                p.style.display = (pid === id) ? 'block' : 'none';
            });
            setTimeout(() => {
                document.getElementById('post-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 200);
        }

        loadPosters();
    </script>
</body>
    </html>
