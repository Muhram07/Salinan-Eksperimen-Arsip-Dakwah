<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip Dakwah Manhaj Salaf</title>
    <style>
        /* --- RESET & LAYAR DASAR --- */
        *{box-sizing:border-box;margin:0;padding:0;}
        body{
            background: #0b0b0b;
            background: radial-gradient(circle at 50% 0%, #181818 0%, #0b0b0b 70%);
            color:#fff;
            font-family:'Segoe UI', Arial, sans-serif;
            padding:20px;
            max-width:1100px;
            margin:auto;
            min-height:100vh;
        }
        
        /* --- ELEMEN SOSIAL MEDIA --- */
        .follow-wrapper{text-align:center;margin-bottom:15px;padding:0 10px;}
        .follow-text{color:#bdbdbd;font-size:14px;margin-bottom:12px;line-height:1.5;letter-spacing:0.5px;}
        .sosmed-container{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;}
        .btn-sosmed{
            display:inline-flex;align-items:center;gap:6px;padding:8px 16px;
            border:1px solid rgba(212, 175, 55, 0.4);
            border-radius:25px;text-decoration:none;font-size:13px;font-weight:bold;
            color:#D4AF37;background:rgba(212, 175, 55, 0.05);transition:0.3s;
            backdrop-filter: blur(4px);
        }
        .btn-sosmed:hover{background:#D4AF37;color:#111;transform:scale(1.05);}

        /* --- BRANDING DEVELOPER --- */
        .brand-wrapper{text-align:center;margin-bottom:20px;padding:10px 0 0 0;position:relative;}
        .circuit-line{display:inline-block;width:40px;height:2px;background:#D4AF37;position:relative;vertical-align:middle;margin:0 10px;}
        .circuit-line::before{content:'';position:absolute;width:6px;height:6px;background:#D4AF37;border-radius:50%;top:-2px;}
        .circuit-line.left::before{left:-3px;}
        .circuit-line.right::before{right:-3px;}
        .circuit-line::after{content:'';position:absolute;width:2px;height:12px;background:#D4AF37;top:-14px;left:50%;transform:translateX(-50%);}
        .brand-wrapper .developer-name{color:#D4AF37;font-size:16px;font-weight:bold;letter-spacing:1px;}
        .brand-wrapper .developer-title{color:#888;font-size:11px;letter-spacing:0.5px;margin-top:2px;}
        .brand-divider{width:80px;height:1px;background:#D4AF37;margin:10px auto 15px auto;opacity:0.5;}

        /* --- TOMBOL NAVIGASI ATAS (ANIMASI BERDENYUT OTOMATIS) --- */
        .nav-top-wrapper{
            display:flex;
            justify-content:space-between;
            padding:0 15px;
            margin-bottom:10px;
            flex-wrap:wrap;
        }
        .btn-nav{
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #D4AF37; padding:8px 20px; border-radius:20px;
            font-weight:bold;cursor:pointer;font-size:15px;
            box-shadow:0 4px 15px rgba(0,0,0,0.3);
            animation: pulse-nav 2.5s ease-in-out infinite;
        }
        @keyframes pulse-nav {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }
        .btn-nav:hover{
            background:rgba(212, 175, 55, 0.15);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
            animation-play-state: paused; 
            transform: scale(1.08);
        }

        .nav-middle-wrapper{display:flex;justify-content:center;margin-bottom:20px;}
        .btn-nav-beranda{
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #D4AF37; padding:8px 20px; border-radius:20px;
            font-weight:bold;cursor:pointer;font-size:15px;transition:0.3s;box-shadow:0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-nav-beranda:hover{background:rgba(212, 175, 55, 0.15);transform:scale(1.02);}

        /* --- HEADER UTAMA & SEARCH --- */
        .header-container{
            position:relative;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(17, 24, 39, 0.9), rgba(30, 41, 59, 0.6));
            padding:40px 20px 55px 20px;
            text-align:center;
            border-radius:24px 24px 0 0;
            margin-bottom:0;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            z-index: 10;
        }
        
        .header-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transform: skewX(-25deg);
            animation: shine 6s infinite;
            pointer-events: none;
        }
        @keyframes shine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

        .header-container h1{color:#D4AF37;font-size:32px;margin-bottom:15px;letter-spacing:1px;text-shadow:0 0 20px rgba(212,175,55,0.2);}
        .header-container .sub-title{color:#d1d5db;font-size:18px;font-weight:normal;letter-spacing:1px;}
        
        .search-wrapper{position:relative;max-width:550px;margin:-25px auto 35px auto;width:90%;z-index:20;}
        #search{
            width:100%;padding:14px 20px;border:none;
            border-radius:16px;font-size:16px;outline:none;
            background:rgba(255, 255, 255, 0.12); color:#fff;
            box-shadow:0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
        }
        #search:focus{background:rgba(255, 255, 255, 0.25);border-color:rgba(212, 175, 55, 0.3);}
        #search::placeholder{color:#aaa;}
        
        #search-result{
            position:absolute;top:calc(100% + 10px);left:0;right:0;
            background:rgba(21, 21, 21, 0.95); backdrop-filter: blur(10px);
            border:1px solid rgba(255, 255, 255, 0.1); border-radius:16px;
            overflow:hidden; display:none; z-index:9999;
        }
        .search-item{padding:12px 16px;border-bottom:1px solid rgba(255, 255, 255, 0.05);cursor:pointer;display:flex;justify-content:space-between;color:#fff;transition:0.2s;}
        .search-item:hover{background:rgba(212, 175, 55, 0.15);color:#D4AF37;}
        .search-item small{color:#888;font-size:12px;}

        .kategori-container{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-bottom:30px;}
        .card-kategori{
            background:rgba(26, 26, 26, 0.4);
            padding:15px;border-radius:20px;text-align:center;
            border:1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(6px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            cursor:pointer;transition:0.3s;
        }
        .card-kategori:hover{background:rgba(212, 175, 55, 0.1);border-color:#D4AF37;transform:translateY(-5px);box-shadow:0 12px 30px rgba(212,175,55,0.1);}
        .card-kategori .icon{font-size:32px;display:inline-block;animation:floatIcon 3s ease-in-out infinite;}
        @keyframes floatIcon {0%{transform:translateY(0px);}50%{transform:translateY(-5px);}100%{transform:translateY(0px);}}
        .card-kategori .nama{color:#fff;font-size:18px;font-weight:bold;margin:5px 0;}
        .card-kategori .jumlah{color:#D4AF37;font-size:14px;}

        #post-list{
            display:grid;grid-template-columns:1fr;gap:20px;align-items:start;justify-content:center;
            transition: all 1.2s ease;
        }
        .poster{
            background:rgba(21, 21, 21, 0.4);
            border:1px solid rgba(255, 255, 255, 0.08);
            border-radius:24px;overflow:hidden;padding:20px;transition:0.3s;position:relative;
            backdrop-filter: blur(6px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            transform: scale(1);
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.2s ease;
        }
        .poster:hover{border-color:#D4AF37;transform:scale(1.02);box-shadow:0 12px 40px rgba(212,175,55,0.05);}
        
        .poster-id-wrapper{text-align:center;margin-top:-10px;margin-bottom:10px;}
        .poster-id{display:inline-block;background:rgba(0,0,0,0.6);color:#D4AF37;padding:4px 12px;border-radius:12px;font-size:11px;font-weight:bold;letter-spacing:0.5px;}

        .carousel-container{position:relative;width:100%;overflow:hidden;border-radius:16px;margin-bottom:15px;touch-action:pan-y;box-shadow:0 8px 25px rgba(0,0,0,0.3);}
        .carousel-track{display:flex;transition:transform 0.3s ease;}
        .carousel-slide{min-width:100%;position:relative;}
        .carousel-slide img{width:100%;height:auto;border-radius:16px;display:block;max-height:600px;object-fit:cover;}
        .carousel-slide .slide-number{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.7);color:#fff;padding:4px 10px;border-radius:12px;font-size:12px;}
        .carousel-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.6);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:24px;cursor:pointer;z-index:10;backdrop-filter:blur(4px);}
        .carousel-btn:hover{background:#D4AF37;color:#111;}
        .carousel-btn.prev{left:10px;}
        .carousel-btn.next{right:10px;}

        .poster h3{color:#D4AF37;font-size:24px;margin-bottom:10px;text-align:center;letter-spacing:1px;}
        .poster .sub-caption{color:#bdbdbd;font-size:16px;margin-bottom:15px;font-style:italic;text-align:center;}
        .poster-content-wrapper{position:relative;color:#ddd;line-height:1.8;font-size:16px;overflow:hidden;transition:max-height 0.4s ease;text-align:center;}
        .poster-content-wrapper.collapsed{max-height:250px;}
        .poster-content-wrapper.expanded{max-height:2000px;}
        .read-more-btn{display:inline-block;margin-top:10px;background:transparent;color:#D4AF37;border:none;font-weight:bold;cursor:pointer;font-size:15px;padding:5px 0;text-decoration:underline;}
        .read-more-btn:hover{color:#fff;}

        .divider{width:60%;height:1px;background:rgba(212, 175, 55, 0.3);margin:20px auto;opacity:0.5;}

        .poster .tags-wrapper{margin-top:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
        .poster .tags-label{color:#bdbdbd;font-size:14px;font-weight:bold;margin-bottom:5px;}
        .poster .tag-container{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;}
        .poster .tag{background:transparent;color:#D4AF37;border:1px solid #D4AF37;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:bold;}
        
        .poster .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px;align-items:center;justify-content:center;}
        .poster .actions button{
            background: linear-gradient(135deg, #D4AF37, #E6B800);
            color:#111;border:none;padding:8px 18px;border-radius:20px;font-weight:bold;cursor:pointer;font-size:14px;box-shadow:0 4px 10px rgba(212,175,55,0.2);transition:0.3s;
        }
        .poster .actions button:hover{transform:scale(1.02);}

        .poster .sosial-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;align-items:center;justify-content:center;}
        .poster .sosial-actions button{
            background:transparent;color:#D4AF37;border:1px solid #D4AF37;padding:8px 16px;border-radius:25px;font-weight:bold;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px;transition:0.3s;
        }
        .poster .sosial-actions button:hover{background:#D4AF37;color:#111;transform:scale(1.02);}
        .poster .sosial-actions button .icon{font-size:18px;}
        
        .btn-save{display:flex;align-items:center;gap:5px;background:transparent;border:1px solid #D4AF37;padding:8px 16px;border-radius:25px;color:#D4AF37;font-weight:bold;cursor:pointer;font-size:14px;transition:0.3s;}
        .btn-save:hover{background:#D4AF37;color:#111;transform:scale(1.02);}
        .btn-save.saved{background:#D4AF37;color:#111;border-color:#D4AF37;}

        .loading{text-align:center;color:#888;padding:20px;font-size:18px;}
        
        @media(min-width:600px){
            #post-list:not(.compact-view){grid-template-columns:repeat(2, 1fr);}
        }
        @media(min-width:900px){
            #post-list:not(.compact-view){grid-template-columns:repeat(3, 1fr);}
        }

        .btn-float-common{
            position:fixed; bottom:25px; z-index:100;
            width:55px; height:55px; border-radius:50%;
            background:rgba(20, 20, 20, 0.8);
            border: 2px solid #D4AF37;
            color:#D4AF37; font-size:24px;
            box-shadow:0 4px 15px rgba(0,0,0,0.5);
            cursor:pointer; transition:0.3s;
            display:flex; justify-content:center; align-items:center;
            backdrop-filter: blur(4px);
            animation: floatBtn 3s ease-in-out infinite;
        }
        @keyframes floatBtn {0%{transform:translateY(0px);}50%{transform:translateY(-3px);}100%{transform:translateY(0px);}}
        .btn-float-common:hover{transform:scale(1.05);background:rgba(212, 175, 55, 0.2);}

        .sound-float-btn{right:25px;}
        .sound-float-btn.silent{border-color:#555;color:#888;}
        .sound-float-btn.playing{border-color:#D4AF37;color:#D4AF37;}

        .view-float-btn{left:25px;}
        .view-float-btn.active{border-color:#D4AF37;color:#D4AF37;}


        #post-list.compact-view {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 900px;
            margin: 0 auto;
            padding: 10px 0;
            align-items: center;
            width: 100%;
        }
        #post-list.compact-view .poster {
            width: 100%;
            max-width: 800px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 18px;
            border-radius: 16px;
            flex-wrap: wrap;
            transform: scale(0.98);
            margin: 0 auto;
        }
        #post-list.compact-view .carousel-container {
            width: 70px;
            height: 70px;
            min-width: 70px;
            margin: 0;
            border-radius: 12px;
            box-shadow: none;
            flex-shrink: 0;
            overflow: hidden;
        }
        #post-list.compact-view .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            max-height: 70px;
        }
        #post-list.compact-view .carousel-btn,
        #post-list.compact-view .poster-id-wrapper,
        #post-list.compact-view .read-more-btn,
        #post-list.compact-view .sosial-actions,
        #post-list.compact-view .tags-wrapper,
        #post-list.compact-view .divider {
            display: none;
        }
        #post-list.compact-view .poster-content-wrapper {
            max-height: 35px;
            font-size: 13px;
            text-align: left;
            display: block;
            padding-right: 10px;
        }
        #post-list.compact-view .poster-content-wrapper.collapsed {
            max-height: 35px;
        }
        #post-list.compact-view h3 {
            font-size: 16px;
            margin: 0 0 3px 0;
            text-align: left;
            color: #D4AF37;
            flex: 1 1 100%;
            width: 100%;
        }
        #post-list.compact-view .sub-caption {
            font-size: 13px;
            margin: 0 0 5px 0;
            text-align: left;
            line-height: 1.2;
            width: 100%;
        }
        #post-list.compact-view .actions {
            gap: 6px;
            margin-top: 0;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            width: 100%;
        }
        #post-list.compact-view .actions button {
            font-size: 11px;
            padding: 5px 12px;
            background: transparent;
            color: #D4AF37;
            border: 1px solid #D4AF37;
        }
        #post-list.compact-view .actions button:hover {
            background: #D4AF37;
            color: #111;
        }
    </style>
</head>
<body>

    <div class="follow-wrapper">
        <div class="follow-text">Mari follow akun dakwah kami untuk konten manhaj salaf bermanfaat lainnya</div>
        <div class="sosmed-container">
            <a href="https://www.instagram.com/tauhidsunnah_id" target="_blank" class="btn-sosmed">➡️ @tauhidsunnah_id</a>
            <a href="https://www.instagram.com/an.nashiha_daily" target="_blank" class="btn-sosmed">➡️ @an.nashiha_daily</a>
            <a href="https://www.instagram.com/studi_islam._id" target="_blank" class="btn-sosmed">➡️ @studi_islam._id</a>
        </div>
    </div>

    <div class="brand-wrapper">
        <span class="circuit-line left"></span>
        <span class="developer-name">Muhram Nur Surisma</span>
        <span class="circuit-line right"></span>
        <div class="developer-title">Digital Dakwah Developer</div>
        <div class="brand-divider"></div>
    </div>

    <div class="nav-top-wrapper">
        <button class="btn-nav" onclick="tampilkanFavorit()">🔖 Disimpan</button>
        <button class="btn-nav" onclick="resetSemua()">📚 Semua</button>
    </div>

    <div class="nav-middle-wrapper">
        <button class="btn-nav-beranda" onclick="resetSemua()">↖️ Pilih Mode Beranda ↗️</button>
    </div>

    <div class="header-container">
        <h1>Arsip Dakwah</h1>
        <div class="sub-title">📚 Manhaj Salaf 📚</div>
    </div>

    <div class="search-wrapper">
        <input type="text" id="search" placeholder="🔍 Cari judul, sub judul, kategori, tag, atau isi caption...">
        <div id="search-result"></div>
    </div>

    <div id="kategori-wrap" class="kategori-container"></div>
    <div id="post-list" class="loading">Memuat arsip...</div>

    <button class="btn-float-common view-float-btn" id="viewToggle" onclick="toggleView()">🔠</button>
    <button class="btn-float-common sound-float-btn silent" id="soundBtn" onclick="toggleSuara()">🔇</button>

    <audio id="bgAudio" loop>
        <source src="suara-ombak.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script>
        const daftarFolder = [
            "posters/tauhid/tauhid-001", 
            "posters/syirik/syirik-001", 
            "posters/sunnah/sunnah-001",
            "posters/bidah/bidah-001",
            "posters/tafsir/tafsir-001",
            "posters/hadits/hadits-001",
            "posters/aqidah/aqidah-001",
            "posters/aqidah/aqidah-002" // Tambahan Aqidah Kedua
        ];
        let kategoriData = {};
        let kategoriAktif = null;
        let semuaPosterCache = [];
        let isCompactView = false;

        function getFavorit() {
            const data = localStorage.getItem('dakwahFavorit');
            return data ? JSON.parse(data) : [];
        }

        function toggleFavorit(id, btn) {
            let fav = getFavorit();
            if(fav.includes(id)) {
                fav = fav.filter(f => f !== id);
                btn.classList.remove('saved');
                btn.innerHTML = '🔖 Belum Disimpan';
            } else {
                fav.push(id);
                btn.classList.add('saved');
                btn.innerHTML = '🔖 Sudah Disimpan';
            }
            localStorage.setItem('dakwahFavorit', JSON.stringify(fav));
        }

        function tampilkanFavorit() {
            const fav = getFavorit();
            const posters = document.querySelectorAll('.poster');
            posters.forEach(p => {
                const id = p.getAttribute('data-id');
                p.style.display = fav.includes(id) ? 'block' : 'none';
            });
            document.getElementById('search').value = '';
            document.getElementById('search-result').style.display = 'none';
            setTimeout(() => {
                const target = document.getElementById('post-list');
                if(target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 200);
        }

        function resetSemua() {
            const posters = document.querySelectorAll('.poster');
            posters.forEach(p => p.style.display = 'block');
            document.getElementById('search').value = '';
            document.getElementById('search-result').style.display = 'none';
            document.querySelectorAll('.card-kategori').forEach(el => el.style.borderColor = 'rgba(255, 255, 255, 0.05)');
            kategoriAktif = null;
            setTimeout(() => {
                const target = document.getElementById('post-list');
                if(target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 200);
        }

        function downloadFile(url, nama) {
            const a = document.createElement('a');
            a.href = url;
            a.download = nama || 'file';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function copyCaptionDariElemen(btn) {
            const poster = btn.closest('.poster');
            const judul = poster.querySelector('h3')?.innerText || '';
            const sub = poster.querySelector('.sub-caption')?.innerText || '';
            const contentWrapper = poster.querySelector('.poster-content-wrapper');
            const isi = contentWrapper ? contentWrapper.innerText : '';
            const konten = `${judul}\n\n${sub}\n\n${isi}`;
            navigator.clipboard.writeText(konten).then(() => {
                alert("✅ Caption berhasil disalin!");
            }).catch(() => {
                alert("❌ Gagal menyalin. Silakan salin secara manual.");
            });
        }

        async function loadPosters() {
            const container = document.getElementById('post-list');
            const kategoriWrap = document.getElementById('kategori-wrap');
            container.innerHTML = '<div class="loading">📂 Memuat arsip...</div>';
            
            let htmlPoster = '';
            const favList = getFavorit();
            
            for (let folder of daftarFolder) {
                try {
                    const res = await fetch(`${folder}/poster.md`);
                    if (!res.ok) continue;
                    
                    const text = await res.text();
                    const dataMatch = text.match(/---([\s\S]*?)---/);
                    const contentBody = text.replace(/---([\s\S]*?)---/, '').trim();
                    const info = {};

                    if (dataMatch) {
                        dataMatch[1].split('\n').forEach(line => {
                            const [key, val] = line.split(':').map(s => s.trim());
                            if(key && val) info[key] = val.replace(/^"|"$/g,'');
                        });
                    }

                    const judul = info.judul || "Tanpa Judul";
                    const subJudul = info.sub_judul || "";
                    const kategori = info.kategori || "Umum";
                    const tagArray = info.tags ? info.tags.split(',').map(t => t.trim()) : [];
                    const pdfSrc = info.pdf ? `${folder}/${info.pdf}` : null;
                    const imagesStr = info.images || "1.jpg";
                    const imageList = imagesStr.split(',').map(s => s.trim());
                    const posterId = folder.replace('posters/', '').replace(/\//g, '-');

                    if(!kategoriData[kategori]) kategoriData[kategori] = 0;
                    kategoriData[kategori]++;

                    semuaPosterCache.push({ id: posterId, judul, subJudul, kategori, tags: tagArray.join(' '), caption: contentBody });

                    const isSaved = favList.includes(posterId);
                    const parsedContent = marked.parse(contentBody);

                    let carouselHTML = '';
                    if (imageList.length === 1) {
                        carouselHTML = `<img src="${folder}/${imageList[0]}" alt="${judul}" onerror="this.style.display='none'" style="max-width:100%;height:auto;border-radius:16px;display:block;max-height:600px;object-fit:cover;">`;
                    } else {
                        carouselHTML = `
                        <div class="carousel-container" id="carousel-${posterId}">
                            <div class="carousel-track" id="track-${posterId}">
                                ${imageList.map((img, idx) => `
                                    <div class="carousel-slide" onclick="event.stopPropagation()">
                                        <img src="${folder}/${img}" alt="${judul} - Slide ${idx+1}" onerror="this.style.display='none'">
                                        <div class="slide-number">${idx+1} / ${imageList.length}</div>
                                    </div>
                                `).join('')}
                            </div>
                            <button class="carousel-btn prev" onclick="slideCarousel('${posterId}', -1)">❮</button>
                            <button class="carousel-btn next" onclick="slideCarousel('${posterId}', 1)">❯</button>
                        </div>
                        `;
                    }

                    htmlPoster += `
                        <div class="poster" data-id="${posterId}" data-kategori="${kategori}">
                            ${carouselHTML}
                            <div class="poster-id-wrapper">
                                <span class="poster-id">${posterId}</span>
                            </div>
                            <h3>${judul}</h3>
                            ${subJudul ? `<div class="sub-caption">${subJudul}</div>` : ''}
                            <div class="poster-content-wrapper collapsed" id="content-${posterId}">${parsedContent}</div>
                            <button class="read-more-btn" id="btn-${posterId}" onclick="toggleReadMore('${posterId}')">📖 Baca Selengkapnya</button>
                            <div class="actions">
                                ${pdfSrc ? `<button onclick="downloadFile('${pdfSrc}', '${judul}.pdf')">📄 Download PDF</button>` : ''}
                                <button onclick="downloadMultiImage('${posterId}')">🖼️ Download Gambar</button>
                                <button onclick="copyCaptionDariElemen(this)">📋 Copy Caption</button>
                            </div>
                            <hr class="divider">
                            <div class="sosial-actions">
                                <button class="btn-save ${isSaved ? 'saved' : ''}" onclick="toggleFavorit('${posterId}', this)">${isSaved ? '🔖 Sudah Disimpan' : '🔖 Belum Disimpan'}</button>
                                <button onclick="sharePoster('${judul}', '${window.location.href}')">
                                    <span class="icon">✈️</span> Kirim ke Teman
                                </button>
                                <button onclick="dmInstagram()">
                                    <span class="icon">💬</span> DM
                                </button>
                            </div>
                            <hr class="divider">
                            ${tagArray.length > 0 ? `
                            <div class="tags-wrapper">
                                <span class="tags-label">Tagar :</span>
                                <div class="tag-container">
                                    ${tagArray.map(t => `<span class="tag">${t}</span>`).join('')}
                                </div>
                            </div>
                            ` : ''}
                        </div>
                    `;

                } catch(e) { console.log("Gagal memuat folder:", folder); }
            }

            container.innerHTML = htmlPoster || '<div class="loading">Belum ada poster.</div>';
            let htmlKategori = '';
            for(let [nama, jumlah] of Object.entries(kategoriData)) {
                let icon = '📂';
                if(nama === 'Tauhid') icon = '☝️';
                else if(nama === 'bidah') icon = '🚫';
                else if(nama === 'Syirik') icon = '⚠️';
                else if(nama === 'Sunnah') icon = '👤';
                else if(nama === 'Tafsir') icon = '📖';
                else if(nama === 'Hadits') icon = '🗨️';
                else if(nama === 'Aqidah') icon = '🛡️';
                htmlKategori += `
                    <div class="card-kategori" onclick="filterKategori('${nama}')">
                        <div class="icon">${icon}</div>
                        <div class="nama">${nama}</div>
                        <div class="jumlah">${jumlah} Poster</div>
                    </div>
                `;
            }
            kategoriWrap.innerHTML = htmlKategori;
        }

        let carouselIndex = {};

        function slideCarousel(id, dir) {
            if (!carouselIndex[id]) carouselIndex[id] = 0;
            const track = document.getElementById(`track-${id}`);
            if (!track) return;
            const slides = track.querySelectorAll('.carousel-slide');
            const max = slides.length;
            carouselIndex[id] = (carouselIndex[id] + dir + max) % max;
            track.style.transform = `translateX(-${carouselIndex[id] * 100}%)`;
        }

        async function downloadMultiImage(id) {
            const poster = document.querySelector(`.poster[data-id="${id}"]`);
            const track = poster?.querySelector('.carousel-track');
            if (!track) {
                const img = poster?.querySelector('img');
                if (img && img.src) downloadFile(img.src, 'poster.jpg');
                return;
            }
            const slides = track.querySelectorAll('.carousel-slide');
            if (slides.length === 0) return;
            const choice = prompt(`Pilih slide yang ingin didownload (pisahkan dengan koma), atau ketik "all" untuk semua.\nTersedia: 1 - ${slides.length}`);
            if (!choice) return;
            if (choice.toLowerCase() === 'all') {
                for (let i = 0; i < slides.length; i++) {
                    const img = slides[i].querySelector('img');
                    if (img && img.src) downloadFile(img.src, `${id}-${i+1}.jpg`);
                }
                alert(`✅ Semua ${slides.length} gambar sedang didownload.`);
            } else {
                const selected = choice.split(',').map(n => parseInt(n.trim()) - 1).filter(n => n >= 0 && n < slides.length);
                if (selected.length === 0) return alert("Tidak ada slide yang valid.");
                for (let i of selected) {
                    const img = slides[i].querySelector('img');
                    if (img && img.src) downloadFile(img.src, `${id}-${i+1}.jpg`);
                }
                alert(`✅ ${selected.length} gambar sedang didownload.`);
            }
        }

        function toggleReadMore(id) {
            const content = document.getElementById(`content-${id}`);
            const btn = document.getElementById(`btn-${id}`);
            if (content.classList.contains('collapsed')) {
                content.classList.remove('collapsed');
                content.classList.add('expanded');
                btn.innerText = '📕 Tutup';
            } else {
                content.classList.remove('expanded');
                content.classList.add('collapsed');
                btn.innerText = '📖 Baca Selengkapnya';
            }
        }

        function filterKategori(nama) {
            kategoriAktif = nama;
            document.querySelectorAll('.card-kategori').forEach(el => {
                const namaEl = el.querySelector('.nama').innerText;
                el.style.borderColor = (namaEl === nama) ? '#D4AF37' : 'rgba(255, 255, 255, 0.05)';
            });
            const posters = document.querySelectorAll('.poster');
            let adaPoster = false;
            posters.forEach(poster => {
                const kategori = poster.getAttribute('data-kategori');
                if(kategori === nama) { poster.style.display = 'block'; adaPoster = true; } 
                else { poster.style.display = 'none'; }
            });
            if(adaPoster) {
                setTimeout(() => {
                    const target = document.getElementById('post-list');
                    if(target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 300);
            }
            document.getElementById('search-result').style.display = 'none';
        }

        function sharePoster(judul, url) {
            const textToCopy = `Cari "${judul}" di situs ini: ${url}`;
            if (navigator.share) {
                navigator.share({ title: judul, url: url });
            } else {
                navigator.clipboard.writeText(textToCopy);
                alert("✅ Link poster berhasil disalin!");
            }
        }

        function dmInstagram() {
            window.open('https://www.instagram.com/tauhidsunnah_id', '_blank');
        }

        const searchInput = document.getElementById('search');
        const resultBox = document.getElementById('search-result');

        let timeoutId;

        searchInput.addEventListener('input', function() {
            clearTimeout(timeoutId); 
            
            timeoutId = setTimeout(() => {
                const key = this.value.trim().toLowerCase();
                if (key === '') {
                    resultBox.style.display = 'none';
                    resultBox.innerHTML = '';
                    document.querySelectorAll('.poster').forEach(p => p.style.display = 'block');
                    document.querySelectorAll('.highlight').forEach(el => {
                        el.outerHTML = el.innerText;
                    });
                    return;
                }

                const hasil = semuaPosterCache.filter(item => 
                    item.judul.toLowerCase().includes(key) ||
                    item.subJudul.toLowerCase().includes(key) ||
                    item.kategori.toLowerCase().includes(key) ||
                    item.tags.toLowerCase().includes(key) ||
                    item.caption.toLowerCase().includes(key)
                );

                if (hasil.length > 0) {
                    resultBox.style.display = 'block';
                    resultBox.innerHTML = hasil.map(item => `
                        <div class="search-item" onclick="pilihDariDropdown('${item.id}')">
                            <span>📚 ${item.judul}</span>
                            <small>📂 ${item.kategori}</small>
                        </div>
                    `).join('');
                } else {
                    resultBox.style.display = 'block';
                    resultBox.innerHTML = `<div class="search-item" style="cursor:default;color:#888;">Tidak ada hasil.</div>`;
                }

                const posters = document.querySelectorAll('.poster');
                posters.forEach(poster => {
                    const text = poster.innerText.toLowerCase();
                    poster.style.display = text.includes(key) ? 'block' : 'none';
                });

                setTimeout(() => {
                    document.querySelectorAll('.highlight').forEach(el => {
                        el.outerHTML = el.innerText;
                    });
                    highlightText(key);
                }, 100);
            }, 300);
        });

        function pilihDariDropdown(id) {
            document.getElementById('search-result').style.display = 'none';
            document.getElementById('search').value = '';
            
            const posters = document.querySelectorAll('.poster');
            posters.forEach(p => {
                const pid = p.getAttribute('data-id');
                p.style.display = (pid === id) ? 'block' : 'none';
            });

            setTimeout(() => {
                const key = document.getElementById('search').value.trim().toLowerCase();
                if (key) highlightText(key);
                document.getElementById('post-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 200);
        }

        function highlightText(key) {
            document.querySelectorAll('.highlight').forEach(el => {
                el.outerHTML = el.innerText;
            });
            const posters = document.querySelectorAll('.poster');
            posters.forEach(poster => {
                if (poster.style.display !== 'none') {
                    const judulEl = poster.querySelector('h3');
                    if (judulEl) {
                        const judulText = judulEl.innerHTML;
                        const regex = new RegExp(`(${key})`, 'gi');
                        judulEl.innerHTML = judulText.replace(regex, '<span class="highlight" style="background:#4A90E2;color:#fff;">$1</span>');
                    }
                    const contentWrapper = poster.querySelector('.poster-content-wrapper');
                    if (contentWrapper) {
                        const contentText = contentWrapper.innerHTML;
                        const regex = new RegExp(`(${key})`, 'gi');
                        contentWrapper.innerHTML = contentText.replace(regex, '<span class="highlight" style="background:#4A90E2;color:#fff;">$1</span>');
                    }
                }
            });
        }

        loadPosters();


        // =============================================
        // FITUR TOGGLE VIEW (LIST / GRID)
        // =============================================
        function toggleView() {
            const list = document.getElementById('post-list');
            const btn = document.getElementById('viewToggle');
            isCompactView = !isCompactView;
            
            if (isCompactView) {
                list.classList.add('compact-view');
                btn.innerHTML = '🅰️';
                btn.title = "Kembali ke Tampilan Grid";
            } else {
                list.classList.remove('compact-view');
                btn.innerHTML = '🔠';
                btn.title = "Ubah ke Tampilan Daftar Kompak";
            }
        }


        // =============================================
        // FITUR SUARA (POJOK KANAN BAWAH)
        // =============================================
        const bgAudio = document.getElementById('bgAudio');
        const soundBtn = document.getElementById('soundBtn');
        let suaraMenyala = false;

        function toggleSuara() {
            suaraMenyala = !suaraMenyala;
            if (suaraMenyala) {
                bgAudio.volume = 0.8;
                bgAudio.play();
                soundBtn.innerHTML = '🔊';
                soundBtn.classList.remove('silent');
                soundBtn.classList.add('playing');
            } else {
                bgAudio.pause();
                soundBtn.innerHTML = '🔇';
                soundBtn.classList.remove('playing');
                soundBtn.classList.add('silent');
            }
        }
    </script>
</body>
