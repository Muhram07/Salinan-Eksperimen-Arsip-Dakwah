name: Auto Extract Poster ZIP

on:
  push:
    paths:
      - '_uploads/*.zip'
    branches:
      - main

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & PyYAML
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyyaml

      - name: Run Extract and Scan Script
        run: python .github/scripts/extract_zip.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 Auto-extract poster & Update Manifest'
          branch: main
          file_pattern: 'posters/**/* _uploads/* manifest.json'
          push_options: '--force'
