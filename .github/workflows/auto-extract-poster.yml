name: Auto Extract Poster ZIP

on:
  push:
    paths:
      - '_uploads/*.zip'
    branches:
      - main

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. Ambil kode repositori terbaru
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Upgrade pip & Install PyYAML (Diperbaiki agar tidak error)
      - name: Install PyYAML
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      # 4. Jalankan Script Ekstraksi
      - name: Run Extract Script
        run: python .github/scripts/extract_zip.py

      # 5. Commit & Push hasil ekstraksi otomatis
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 Auto-extract poster from ZIP'
          branch: main
          file_pattern: 'posters/**/* _uploads/*'
          push_options: '--force'
