<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin Arsip Dakwah</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
        body{background:#0d1117;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;}
        #loginPage,#dashboard,#uploadPage{width:100%;}
        .login-box{max-width:650px;margin:auto;background:#161b22;border:1px solid #30363d;border-radius:22px;padding:35px;box-shadow:0 0 35px rgba(0,0,0,.45);}
        .login-box h1{text-align:center;color:#FFD700;font-size:34px;margin-bottom:12px;}
        .login-box p{text-align:center;color:#bdbdbd;margin-bottom:25px;line-height:1.5;}
        input,select,textarea{width:100%;padding:16px;margin-bottom:18px;background:#0d1117;color:white;border:2px solid #30363d;border-radius:12px;font-size:16px;outline:none;transition:.25s;}
        input:focus,select:focus,textarea:focus{border-color:#FFD700;}
        textarea{min-height:170px;resize:vertical;}
        button{width:100%;padding:16px;margin-top:10px;font-size:18px;font-weight:bold;border:none;border-radius:12px;background:#FFD700;color:#111;cursor:pointer;transition:.25s;}
        button:hover{transform:scale(1.02);}
        #status{margin-top:18px;text-align:center;color:#ff5b5b;font-weight:bold;}
        .menu{display:flex;flex-direction:column;gap:15px;margin-top:20px;}
        #posterList{color:#bdbdbd;margin-top:10px;font-size:14px;}
        @media(max-width:600px){.login-box{padding:22px;}.login-box h1{font-size:28px;}}
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage">
    <div class="login-box">
        <h1>📚 Admin Arsip Dakwah</h1>
        <p>Masukkan PIN Admin</p>
        <input type="password" id="pin" placeholder="PIN">
        <button id="loginBtn">Masuk</button>
        <p id="status"></p>
    </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">
    <div class="login-box">
        <h1>📚 Dashboard Admin</h1>
        <p>Selamat Datang, <b id="adminName">Admin</b></p>
        <div class="menu">
            <button id="btnTambah">🖼 Tambah Poster</button>
            <button id="btnArsip">📂 Semua Arsip</button>
            <button id="btnStatistik">📊 Statistik</button>
            <button id="btnSetting">⚙ Pengaturan</button>
            <button id="logout">🚪 Logout</button>
        </div>
    </div>
</div>

<!-- UPLOAD (FITUR LENGKAP) -->
<div id="uploadPage" style="display:none;">
    <div class="login-box">
        <h1>🖼 Tambah Poster</h1>
        <p>Lengkapi data poster</p>
        
        <label><b>Poster (Boleh banyak gambar)</b></label>
        <input type="file" id="posterFile" accept="image/*" multiple>
        <div id="posterList"></div>
        <br>

        <label><b>PDF (Opsional)</b></label>
        <input type="file" id="pdfFile" accept=".pdf">
        <br>

        <input type="text" id="judul" placeholder="Judul Poster">
        
        <select id="kategori">
            <option>Tauhid</option><option>Sunnah</option><option>Bid'ah</option>
            <option>Syirik</option><option>Khurafat</option><option>Aqidah</option>
            <option>Fikih</option><option>Hadits</option><option>Tafsir</option>
            <option>Akhlak</option><option>Muamalah</option><option>Tanya Jawab</option>
        </select>

        <input type="text" id="tag" placeholder="Tag (pisahkan dengan koma)">
        <textarea id="caption" placeholder="Caption Pendek"></textarea>
        <textarea id="content" placeholder="Isi Caption Lengkap"></textarea>

        <button id="btnPreview">👁 Preview</button>
        <button id="btnSimpan">🚀 Simpan Poster</button>
        <button id="btnKembali">⬅ Kembali ke Dashboard</button>
    </div>
</div>

<script>
    const PIN = "123456";

    const loginPage = document.getElementById("loginPage");
    const dashboard = document.getElementById("dashboard");
    const pinInput = document.getElementById("pin");
    const loginBtn = document.getElementById("loginBtn");
    const statusText = document.getElementById("status");
    const logoutBtn = document.getElementById("logout");

    const posterFile = document.getElementById("posterFile");
    const posterList = document.getElementById("posterList");
    const simpanBtn = document.getElementById("btnSimpan");
    const previewBtn = document.getElementById("btnPreview");

    // LOGIN
    loginBtn.onclick = function() {
        if(pinInput.value === PIN){
            localStorage.setItem("adminLogin", "true");
            loginPage.style.display = "none";
            dashboard.style.display = "block";
        } else {
            statusText.innerHTML = "❌ PIN Salah";
            pinInput.value = "";
        }
    };

    // LOGOUT
    logoutBtn.onclick = function() {
        localStorage.removeItem("adminLogin");
        location.reload();
    };

    // NAVIGASI
    document.getElementById("btnTambah").onclick = function() {
        document.getElementById("dashboard").style.display = "none";
        document.getElementById("uploadPage").style.display = "block";
    };
    document.getElementById("btnKembali").onclick = function() {
        document.getElementById("uploadPage").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
    };
    document.getElementById("btnArsip").onclick = function() { location.href = "arsip.html"; };
    document.getElementById("btnStatistik").onclick = function() { alert("Halaman Statistik akan dibuat."); };
    document.getElementById("btnSetting").onclick = function() { alert("Halaman Pengaturan akan dibuat."); };

    // DAFTAR GAMBAR
    posterFile.onchange = function() {
        posterList.innerHTML = "";
        const files = this.files;
        if(files.length === 0) return;
        let html = "<br><b>" + files.length + " Part Dipilih</b><br><br>";
        for(let i = 0; i < files.length; i++) {
            html += "✅ Part " + (i + 1) + " : " + files[i].name + "<br>";
        }
        posterList.innerHTML = html;
    };

    // PREVIEW
    previewBtn.onclick = function() {
        const judul = document.getElementById("judul").value;
        const kategori = document.getElementById("kategori").value;
        const total = posterFile.files.length;
        alert("========== PREVIEW ==========\n\nJudul : " + judul + "\nKategori : " + kategori + "\nJumlah Part : " + total + "\n\nSiap dipublikasikan.");
    };

    // SIMPAN (Mengarah ke API Vercel /api.js)
    simpanBtn.onclick = async function() {
        const judul = document.getElementById("judul").value.trim();
        const kategori = document.getElementById("kategori").value;
        const tags = document.getElementById("tag").value;
        const caption = document.getElementById("caption").value;
        const content = document.getElementById("content").value;
        const file = posterFile.files[0];

        if (!judul) return alert("Masukkan judul poster.");
        if (!file) return alert("Pilih minimal satu gambar.");

        simpanBtn.disabled = true;
        simpanBtn.textContent = "⏳ Mengupload...";

        const reader = new FileReader();
        reader.onload = async function(e) {
            const base64String = e.target.result.split(',')[1];
            try {
                // PERUBAHAN: Arahkan ke /api.js, bukan /api/main.ts
                const response = await fetch('/api.js', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: judul,
                        category: kategori,
                        tags: tags,
                        caption: caption,
                        content: content,
                        imageBase64: base64String,
                        filename: file.name
                    })
                });
                const result = await response.json();
                if(result.success) {
                    alert("✅ " + result.message);
                    location.reload();
                } else {
                    alert("❌ Gagal: " + result.message);
                }
            } catch(error) {
                alert("❌ Error: " + error.message);
            } finally {
                simpanBtn.disabled = false;
                simpanBtn.textContent = "🚀 Simpan Poster";
            }
        };
        reader.readAsDataURL(file);
    };
</script>
</body>
  </html>
